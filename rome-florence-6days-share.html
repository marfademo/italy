<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>罗马 + 佛罗伦萨 6 天 City Walk 路线图</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""/>
<style>
  :root{
    --pink:#ff6b9d;
    --pink-soft:#ffd6e7;
    --pink-deep:#e63475;
    --green:#7ec850;
    --green-soft:#e7f5d6;
    --green-deep:#3a8a2c;
    --beige:#f8efe1;
    --cream:#fff8ec;
    --ink:#2b2b2b;
    --ink-soft:#5b5b5b;
    --river:#cfe7ff;
    --river-deep:#7cc0ec;
    --park:#dff0c8;
    --park-deep:#a8c98a;
    --road:#f1ebda;
    --road-deep:#d8c79a;
    --block:#f5e9c7;
    --block-deep:#cdb16a;
    --warn:#e74c3c;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:#fdfaf3;font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink);}
  .page{max-width:1200px;margin:0 auto;background:#fffaf0;border:1px solid #f0e2c0;border-radius:18px;padding:24px 28px 30px;box-shadow:0 6px 24px rgba(160,120,60,.08);}

  /* ===== 顶部标题区 ===== */
  header{display:flex;align-items:center;justify-content:space-between;padding:6px 4px 18px;border-bottom:2px dashed #f1d9b6;margin-bottom:14px;}
  h1{font-size:42px;font-weight:900;letter-spacing:2px;margin:0;color:#2b2b2b;line-height:1.1;}
  h1 .day{color:var(--pink-deep);font-style:italic;font-weight:900;}
  h1 .small{font-size:20px;color:#a37a3c;font-weight:500;margin-left:6px;letter-spacing:1px;}
  .flag-ita{display:inline-block;width:30px;height:18px;border-radius:3px;vertical-align:middle;background:linear-gradient(90deg,#008c45 33%,#f4f5f0 33%,#f4f5f0 66%,#cd212a 66%);margin-left:6px;}
  .subtitle{display:inline-block;background:var(--pink-soft);color:var(--pink-deep);font-weight:700;padding:6px 16px;border-radius:20px;margin-top:8px;font-size:15px;letter-spacing:1px;}
  .city-icons{font-size:32px;}
  .city-label{font-weight:900;color:var(--pink-deep);font-size:20px;letter-spacing:2px;text-align:center;}
  .city-card{display:flex;flex-direction:column;align-items:center;gap:4px;}
  .city-tag{font-size:12px;color:#a37a3c;font-style:italic;}

  /* ===== 工具栏（编辑模式） ===== */
  .toolbar{display:flex;gap:8px;align-items:center;}
  .tool-btn{
    appearance:none;cursor:pointer;font-family:inherit;font-weight:900;
    font-size:13px;padding:8px 14px;border-radius:10px;
    background:var(--pink-soft);color:var(--pink-deep);
    border:2px solid var(--pink-deep);transition:all .15s;white-space:nowrap;
  }
  .tool-btn:hover{background:var(--pink-deep);color:#fff;}
  .tool-btn.ghost{background:transparent;color:#a37a3c;border-color:#f3d9a4;}
  .tool-btn.ghost:hover{background:#f3d9a4;color:var(--pink-deep);}
  body.edit-mode .tool-btn#edit-toggle{background:var(--pink-deep);color:#fff;}
  body.edit-mode .tool-btn#edit-toggle::before{content:"✅ ";}
  body.edit-mode .tool-btn#edit-toggle{font-size:0;}
  body.edit-mode .tool-btn#edit-toggle::before{font-size:13px;}

  /* ===== 顶部 Tab 栏 ===== */
  .tabs{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 16px;padding:6px;background:#fff5e3;border:2px solid #f3d9a4;border-radius:14px;}
  .tab{
    flex:1 1 auto;min-width:130px;
    appearance:none;cursor:pointer;
    background:#fffaf0;border:2px solid #f3d9a4;border-radius:10px;
    padding:10px 14px;font-family:inherit;font-weight:900;color:var(--ink-soft);
    display:flex;flex-direction:column;align-items:flex-start;gap:2px;
    transition:all .18s ease;
  }
  .tab:hover{border-color:var(--pink-deep);color:var(--pink-deep);transform:translateY(-1px);}
  .tab .tab-num{font-size:11px;letter-spacing:1px;color:#a37a3c;font-weight:700;}
  .tab .tab-title{font-size:14px;color:inherit;}
  .tab .tab-sub{font-size:11px;font-weight:500;color:#a37a3c;}
  .tab.active{background:linear-gradient(180deg,#ffd6e7,#ffb8d4);border-color:var(--pink-deep);color:var(--pink-deep);box-shadow:0 4px 10px rgba(230,52,117,.18);}
  .tab.active .tab-num,.tab.active .tab-sub{color:var(--pink-deep);}
  .tab.empty{cursor:default;opacity:.6;}
  .tab.active.empty{background:#fff5e3;border-color:#f3d9a4;color:var(--ink-soft);box-shadow:none;}

  /* ===== Day 内容 ===== */
  .day-panel{display:none;}
  .day-panel.active{display:grid;grid-template-columns:380px 1fr;gap:18px;background:#fffaf0;border:2px solid #f3d9a4;border-radius:16px;padding:14px;animation:fade .25s ease;align-items:start;}
  @keyframes fade{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}
  .day-panel .left-col{position:relative;display:flex;flex-direction:column;}
  .day-panel .right-col{background:var(--cream);border:2px solid #f3d9a4;border-radius:12px;padding:14px 16px;}
  .day-panel h2{margin:0 0 6px;font-size:24px;font-weight:900;color:var(--pink-deep);letter-spacing:1px;}
  .day-panel h2 .badge{background:var(--pink-deep);color:#fff;border-radius:8px;padding:1px 12px;margin-right:8px;font-size:18px;}
  .day-panel .date{font-size:13px;color:#a37a3c;font-weight:700;margin-bottom:8px;}
  .day-panel .city-tag-inline{display:inline-block;background:#fff5f8;border:1px solid #f5b4ce;color:#a37a3c;border-radius:10px;padding:2px 10px;font-size:11px;margin-left:6px;}

  /* ===== Leaflet 地图 ===== */
  .day-panel .left-col{position:relative;display:flex;flex-direction:column;min-height:620px;align-self:start;}
  .mapwrap{position:relative;background:#fbf5e3;border:2px solid #f3d9a4;border-radius:12px;padding:6px;flex:1;display:flex;flex-direction:column;min-height:520px;}
  .map{width:100%;flex:1;min-height:480px;border-radius:8px;overflow:hidden;box-shadow:0 2px 6px rgba(160,120,60,.12);}
  .hotel-marker{position:absolute;top:14px;left:14px;z-index:500;background:var(--pink-soft);color:var(--pink-deep);border:2px solid var(--pink-deep);font-weight:900;font-size:12px;padding:5px 10px;border-radius:8px;box-shadow:0 2px 4px rgba(224,52,117,.25);}
  /* 图例放在地图上方（不是叠在地图上） */
  .map-legend{
    position:relative;display:flex;gap:14px;justify-content:center;
    background:#fffaf0;border:1px solid #f3d9a4;border-radius:8px;
    padding:6px 10px;margin-bottom:6px;font-size:11px;font-weight:700;color:#5c3a00;line-height:1.6;
  }
  .map-legend .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:middle;}
  .map-legend .dot.walk{background:var(--pink-deep);}
  .map-legend .dot.taxi{background:var(--green-deep);}
  .map-legend .dot.hotel{background:#f5b4ce;border:2px solid var(--pink-deep);}

  /* 自定义 Leaflet 标记 */
  .leaflet-marker-num{
    width:32px;height:32px;border-radius:50% 50% 50% 0;
    background:var(--pink-deep);color:#fff;font-weight:900;font-size:14px;
    display:flex;align-items:center;justify-content:center;
    transform:rotate(-45deg);
    box-shadow:0 3px 6px rgba(0,0,0,.25);
    border:2px solid #fff;
  }
  .leaflet-marker-num>span{transform:rotate(45deg);line-height:1;}
  .leaflet-marker-num.hotel{background:#fff0d6;color:#7a4a00;border-color:var(--pink-deep);border-width:2.5px;}
  .leaflet-marker-num.dinner{background:var(--green-deep);color:#fff;}
  .leaflet-marker-num.sunset{background:#ff944d;color:#fff;}
  .leaflet-marker-num.bridge{background:#3a82c9;color:#fff;}
  .leaflet-marker-num.view{background:#d4a017;color:#fff;}

  .leaflet-popup-content{margin:10px 14px;font-family:inherit;min-width:160px;}
  .leaflet-popup-content b{color:var(--pink-deep);}
  .leaflet-popup-content small{color:#888;display:block;margin-top:2px;}

  /* ===== Day 1 跨境/航班抽象图 ===== */
  .transit-board{flex:1;background:#fbf5e3;border:2px solid #f3d9a4;border-radius:12px;padding:10px;display:flex;align-items:center;justify-content:center;min-height:520px;}
  .transit-board svg{width:100%;max-width:380px;height:auto;}

  /* ===== 编辑模式高亮 ===== */
  body.edit-mode .day-panel.active h2,
  body.edit-mode .day-panel.active .date,
  body.edit-mode .panel ul li{cursor:text;outline:1px dashed #f5b4ce;outline-offset:2px;border-radius:4px;transition:background .15s;}
  body.edit-mode .day-panel.active h2:hover,
  body.edit-mode .day-panel.active .date:hover,
  body.edit-mode .panel ul li:hover{background:#fff5f8;}
  body.edit-mode .panel{cursor:text;}
  body.edit-mode .info .enjoy{pointer-events:none;opacity:.6;}

  .del-row{margin-left:6px;border:none;background:#f08080;color:#fff;border-radius:50%;width:20px;height:20px;font-size:11px;cursor:pointer;line-height:1;font-weight:900;flex-shrink:0;}
  .del-row:hover{background:#c0392b;}
  body:not(.edit-mode) .del-row{display:none;}

  /* ===== 拖拽 ===== */
  .list-row[draggable]{cursor:grab;}
  .list-row[draggable]:active{cursor:grabbing;}
  .list-row.dragging{opacity:.4;background:#fff5f8;}
  .list-row.drag-over{box-shadow:inset 0 0 0 2px var(--pink-deep);}
  .panel ul li[draggable]{cursor:grab;}
  .panel ul li.dragging{opacity:.4;}
  .panel ul li.drag-over{box-shadow:inset 0 0 0 2px var(--pink-deep);}

  /* ===== 底部 li 删除按钮 ===== */
  .del-li{
    display:none;margin-left:6px;
    border:none;background:#f08080;color:#fff;
    border-radius:50%;width:18px;height:18px;
    font-size:10px;cursor:pointer;line-height:1;font-weight:900;
    vertical-align:middle;
  }
  .del-li:hover{background:#c0392b;}
  body.edit-mode .del-li{display:inline-block;}

  /* ===== 底部 li 新增按钮 ===== */
  .add-li{
    display:none;margin-top:6px;margin-left:8px;
    width:22px;height:22px;border-radius:50%;
    background:#3b82f6;color:#fff;border:none;
    font-size:13px;font-weight:900;cursor:pointer;
    align-items:center;justify-content:center;line-height:1;
    box-shadow:0 2px 4px rgba(59,130,246,.3);
  }
  .add-li:hover{background:#2563eb;}
  body.edit-mode .add-li{display:inline-flex;}

  /* ===== List 项通用 ===== */
  .list-row{
    display:flex;gap:10px;align-items:flex-start;
    margin:6px 0;padding:8px;border-radius:10px;
    background:#fffaf0;border:1px solid #f3d9a4;
    position:relative;transition:background .15s;
  }
  .list-row:hover{background:#fff5f8;}
  .list-row.active{background:#ffe6f0;box-shadow:inset 0 0 0 1px #f5b4ce;}

  /* 头部 icon（点击可切换） */
  .list-icon{
    flex:0 0 32px;width:32px;height:32px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-weight:900;font-size:14px;color:#fff;
    background:var(--pink-deep);cursor:pointer;
    user-select:none;flex-shrink:0;position:relative;
  }
  .list-icon:hover{transform:scale(1.08);}
  .list-row[data-type="meal"]      .list-icon{background:var(--green-deep);}
  .list-row[data-type="transport"] .list-icon{background:#2563eb;}

  /* 餐饮 list：仅 .list-time 文字颜色为绿色 */
  .list-row[data-type="meal"] .list-time{color:var(--green-deep);}
  .list-row[data-type="meal"] .list-time:empty::before{color:#bbb;}

  /* 主体 */
  .list-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px;}
  .list-name{display:flex;align-items:center;gap:6px;}
  .list-name b{font-size:14px;color:#2b2b2b;font-weight:900;}
  .list-locate{
    display:inline-flex;align-items:center;justify-content:center;
    width:20px;height:20px;border-radius:50%;background:#fff;color:#2563eb;
    border:1px solid #93c5fd;font-size:11px;text-decoration:none;
  }
  .list-locate:hover{background:#2563eb;color:#fff;}
  .list-action{font-size:12.5px;color:#444;padding:1px 2px;}
  .list-note{font-size:11.5px;color:#888;font-style:italic;padding:1px 2px;}

  /* 交通 list 时长 - 占位背景 */
  .list-transport-duration{
    border:none;background:transparent;color:#2563eb;
    font-weight:700;font-size:12px;padding:2px 4px;border-radius:4px;
    font-family:inherit;display:inline-block;min-height:0;min-width:0;
  }
  .list-transport-duration:empty{display:none;}
  body.edit-mode .list-transport-duration:empty{
    display:inline-block;min-height:18px;min-width:80px;
    outline:1px dashed #93c5fd;
  }
  body.edit-mode .list-transport-duration:empty::before{
    content:attr(data-placeholder);color:#bbb;font-style:italic;font-weight:400;
  }

  /* 停留时间（活动 / 饭点 list）- 仅作占位背景 */
  .list-time{
    border:none;background:transparent;color:var(--pink-deep);
    font-weight:700;font-size:12px;padding:1px 4px;border-radius:4px;
    font-family:inherit;display:inline-block;min-height:0;min-width:0;
  }
  /* 空时：编辑态用 ::before 展示占位文本（不与输入内容冲突） */
  .list-time:empty{display:none;}
  body.edit-mode .list-time:empty{
    display:inline-block;min-height:18px;min-width:80px;
    outline:1px dashed #f5b4ce;
  }
  body.edit-mode .list-time:empty::before{
    content:attr(data-placeholder);color:#bbb;font-style:italic;font-weight:400;
  }

  /* 空字段占位符：仅在编辑状态下显示（list-time / list-transport-duration / list-action / list-note）*/
  body.edit-mode .list-action.empty-field::before,
  body.edit-mode .list-note.empty-field::before,
  body.edit-mode .list-time.empty-field::before,
  body.edit-mode .list-transport-duration.empty-field::before{
    content:attr(data-placeholder);color:#bbb;font-style:italic;
  }
  body.edit-mode .list-action,
  body.edit-mode .list-note,
  body.edit-mode .list-time,
  body.edit-mode .list-transport-duration{border:1px dashed #f5b4ce;border-radius:4px;padding:2px 6px;min-height:18px;}
  body.edit-mode .list-action:focus,
  body.edit-mode .list-note:focus,
  body.edit-mode .list-time:focus,
  body.edit-mode .list-transport-duration:focus{outline:none;background:#fff5f8;}
  body:not(.edit-mode) .list-action.empty-field,
  body:not(.edit-mode) .list-note.empty-field{display:none;}

  /* list-row 删除按钮 */
  .del-row{
    margin-left:6px;border:none;background:#f08080;color:#fff;
    border-radius:50%;width:20px;height:20px;font-size:11px;cursor:pointer;
    line-height:1;font-weight:900;flex-shrink:0;
  }
  .del-row:hover{background:#c0392b;}
  body:not(.edit-mode) .del-row{display:none;}

  /* list-row 新增按钮（默认隐藏，编辑模式显示） */
  .add-list{
    display:none;margin-top:4px;margin-left:42px;
    width:24px;height:24px;border-radius:50%;
    background:#3b82f6;color:#fff;border:none;
    font-size:14px;font-weight:900;cursor:pointer;
    align-items:center;justify-content:center;line-height:1;
    box-shadow:0 2px 6px rgba(59,130,246,.35);
  }
  .add-list:hover{background:#2563eb;transform:scale(1.1);}
  body.edit-mode .add-list{display:inline-flex;}

  /* ===== Popover 浮窗（icon 点击后弹出，fixed 定位避免被遮挡） ===== */
  .icon-popover{
    position:fixed;z-index:99999;
    background:#fff;border:2px solid var(--pink-deep);
    border-radius:10px;padding:6px;box-shadow:0 6px 20px rgba(0,0,0,.18);
    display:none;flex-wrap:wrap;gap:4px;max-width:260px;
  }
  .icon-popover.show{display:flex;}
  .icon-popover .pop-item{
    width:32px;height:32px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    background:var(--cream);cursor:pointer;font-size:16px;
    border:1px solid #f3d9a4;
  }
  .icon-popover .pop-item:hover{background:var(--pink-soft);}

  /* ===== 拖拽手柄（list-row 末尾对齐右边，编辑模式显示） ===== */
  .list-drag-handle{
    display:none;flex:0 0 auto;align-self:center;
    width:24px;height:24px;border-radius:6px;
    background:#fff5f8;border:1px dashed #f5b4ce;
    color:#e63475;font-size:14px;font-weight:900;
    cursor:grab;user-select:none;
    align-items:center;justify-content:center;
    margin-left:6px;flex-shrink:0;
  }
  body.edit-mode .list-drag-handle{display:flex;}
  .list-drag-handle:active{cursor:grabbing;}
  .list-drag-handle:hover{background:#ffe6f0;}

  /* ===== Image gallery ===== */
  .img-gallery{
    display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;
    min-height:0;
    transition:all .2s;
  }
  .img-gallery.collapsed{flex-direction:row;}
  .img-gallery.collapsed .img-thumb:nth-child(n+2){display:none;}
  /* 非编辑态 + 0 张图时整行隐藏（连"+ 添加图片"框也隐藏） */
  body:not(.edit-mode) .img-gallery.empty{display:none;}

  /* ===== 非编辑态：折叠态首图飘到右侧 88×88（图 4 样式） ===== */
  body:not(.edit-mode) .list-row{
    /* grid：左主区 + 右首图 */
    display:grid;
    grid-template-columns: 1fr 88px;
    grid-template-rows: auto auto;
    column-gap:10px;
    align-items:start;
  }
  body:not(.edit-mode) .list-row > .list-main{grid-column:1;grid-row:1/3;min-width:0;}
  body:not(.edit-mode) .list-row > .img-gallery.collapsed{
    grid-column:2;grid-row:1;
    margin-top:0;
    width:88px;height:88px;
    flex-wrap:nowrap;
    position:relative;
  }
  body:not(.edit-mode) .list-row > .img-gallery.collapsed .img-thumb{
    width:88px;height:88px;
  }
  /* 折叠态首图右下角的 ▼ 按钮（仅非编辑态 + 折叠态 + 多图时） */
  body:not(.edit-mode) .list-row > .img-gallery.collapsed::after{
    content:"▼";
    position:absolute;
    right:-6px;bottom:-6px;
    width:24px;height:24px;border-radius:50%;
    background:var(--pink-deep);color:#fff;
    font-size:11px;font-weight:900;
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 2px 4px rgba(0,0,0,.25);
    cursor:pointer;line-height:1;
    z-index:2;
  }
  body:not(.edit-mode) .list-row > .img-gallery.collapsed:hover::after{background:var(--pink-deep);transform:scale(1.08);}
  /* 展开态：跨两列铺开 */
  body:not(.edit-mode) .list-row > .img-gallery:not(.collapsed){
    grid-column:1 / -1;
  }
  /* 折叠态下的 .img-toggle 文本按钮：折叠时藏起来（▼ 已用 ::after 画） */
  body:not(.edit-mode) .img-toggle{display:none;}
  body:not(.edit-mode) .img-gallery:not(.collapsed) + .img-toggle{display:block;}

  .img-thumb{
    position:relative;width:88px;height:64px;
    border-radius:6px;overflow:hidden;
    border:1px solid #f3d9a4;background:#fbf5e3;
    cursor:zoom-in;flex-shrink:0;outline:none;
  }
  body.edit-mode .img-thumb{cursor:pointer;}
  body.edit-mode .img-thumb.selected{
    outline:2px solid var(--pink-deep);
    box-shadow:0 0 0 2px var(--pink-deep);
  }
  .img-thumb img{width:100%;height:100%;object-fit:cover;display:block;}

  .img-del{
    position:absolute;top:2px;right:2px;
    width:18px;height:18px;border-radius:50%;
    background:rgba(240,128,128,.95);color:#fff;
    border:none;font-size:11px;line-height:1;
    cursor:pointer;display:none;font-weight:900;
    align-items:center;justify-content:center;
    padding:0;box-shadow:0 1px 3px rgba(0,0,0,.3);
  }
  body.edit-mode .img-del{display:flex;}
  .img-del:hover{background:#c0392b;}

  .img-add{
    width:88px;height:64px;
    border-radius:6px;border:2px dashed #93c5fd;
    background:#eff6ff;color:#2563eb;
    display:flex;align-items:center;justify-content:center;
    font-size:11px;font-weight:900;cursor:pointer;
    flex-shrink:0;text-align:center;padding:4px;
  }
  .img-add:hover{background:#dbeafe;}
  .img-add.flash{background:#dcfce7;border-color:#3a8a2c;color:#3a8a2c;}
  /* 非编辑态下 .img-add 节点已不渲染（见 imgGalleryHTML），此处无需弱化样式 */

  .img-toggle{
    font-size:11px;color:var(--pink-deep);
    cursor:pointer;margin-top:4px;font-weight:700;
    background:none;border:none;padding:0;
    display:block;
  }

  /* ===== 模态：全屏看图 ===== */
  .img-modal{
    position:fixed;inset:0;z-index:99999;
    background:rgba(0,0,0,.85);
    display:none;align-items:center;justify-content:center;
    flex-direction:row;gap:18px;
  }
  .img-modal.show{display:flex;}
  .img-modal img{
    max-width:80vw;max-height:88vh;object-fit:contain;
    border-radius:6px;box-shadow:0 8px 32px rgba(0,0,0,.5);
  }
  .img-modal .img-close{
    position:absolute;top:18px;right:18px;
    width:40px;height:40px;border-radius:50%;
    background:rgba(255,255,255,.95);color:#333;
    border:none;font-size:22px;cursor:pointer;font-weight:900;
    display:flex;align-items:center;justify-content:center;
    line-height:1;
  }

    background:rgba(255,255,255,.9);color:#333;border:none;
    width:48px;height:48px;border-radius:50%;font-size:30px;
    cursor:pointer;font-weight:900;
    display:flex;align-items:center;justify-content:center;
    line-height:1;
  }
  .img-modal .img-nav:hover{background:#fff;}
  .img-modal .img-counter{
    position:absolute;bottom:18px;left:50%;transform:translateX(-50%);
    color:#fff;font-size:13px;background:rgba(0,0,0,.5);
    padding:4px 14px;border-radius:14px;
  }
  .bottom-textarea{
    width:100%;
    min-height:180px;
    border:2px dashed #f3d9a4;
    border-radius:8px;
    background:#fffaf0;
    padding:10px 12px;
    font-family:inherit;
    font-size:13px;
    line-height:1.7;
    color:#444;
    resize:vertical;
    outline:none;
    box-sizing:border-box;
  }
  .bottom-textarea:read-only{
    cursor:default;
    background:#fffaf0;
    border-color:#f3d9a4;
  }
  body.edit-mode .bottom-textarea{
    border-color:#f5b4ce;
    background:#fff5f8;
    cursor:text;
  }
  body.edit-mode .bottom-textarea:focus{
    border-color:var(--pink-deep);
    background:#fff;
  }

  /* 占位符 */
  .bottom-textarea:read-only:placeholder-shown{color:#bbb;font-style:italic;}

  /* 地图图例：放在地图上方（独立行） */
  .map-legend-top{position:relative;display:flex;gap:14px;justify-content:center;
    background:#fffaf0;border:1px solid #f3d9a4;border-radius:8px;
    padding:6px 10px;margin-bottom:6px;font-size:11px;font-weight:700;color:#5c3a00;line-height:1.6;}
  .map-legend-top .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px;vertical-align:middle;}

  /* ===== 右侧行程详情 ===== */
  .timeline{position:relative;padding-left:18px;overflow:visible;}
  .timeline::before{content:"";position:absolute;left:5px;top:6px;bottom:6px;width:2px;background:linear-gradient(180deg,#f5b4ce,#db2777);}

  /* ===== 底部实用信息 ===== */
  .info{display:grid;grid-template-columns:1fr 1fr 1.4fr;gap:14px;margin-top:18px;}
  .panel{background:var(--cream);border:2px solid #f3d9a4;border-radius:14px;padding:14px 16px;}

  .panel ul li::marker{color:var(--pink-deep);}

// 地点名 → Google Maps URL
function gmapUrl(name){
  return "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(name);
}

// 单个 list-row HTML（工厂）
function listRowHTML({ type = "activity", icon = "·", name = "新条目",
                     time = "", duration = "", action = "", note = "" }){
  const isTransport = type === "transport";
  const inputClass = isTransport ? "list-transport-duration" : "list-time";
  const inputValue = isTransport ? duration : time;
  const inputPlaceholder = isTransport ? "交通消耗时长" : "活动时间";
  return `
    <div class="list-row" data-type="${type}" draggable="true">
      <span class="list-icon" data-icon="${icon}">${icon}</span>
      <div class="list-main">
        <div class="list-meta-row">
          <span class="${inputClass}" data-placeholder="${inputPlaceholder}">${inputValue || ""}</span>
        </div>
        <div class="list-name">
          <b class="name-text">${name}</b>
          <a class="list-locate" href="${gmapUrl(name)}" target="_blank" rel="noopener" title="在 Google Maps 打开">📍</a>
        </div>
        <div class="img-gallery"></div>
        ${isTransport
          ? `<div class="list-note" data-placeholder="备注">${note}</div>`
          : `<div class="list-action" data-placeholder="活动内容">${action}</div>
             <div class="list-note" data-placeholder="备注">${note}</div>`}
      </div>
      <button class="del-row" title="删除此条">✕</button>

// 头部 icon 弹窗
function showIconPopover(iconEl, row){
  document.querySelectorAll(".icon-popover").forEach(p => p.remove());
  const type = row.dataset.type || "activity";
  const def = TYPE_DEFS[type];
  const pop = document.createElement("div");
  pop.className = "icon-popover show";

  // 切换类型按钮
  const typeRow = document.createElement("div");
  typeRow.style.cssText = "width:100%;display:flex;gap:4px;margin-bottom:4px;padding-bottom:4px;border-bottom:1px solid #f3d9a4;";
  ["meal", "transport", "activity"].forEach(t => {
    const btn = document.createElement("div");
    btn.className = "pop-item";
    btn.title = TYPE_DEFS[t].label;
    btn.textContent = TYPE_DEFS[t].icon;
    btn.style.cssText = "width:auto;padding:0 8px;font-size:11px;";
    if (t === type) btn.style.background = "var(--pink-soft)";
    btn.onclick = (e) => {
      e.stopPropagation();
      pop.remove();
      changeRowType(row, t);
    };
    typeRow.appendChild(btn);
  });
  pop.appendChild(typeRow);

  // 当前类型图标选项
  def.icons.forEach(em => {
    const item = document.createElement("div");
    item.className = "pop-item";
    const e = em.split(" ")[0];
    item.textContent = e;
    item.title = em;
    item.onclick = (ev) => {
      ev.stopPropagation();
      pop.remove();
      iconEl.textContent = e;
      iconEl.dataset.icon = e;
      scheduleSave();
    };
    pop.appendChild(item);
  });

  // fixed 定位：用 icon 的屏幕坐标
  document.body.appendChild(pop);
  const rect = iconEl.getBoundingClientRect();
  pop.style.top = (rect.bottom + 4) + "px";
  pop.style.left = (rect.left - 8) + "px";

  setTimeout(() => {
    const closeFn = (ev) => {
      if (!pop.contains(ev.target) && ev.target !== iconEl) {
        pop.remove();
        document.removeEventListener("click", closeFn);
      }
    };
    document.addEventListener("click", closeFn);
  }, 0);
}

// 切换 row 类型（同时更新主体 layout）
function changeRowType(row, newType){
  row.dataset.type = newType;
  const main = row.querySelector(".list-main");
  const oldName = row.querySelector(".name-text")?.textContent || "";
  const oldAction = row.querySelector(".list-action")?.innerHTML || "";
  const oldNote = row.querySelector(".list-note")?.innerHTML || "";
  const oldDuration = row.querySelector(".list-transport-duration")?.textContent || "";
  const oldTime = row.querySelector(".list-time")?.textContent || "";
  // 保留现有图片画廊
  const oldGalleryHTML = row.querySelector(".img-gallery")?.outerHTML || '<div class="img-gallery"></div>';

  if (newType === "transport") {
    main.innerHTML = `
      <div class="list-meta-row">
        <span class="list-transport-duration" data-placeholder="交通消耗时长">${oldDuration}</span>
      </div>
      <div class="list-name">
        <b class="name-text">${oldName || "新条目"}</b>
        <a class="list-locate" href="${gmapUrl(oldName || '新条目')}" target="_blank" rel="noopener">📍</a>
      </div>
      ${oldGalleryHTML}
      <div class="list-note" data-placeholder="备注">${oldNote}</div>`;
  } else {
    main.innerHTML = `
      <div class="list-meta-row">
        <span class="list-time" data-placeholder="活动时间">${oldTime}</span>
      </div>
      <div class="list-name">
        <b class="name-text">${oldName || "新条目"}</b>
        <a class="list-locate" href="${gmapUrl(oldName || '新条目')}" target="_blank" rel="noopener">📍</a>
      </div>
      ${oldGalleryHTML}
      <div class="list-action" data-placeholder="活动内容">${oldAction}</div>
      <div class="list-note" data-placeholder="备注">${oldNote}</div>`;
  }
  // 重新装上 contenteditable 与定位链接同步
  attachRowHandlers(row);
  // 重新装图片画廊交互
  const newGallery = row.querySelector(".img-gallery");
  if (newGallery) attachImgGalleryHandlers(newGallery, row);

  const iconEl = row.querySelector(".list-icon");
  iconEl.textContent = TYPE_DEFS[newType].icon;
  iconEl.dataset.icon = TYPE_DEFS[newType].icon;
  scheduleSave();
}

// 给一个 row 装上编辑相关（contenteditable + delete + icon click + drag）
function attachRowHandlers(row){
  row.querySelectorAll(".name-text, .list-time, .list-transport-duration, .list-action, .list-note")
    .forEach(el => { el.contentEditable = "true"; el.spellcheck = false; });
  const icon = row.querySelector(".list-icon");
  if (icon) {
    icon.onclick = (e) => {
      e.stopPropagation();
      showIconPopover(icon, row);
    };
  }
  let delBtn = row.querySelector(".del-row");
  if (!delBtn) {
    delBtn = document.createElement("button");
    delBtn.className = "del-row";
    delBtn.textContent = "✕";
    delBtn.title = "删除此条";
    row.appendChild(delBtn);
  }
  // 每次都重新绑事件（防止 detach 残留旧 listener 失效）
  delBtn.onclick = (e) => {
    e.stopPropagation();
    e.preventDefault();
    row.remove();
    scheduleSave();
  };
  attachDragHandlers(row);

  // 标题变更 → 触发 Wikipedia 自动取图（编辑态 + name 已稳定且无图时）
  // 触发时机：input（节流）+ blur（兜底）
  const titleEl = row.querySelector(".name-text");
  if (titleEl && !titleEl.dataset.wikiBound) {
    titleEl.dataset.wikiBound = "1";
    let wikiTimer = null;
    const tryFetch = async () => {
      if (!editMode) return;
      const name = titleEl.textContent.trim();
      if (isPendingName(name)) return;
      const gallery = ensureImgGallery(row);
      if (gallery.querySelectorAll(".img-thumb").length > 0) return;
      // 防重入：同一名字在飞
      const lastKey = row.dataset.wikiLastName || "";
      if (lastKey === name) return;
      row.dataset.wikiLastName = name;
      const addBox = gallery.querySelector(".img-add");
      if (addBox) { addBox.classList.add("flash"); addBox.textContent = "🔄 加载中…"; }
      const imgs = await fetchWikiImages(name, 3);
      imgs.forEach(src => addImgToGallery(gallery, src));
      applyEmptyFlag(gallery);
      applyImgGalleryCollapse(gallery);
      if (addBox) { addBox.classList.remove("flash"); addBox.textContent = "+ 添加图片"; }
      saveRowImages(row);
    };
    titleEl.addEventListener("input", () => {
      // 改名时清掉上次锁定，让新名能取图
      const name = titleEl.textContent.trim();
      if (name !== row.dataset.wikiLastName) row.dataset.wikiLastName = "";
      if (wikiTimer) clearTimeout(wikiTimer);
      wikiTimer = setTimeout(tryFetch, 600);
    });
    titleEl.addEventListener("blur", () => {
      if (wikiTimer) { clearTimeout(wikiTimer); wikiTimer = null; }
      tryFetch();
    });
  }
}

  const cfg = DAYS[d];
  const layer = { markers: [], polylines: [] };
  // 节点
  cfg.nodes.forEach((n, idx) => {
    const icon = makeNumberIcon(n.num, n.kind);
    const m = L.marker([n.lat, n.lng], { icon, keyboard: false });
    const pills = (n.pills || []).map(p => `<span class="pill">${p}</span>`).join("");
    // 查找行程单 list-row 的首图（模糊匹配名称）
    const dayPanel = document.querySelector(`.day-panel[data-day="${d}"]`);
    let rowImg = "";
    if (dayPanel && n.name) {
      const matchedRow = Array.from(dayPanel.querySelectorAll(".list-row")).find(r => {
        const t = r.querySelector(".name-text")?.textContent?.trim() || "";
        if (!t || t === "新条目") return false;
        const a = t.split(/[→·\s]/)[0];
        const b = n.name.split(/[→·\s]/)[0];
        return a && b && (n.name.includes(a) || t.includes(b));
      });
      if (matchedRow) {
        const firstThumb = matchedRow.querySelector(".img-thumb");
        if (firstThumb) {
          rowImg = `<img src="${firstThumb.dataset.imgUrl}" style="width:100%;max-width:200px;height:auto;border-radius:6px;margin-top:6px;display:block;"/>`;
        }
      }
    }
    m.bindPopup(`<b>${n.name}</b><small>${n.hint || ""}</small>${rowImg}${pills ? "<div style='margin-top:4px'>"+pills+"</div>" : ""}`);
    m.addTo(map);
    m.on("click", () => focusSpot(idx, false));
    layer.markers.push(m);
  });
  // 路线
  cfg.route.forEach(seg => {
    const a = cfg.nodes[seg.from];
    const b = cfg.nodes[seg.to];
    const color = seg.mode === "taxi" ? "#3a8a2c" : "#e63475";
    const weight = seg.mode === "taxi" ? 4 : 4;
    const dash = seg.mode === "taxi" ? "8 8" : null;
    const pl = L.polyline([[a.lat, a.lng],[b.lat, b.lng]], {
      color, weight, opacity: .85, dashArray: dash,
    }).addTo(map);
    layer.polylines.push(pl);
  });
  return layer;
}

function focusSpot(idx, fly=true){
  const cfg = DAYS[currentDay];
  if (!cfg || !cfg.nodes[idx]) return;
  const n = cfg.nodes[idx];
  // 切换右侧 spot 高亮
  document.querySelectorAll(`.day-panel[data-day="${currentDay}"] .spot`).forEach(el => el.classList.remove("active"));
  const el = document.querySelector(`.day-panel[data-day="${currentDay}"] .spot[data-spot="${idx}"]`);
  if (el) el.classList.add("active");
  // 打开地图 popup 并定位
  const m = currentLayer.markers[idx];
  if (m && fly) {
    map.flyTo([n.lat, n.lng], Math.max(map.getZoom(), 16), { duration: .6 });
    m.openPopup();
  } else if (m) {
    m.openPopup();
  }
}

function activateDay(d){
  // tab active
  document.querySelectorAll("#tabs .tab").forEach(t => t.classList.toggle("active", String(t.dataset.day) === String(d)));
  // panel active
  document.querySelectorAll(".day-panel").forEach(p => p.classList.toggle("active", String(p.dataset.day) === String(d)));

  // Day 1 是 transit，无 OSM 地图
  if (DAYS[d].isTransit) {
    if (map) { map.remove(); map = null; }
    if (currentLayer) {
      currentLayer.markers.forEach(m => m.remove());
      currentLayer.polylines.forEach(p => p.remove());
      currentLayer = null;
    }
    currentDay = d;
    // 装载当前 Day 的 row 图片
    document.querySelectorAll(`.day-panel[data-day="${d}"] .list-row`).forEach(loadRowImages);
    renderBottomInfo(d);
    if (editMode) attachEditHandlers();
    return;
  }

  // 切换地图数据
  if (!map) {
    map = L.map("map-" + d, { zoomControl: true, scrollWheelZoom: true })
            .setView(DAYS[d].center, DAYS[d].zoom);
    L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 19,
      attribution: "© OpenStreetMap contributors",
    }).addTo(map);
  } else {
    // 复用 map，把 dom 移到新的 panel
    const container = document.getElementById("map-" + d);
    if (container && map.getContainer() !== container) {
      // 简单做法：重建 map 以避免 stale container
      map.remove();
      map = L.map("map-" + d, { zoomControl: true, scrollWheelZoom: true })
              .setView(DAYS[d].center, DAYS[d].zoom);
      L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
        maxZoom: 19,
        attribution: "© OpenStreetMap contributors",
      }).addTo(map);
    }
  }
  // 清旧图层
  if (currentLayer) {
    currentLayer.markers.forEach(m => m.remove());
    currentLayer.polylines.forEach(p => p.remove());
  }
  currentLayer = buildLayer(d);
  currentDay = d;

  // 框选范围
  map.fitBounds(DAYS[d].bounds, { padding: [30, 30] });
  // 重置 list-row 高亮
  document.querySelectorAll(`.day-panel[data-day="${d}"] .list-row`).forEach(el => el.classList.remove("active"));
  // 自动计数头部 icon + 空字段占位符
  setupEmptyFieldMarkers(document.querySelector(`.day-panel[data-day="${d}"]`));

  // 装载当前 Day 所有 list-row 的图片（从 localStorage）
  document.querySelectorAll(`.day-panel[data-day="${d}"] .list-row`).forEach(loadRowImages);
  // 自动取图（异步，不阻塞）
  autoFetchRowImages(d);

  // 修复可能出现的 size 问题
  setTimeout(() => map.invalidateSize(), 60);

  // 渲染底部模块
  renderBottomInfo(d);
  if (editMode) attachEditHandlers();
}

function init(){
  // 加载 localStorage 覆盖（先加载，否则 DAYS 数据是初始的）
  mergeOverrides();

  // 渲染 Day 1–6 面板
  for (const d of [1,2,3,4,5,6]) {
    if (DAYS[d]) root.insertAdjacentHTML("beforeend", renderDayPanel(d));
  }

  // 如果用户曾编辑过 timeline，写入 panel DOM
  const ov = loadOverrides();
  Object.keys(ov).forEach(d => {
    if (d === "tips") return;
    if (ov[d] && ov[d].timelineHTML) {
      const tl = document.querySelector(`.day-panel[data-day="${d}"] .timeline`);
      if (tl) tl.innerHTML = ov[d].timelineHTML;
    }
  });

  // 绑定 tab（统一处理，Day 1 也走 activateDay 的 transit 分支）
  document.querySelectorAll("#tabs .tab").forEach(t => {
    t.addEventListener("click", () => {
      const d = Number(t.dataset.day);
      activateDay(d);
    });
  });

  // v3：list-row 不再有固定 marker 联动
  // 旧的 spot → 地图联动已移除

  // 默认激活 Day 2
  activateDay(2);

  // 工具栏
  document.getElementById("edit-toggle").addEventListener("click", toggleEdit);
  document.getElementById("reset-btn").addEventListener("click", clearOverrides);

  // 关页/刷新：如有未保存编辑，提示
  window.addEventListener("beforeunload", (e) => {
    if (Object.keys(pendingEdits).length > 0) {
      e.preventDefault();
      e.returnValue = "有未保存的编辑，确定要离开吗？";
      return e.returnValue;
    }
  });
}

window.addEventListener("DOMContentLoaded", init);

function renderBottomInfo(d){
  const ov = loadOverrides();
  const tips = (ov.tips && ov.tips[d]) || DEFAULT_TIPS[d] || DEFAULT_TIPS[2];
  const tas = document.querySelectorAll("#bottom-info textarea[data-list]");
  tas.forEach((ta, i) => {
    if (tips[i]) {
      // 把 HTML 列表转成纯文本（去掉标签，emoji + 文本保留）
      const plain = tips[i].map(s => s.replace(/<[^>]+>/g, "").trim()).filter(Boolean);
      ta.value = plain.join("\n");
    } else {
      ta.value = "";
    }
  });
  // enjoy 仅 Day 2-6
  const enjoy = document.querySelector("#bottom-info .enjoy");
  if (enjoy) enjoy.style.display = (d >= 2 && d <= 6) ? "" : "none";
}

// 把 textarea 当前内容写回存储（行内换行作为列表分隔）
function syncBottomTextareas(){
  const tas = document.querySelectorAll("#bottom-info textarea[data-list]");
  const ov = loadOverrides();
  const d = currentDay;
  if (!d) return;
  ov.tips = ov.tips || {};
  ov.tips[d] = ov.tips[d] || [];
  tas.forEach((ta, i) => {
    const lines = ta.value.split("\n").map(s => s.trim()).filter(Boolean);
    ov.tips[d][i] = lines;
  });
  saveOverrides(ov);
}

/* =========================================================
   编辑模式 + localStorage 持久化
   ========================================================= */
const STORAGE_KEY = "rome-florence-6days-v5";
let editMode = false;
// 暂存编辑（不直接写入 localStorage，直到点 ✅ 才提交）
let pendingEdits = {};

function loadOverrides(){
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}"); }
  catch { return {}; }
}
function saveOverrides(p){ localStorage.setItem(STORAGE_KEY, JSON.stringify(p)); }
function clearOverrides(){
  if (!confirm("确定要恢复默认内容吗？所有编辑过的内容将被清除。" +
                "\n\n（提示：可以打开浏览器 DevTools → Application → LocalStorage 删除所有键）")) return;
  localStorage.removeItem(STORAGE_KEY);
  pendingEdits = {};
  location.reload();
}
function mergeOverrides(){
  const ov = loadOverrides();
  // 覆盖 DAYS 各字段（timelineHTML → timeline）
  Object.keys(ov).forEach(d => {
    if (d === "tips") return; // tips 单独处理
    if (DAYS[d] && typeof DAYS[d] === "object" && ov[d] && typeof ov[d] === "object") {
      if (ov[d].timelineHTML) {
        DAYS[d].timeline = ov[d].timelineHTML;
        delete ov[d].timelineHTML;
      }
      Object.assign(DAYS[d], ov[d]);
    }
  });
}

function toggleEdit(){
  if (!editMode) {
    // 进入编辑模式
    editMode = true;
    document.body.classList.add("edit-mode");
    document.getElementById("edit-toggle").textContent = "✅ 完成编辑";
    // 底部 textarea 启用编辑
    document.querySelectorAll("#bottom-info textarea[data-list]").forEach(ta => ta.removeAttribute("readonly"));
    attachEditHandlers();
    // 刷新所有画廊折叠按钮（编辑态下隐藏）+ empty 标记
    document.querySelectorAll(".day-panel.active .img-gallery").forEach(g => {
      applyImgGalleryCollapse(g);
      applyEmptyFlag(g);
    });
  } else {
    // 退出编辑模式：如有未保存的改动，提示用户
    if (Object.keys(pendingEdits).length > 0 || document.getElementById("edit-toggle").classList.contains("dirty")) {
      const ok = confirm("有未保存的编辑。\n点击「确定」保存到本地，点击「取消」放弃这些改动。");
      if (ok) {
        commitEdits();
      } else {
        location.reload();
        return;
      }
    }
    editMode = false;
    document.body.classList.remove("edit-mode");
    document.getElementById("edit-toggle").textContent = "✏️ 编辑";
    // 底部 textarea 恢复只读
    document.querySelectorAll("#bottom-info textarea[data-list]").forEach(ta => ta.setAttribute("readonly", "readonly"));
    // 兜底清理：确保所有 contenteditable 元素退出编辑态（BUG#5 修复）
    document.querySelectorAll("[contenteditable]").forEach(el => el.removeAttribute("contenteditable"));
    detachEditHandlers();
    // 刷新折叠按钮 + empty 标记
    document.querySelectorAll(".day-panel.active .img-gallery").forEach(g => {
      applyImgGalleryCollapse(g);
      applyEmptyFlag(g);
    });
  }
}

function detachEditHandlers(){
  document.querySelectorAll('[contenteditable="true"]').forEach(el => {
    el.removeAttribute("contenteditable");
  });
  // 仅删除编辑模式专用控件（del-row 保留，靠 CSS 控制可点性）
  document.querySelectorAll(".add-list, .add-li, .drag-handle, .icon-popover").forEach(b => b.remove());
  document.querySelectorAll('[draggable="true"]').forEach(el => el.removeAttribute("draggable"));
}

// 列表末尾拖拽手柄（添加到 li）
function attachDragHandle(li){
  if (li.querySelector(".drag-handle")) return;
  const h = document.createElement("span");
  h.className = "drag-handle";
  h.textContent = "≡";
  h.title = "按住拖拽";
  li.appendChild(h);
}

// 切换 list-action / list-note 的 .empty-field 标记
function refreshEmptyField(el){
  if (!el) return;
  const html = el.innerHTML.trim();
  const empty = html === "" || html === "<br>" || html === "<div><br></div>";
  el.classList.toggle("empty-field", empty);
}

// 初始化新模板的空字段占位符
function setupEmptyFieldMarkers(root){
  (root || document).querySelectorAll(".list-action, .list-note, .list-time, .list-transport-duration").forEach(el => {
    if (!el.dataset.placeholder) el.dataset.placeholder = "（点击编辑）";
    refreshEmptyField(el);
    if (editMode) {
      el.contentEditable = "true";
      el.spellcheck = false;
    }
  });
}

function attachEditHandlers(){
  if (!editMode) return;
  const dayPanel = document.querySelector(".day-panel.active");
  if (!dayPanel) return;

  // 右上"标题 / 日期"
  dayPanel.querySelectorAll("h2, .date").forEach(el => {
    el.contentEditable = "true"; el.spellcheck = false;
  });

  // 每个 list-row 装上：可编辑 + icon 弹窗 + 删除 + 拖拽
  dayPanel.querySelectorAll(".list-row").forEach(row => attachRowHandlers(row));

  // 底部 ➕ 新增 list-row 按钮
  if (!dayPanel.querySelector(".add-list")) {
    const btn = document.createElement("button");
    btn.className = "add-list";
    btn.textContent = "+";
    btn.title = "新增 list";
    btn.addEventListener("click", (e) => {
      e.stopPropagation();
      addListRowAfter(dayPanel.querySelector(".timeline"));
    });
    const timeline = dayPanel.querySelector(".timeline");
    if (timeline) timeline.appendChild(btn);
  }

  // ====== 底部 panel li 可编辑 + 删除 + 拖拽手柄 + 每个 ul 末尾 ➕ ======
  document.querySelectorAll("#bottom-info ul[data-list]").forEach(ul => {
    ul.querySelectorAll("li").forEach(li => {
      li.contentEditable = "true"; li.spellcheck = false;
      li.setAttribute("draggable", "true");
      if (!li.querySelector(".del-li")) {
        const btn = document.createElement("button");
        btn.className = "del-li";
        btn.textContent = "✕";
        btn.title = "删除此条";
        btn.addEventListener("click", (e) => {
          e.stopPropagation();
          li.remove();
          scheduleSave();
        });
        li.appendChild(btn);
      }
      attachDragHandle(li);
      attachDragHandlers(li);
    });
    if (!ul.parentElement.querySelector(":scope > .add-li")) {
      const addBtn = document.createElement("button");
      addBtn.className = "add-li";
      addBtn.textContent = "+";
      addBtn.title = "新增条目到本面板";
      addBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        addLiToPanel(ul);
      });
      ul.parentElement.appendChild(addBtn);
    }
  });
}

// 新增 li 到指定 ul
function addLiToPanel(ul){
  const li = document.createElement("li");
  // li 结构：<li><span class="li-content" contenteditable>文本</span><span class="drag-handle">≡</span><button class="del-li">✕</button></li>
  li.innerHTML = `<span class="li-content">新条目</span><span class="drag-handle" title="按住拖拽">≡</span><button class="del-li" title="删除此条">✕</button>`;
  ul.appendChild(li);
  const content = li.querySelector(".li-content");
  content.contentEditable = "true";
  content.spellcheck = false;
  li.setAttribute("draggable", "true");
  const btn = li.querySelector(".del-li");
  btn.addEventListener("click", (e) => {
    e.stopPropagation();
    li.remove();
    scheduleSave();
  });
  attachDragHandle(li);
  attachDragHandlers(li);
  const range = document.createRange();
  range.selectNodeContents(content);
  const sel = window.getSelection();
  sel.removeAllRanges();
  sel.addRange(range);
  scheduleSave();
}

// 新增 list-row（默认活动 ·，附加到 timeline 末尾）
function addListRowAfter(timeline){
  if (!timeline) return;
  const wrap = document.createElement("div");
  wrap.innerHTML = listRowHTML({ type:"activity", icon:"·", name:"新条目" });
  const newRow = wrap.firstElementChild;
  const addListBtn = timeline.querySelector(".add-list");
  timeline.insertBefore(newRow, addListBtn);

  // 装上交互
  attachRowHandlers(newRow);
  // 装图片画廊交互（listRowHTML 已含空 .img-gallery 容器）
  const newGallery = newRow.querySelector(".img-gallery");
  if (newGallery) {
    attachImgGalleryHandlers(newGallery, newRow);
    applyEmptyFlag(newGallery);  // 新行初始为空，打 empty 标记
  }

  // 选中标题
  const titleEl = newRow.querySelector(".name-text");
  titleEl.focus();
  document.execCommand("selectAll", false, null);

  setupEmptyFieldMarkers(newRow);
  scheduleSave();
}

// 拖拽处理（spot / li 通用）
let dragSrcEl = null;

function attachDragHandlers(el){
  el.addEventListener("dragstart", (e) => {
    const fromHandle = e.target.classList.contains("drag-handle") || e.target.closest(".drag-handle");
    const inEditable = e.target.closest("[contenteditable=true]") || e.target.tagName === "INPUT" || e.target.tagName === "SELECT";
    if (inEditable) {
      e.preventDefault();
      return;
    }
    // li（底部面板）必须有 drag-handle 才允许拖
    if (!fromHandle && el.classList.contains("panel") || el.tagName === "LI") {
      if (!fromHandle) { e.preventDefault(); return; }
    }
    dragSrcEl = el;
    el.classList.add("dragging");
    e.dataTransfer.effectAllowed = "move";
    e.dataTransfer.setData("text/plain", el.outerHTML);
  });
  el.addEventListener("dragend", () => {
    el.classList.remove("dragging");
    document.querySelectorAll(".drag-over").forEach(x => x.classList.remove("drag-over"));
  });
  el.addEventListener("dragover", (e) => {
    // 跨区域禁止：拒绝接受另一区域的拖入
    if (dragSrcEl) {
      const srcInBottom = dragSrcEl.closest("#bottom-info");
      const tgtInBottom = el.closest("#bottom-info");
      if (srcInBottom !== tgtInBottom) return;
    }
    e.preventDefault();
    e.dataTransfer.dropEffect = "move";
    el.classList.add("drag-over");
  });
  el.addEventListener("dragleave", () => el.classList.remove("drag-over"));
  el.addEventListener("drop", (e) => {
    e.preventDefault();
    el.classList.remove("drag-over");
    if (!dragSrcEl || dragSrcEl === el) return;
    // 跨区域二次拦截
    const srcInBottom = dragSrcEl.closest("#bottom-info");
    const tgtInBottom = el.closest("#bottom-info");
    if (srcInBottom !== tgtInBottom) return;
    const parent = el.parentNode;
    parent.insertBefore(dragSrcEl, el);
    scheduleSave();
  });
}

/* =========================================================
   图片画廊模块（v4）
   - 自动从 Wikipedia API 拉图（标题失焦时）
   - 复制粘贴上传 / 替换 / 删除
   - 查看态默认折叠 + 全屏模态
   - 地图 popup 显示首图
   ========================================================= */
const WIKI_API_EN = "https://en.wikipedia.org/api/rest_v1/page/summary/";
const WIKI_API_ZH = "https://zh.wikipedia.org/api/rest_v1/page/summary/";

// 拉 Wikipedia 图片 URL 列表（最多 count 张）
// 优先 en.wikipedia（覆盖意/法/英地标），失败回退 zh.wikipedia；
// 24h 本地缓存避免重复请求；找不到则返回空数组（0 张也算合法结果）
async function fetchWikiImages(placeName, count = 3){
  const cacheKey = `wiki-cache-v2:${placeName}`;
  const CACHE_MS = 24 * 60 * 60 * 1000;
  try {
    const cached = localStorage.getItem(cacheKey);
    if (cached) {
      const { ts, imgs } = JSON.parse(cached);
      if (Date.now() - ts < CACHE_MS && Array.isArray(imgs)) return imgs;
    }
  } catch {}
  const cleanName = placeName.replace(/[→·—–]/g, " ").replace(/\s+/g, "_").trim()
                              .split("→")[0].split("·")[0].trim();
  if (!cleanName) return [];
  for (const api of [WIKI_API_EN, WIKI_API_ZH]) {
    try {
      const resp = await fetch(api + encodeURIComponent(cleanName));
      if (!resp.ok) continue;
      const data = await resp.json();
      const images = [];
      if (data.originalimage?.source) images.push(data.originalimage.source);
      if (data.thumbnail?.source && !images.includes(data.thumbnail.source)) images.push(data.thumbnail.source);
      if (images.length < count) {
        try {
          const r2 = await fetch("https://" + (api.includes("/zh.") ? "zh." : "en.") +
            "wikipedia.org/w/api.php?action=query&format=json&prop=pageimages&piprop=original&titles=" +
            encodeURIComponent(cleanName) + "&origin=*");
          const d2 = await r2.json();
          const pages = d2?.query?.pages;
          if (pages) {
            const p = Object.values(pages)[0];
            if (p?.original?.source && !images.includes(p.original.source)) images.push(p.original.source);
          }
        } catch {}
      }
      const sliced = images.slice(0, count);
      try { localStorage.setItem(cacheKey, JSON.stringify({ ts: Date.now(), imgs: sliced })); } catch {}
      if (sliced.length > 0) return sliced;
    } catch {}
  }
  // 两边都失败 → 缓存空数组避免反复请求
  try { localStorage.setItem(cacheKey, JSON.stringify({ ts: Date.now(), imgs: [] })); } catch {}
  return [];
}

// 判断 name 是否"待定"——若包含「待定」「TBD / TBA / ?」任一词，或等于「新条目」，则不取图
// 同时识别饭点+区域描述这种「未确定地点」（如「晚饭 · 梵蒂冈附近」）
function isPendingName(name){
  if (!name) return true;
  const trimmed = name.trim();
  if (!trimmed || trimmed === "新条目") return true;
  // 饭点 + 区域描述（如「晚饭」「午饭 · 学院附近」）
  if (/^(早|午|晚|宵)饭(\s*[·\-].*)?$/.test(trimmed)) return true;
  // 「附近餐厅」/「XX 区餐厅」/「XX 街区」 这种抽象描述
  if (/附近餐厅|区餐厅|街区餐厅|附近$|区餐厅$/.test(trimmed)) return true;
  return /待定|TBD|TBA|\?/.test(trimmed);
}

// 给画廊打 empty 标记（用于非编辑态 0 张时整行隐藏）
function applyEmptyFlag(gallery){
  if (!gallery) return;
  const count = gallery.querySelectorAll(".img-thumb").length;
  gallery.classList.toggle("empty", count === 0);
}

// 批量自动取图：按天遍历所有 list-row，对每个名称拉图
async function autoFetchRowImages(d){
  const rows = document.querySelectorAll(`.day-panel[data-day="${d}"] .list-row`);
  const tasks = [];
  rows.forEach(row => {
    const name = row.querySelector(".name-text")?.textContent?.trim();
    if (isPendingName(name)) return;
    let gallery = row.querySelector(".img-gallery");
    if (!gallery) return;
    if (gallery.querySelectorAll(".img-thumb").length > 0) return;
    // 自动取图路径：补挂 ▼ 折叠交互（避免静态画廊没 attachImgGalleryHandlers）
    if (gallery.dataset.coverBound !== "1") bindCoverCollapse(gallery, row);
    tasks.push((async () => {
      const imgs = await fetchWikiImages(name, 3);
      imgs.forEach(src => addImgToGallery(gallery, src));
      applyImgGalleryCollapse(gallery);
      applyEmptyFlag(gallery);
      saveRowImages(row);
    })());
  });
  await Promise.allSettled(tasks);
}

// 图片画廊 HTML 工厂
function imgGalleryHTML(images = []){
  const thumbs = images.map((src, i) => `
    <div class="img-thumb" tabindex="-1" data-img-url="${src.replace(/"/g, "&quot;")}" data-img-idx="${i}">
      <img src="${src}" loading="lazy" referrerpolicy="no-referrer" alt=""/>
      <button class="img-del" title="删除此图" type="button">✕</button>
    </div>`).join("");
  // 占位文案：只在编辑态渲染「+ 添加图片」框；
  // 非编辑态连占位都不渲染（避免出现「点 ✏️ 编辑后粘贴」提示）
  const addBoxHTML = editMode
    ? `<div class="img-add" tabindex="0" title="点击后复制图片粘贴上传">+ 添加图片</div>`
    : "";
  return `<div class="img-gallery" data-collapsed="${images.length > 1 ? "1" : "0"}">${thumbs}${addBoxHTML}</div>`;
}

// 把空图片画廊附加到 list-row（如果还没有）
function ensureImgGallery(row){
  let gallery = row.querySelector(".img-gallery");
  if (gallery) return gallery;
  const main = row.querySelector(".list-main");
  if (!main) return null;
  const wrap = document.createElement("div");
  wrap.innerHTML = imgGalleryHTML([]);
  gallery = wrap.firstElementChild;
  // 插入位置：在 list-name 后
  const nameEl = main.querySelector(".list-name");
  if (nameEl) nameEl.insertAdjacentElement("afterend", gallery);
  attachImgGalleryHandlers(gallery, row);
  return gallery;
}

// 装上图片画廊的所有交互
function attachImgGalleryHandlers(gallery, row){
  // 点击删除/选中/查看/添加
  gallery.addEventListener("click", (e) => {
    const delBtn = e.target.closest(".img-del");
    if (delBtn) {
      e.stopPropagation();
      delBtn.closest(".img-thumb").remove();
      const remaining = gallery.querySelectorAll(".img-thumb").length;
      if (remaining === 0) gallery.dataset.collapsed = "0";
      applyImgGalleryCollapse(gallery);
      applyEmptyFlag(gallery);
      saveRowImages(row);
      return;
    }
    const thumb = e.target.closest(".img-thumb");
    if (thumb && editMode) {
      e.stopPropagation();
      gallery.querySelectorAll(".img-thumb.selected").forEach(t => t.classList.remove("selected"));
      thumb.classList.add("selected");
      return;
    }
    if (thumb && !editMode) {
      e.stopPropagation();
      openImgModal(row, parseInt(thumb.dataset.imgIdx || "0"));
      return;
    }
  });

  // 点击"添加图片"框 → 等待粘贴
  const addBox = gallery.querySelector(".img-add");
  if (addBox) {
    addBox.addEventListener("click", (e) => {
      e.stopPropagation();
      addBox.classList.add("flash");
      addBox.textContent = "📋 请复制图片后粘贴";
      gallery.tabIndex = 0;
      gallery.focus({ preventScroll: true });
      setTimeout(() => {
        addBox.classList.remove("flash");
        addBox.textContent = "+ 添加图片";
      }, 3000);
    });
  }

  // 编辑态：row 任意位置粘贴 → 自动添加到画廊
  row.addEventListener("paste", (e) => {
    if (!editMode) return;
    const g = ensureImgGallery(row);
    handleImgPaste(e, g, row);
  });

  // 非编辑态下，折叠态首图点击切换展开/收起（图4 ▼）
  bindCoverCollapse(gallery, row);
}

// 粘贴 → 转 dataURL → 加到画廊
async function handleImgPaste(e, gallery, row){
  if (!editMode) return;
  const items = e.clipboardData?.items;
  if (!items) return;
  for (const item of items) {
    if (item.type && item.type.startsWith("image/")) {
      e.preventDefault();
      const blob = item.getAsFile();
      const dataUrl = await blobToDataURL(blob);
      addImgToGallery(gallery, dataUrl);
      applyImgGalleryCollapse(gallery);
      saveRowImages(row);
      return;
    }
  }
}

function blobToDataURL(blob){
  return new Promise((res) => {
    const r = new FileReader();
    r.onload = () => res(r.result);
    r.readAsDataURL(blob);
  });
}

// 往画廊添加图片（URL 或 dataURL）
function addImgToGallery(gallery, src){
  const idx = gallery.querySelectorAll(".img-thumb").length;
  const wrap = document.createElement("div");
  wrap.innerHTML = `
    <div class="img-thumb" tabindex="-1" data-img-url="${src.replace(/"/g, "&quot;")}" data-img-idx="${idx}">
      <img src="${src}" referrerpolicy="no-referrer" alt=""/>
      <button class="img-del" title="删除此图" type="button">✕</button>
    </div>`;
  const addBox = gallery.querySelector(".img-add");
  gallery.insertBefore(wrap.firstElementChild, addBox);
  if (idx >= 1) gallery.dataset.collapsed = "1";
  applyEmptyFlag(gallery);
}

// 全屏看图模态
function openImgModal(row, startIdx){
  const thumbs = Array.from(row.querySelectorAll(".img-thumb"));
  if (thumbs.length === 0) return;
  const modal = document.createElement("div");
  modal.className = "img-modal show";
  let i = Math.max(0, parseInt(startIdx || 0));
  const img = document.createElement("img");
  const counter = document.createElement("div");
  counter.className = "img-counter";
  const prev = document.createElement("button");
  prev.className = "img-nav"; prev.textContent = "‹";
  const next = document.createElement("button");
  next.className = "img-nav"; next.textContent = "›";
  const close = document.createElement("button");
  close.className = "img-close"; close.textContent = "✕";
  const update = () => {
    img.src = thumbs[i].dataset.imgUrl;
    counter.textContent = `${i+1} / ${thumbs.length}`;
  };
  prev.onclick = (e) => { e.stopPropagation(); i = (i-1+thumbs.length)%thumbs.length; update(); };
  next.onclick = (e) => { e.stopPropagation(); i = (i+1)%thumbs.length; update(); };
  close.onclick = () => modal.remove();
  modal.append(close, prev, img, next, counter);
  modal.addEventListener("click", (e) => { if (e.target === modal) modal.remove(); });
  document.body.appendChild(modal);
  update();
}

// 应用折叠状态
function applyImgGalleryCollapse(gallery){
  const collapsed = gallery.dataset.collapsed === "1";
  gallery.classList.toggle("collapsed", collapsed);
  // 折叠按钮（仅查看态）
  let toggle = gallery.nextElementSibling;
  if (!editMode) {
    if (!toggle || !toggle.classList?.contains("img-toggle")) {
      toggle = document.createElement("button");
      toggle.className = "img-toggle";
      toggle.type = "button";
      gallery.insertAdjacentElement("afterend", toggle);
    }
    const total = gallery.querySelectorAll(".img-thumb").length;
    if (total > 1) {
      // 折叠态：用首图右下角的 ▼（CSS ::after），文本按钮藏起来
      // 展开态：显示「🔼 收起」文本按钮
      toggle.textContent = collapsed ? "" : `🔼 收起`;
      toggle.onclick = (e) => {
        e.stopPropagation();
        gallery.dataset.collapsed = collapsed ? "0" : "1";
        applyImgGalleryCollapse(gallery);
      };
    } else {
      toggle.remove();
    }
  } else if (toggle && toggle.classList?.contains("img-toggle")) {
    toggle.remove();
  }
}

// 折叠态首图右下角 ▼ 按钮：非编辑态下点击首图任意位置切换折叠
function bindCoverCollapse(gallery, row){
  if (gallery.dataset.coverBound === "1") return;
  gallery.dataset.coverBound = "1";
  // 折叠态下整个画廊（实际就是首图）都可点切展；用 pointerdown 防与 openImgModal 冲突
  gallery.addEventListener("click", (e) => {
    if (editMode) return;
    if (!gallery.classList.contains("collapsed")) return;
    const total = gallery.querySelectorAll(".img-thumb").length;
    if (total <= 1) return;     // 单图无意义
    e.stopPropagation();
    gallery.dataset.collapsed = "0";
    applyImgGalleryCollapse(gallery);
  });
}

// 行程单装载：从 localStorage 读图
function loadRowImages(row){
  const name = row.querySelector(".name-text")?.textContent?.trim();
  if (isPendingName(name)) return;
  let saved = null;
  try { saved = localStorage.getItem(`trip-img-${name}`); } catch {}
  if (!saved) return;
  let imgs = [];
  try { imgs = JSON.parse(saved); } catch {}
  if (!Array.isArray(imgs) || imgs.length === 0) {
    // 即使没图，也确保画廊存在（让空标记生效）
    const g = ensureImgGallery(row);
    applyEmptyFlag(g);
    return;
  }
  const gallery = ensureImgGallery(row);
  imgs.forEach(src => addImgToGallery(gallery, src));
  applyImgGalleryCollapse(gallery);
  applyEmptyFlag(gallery);
}

// 保存图片到 localStorage（按景点名称作 key）
function saveRowImages(row){
  const name = row.querySelector(".name-text")?.textContent?.trim();
  if (!name) return;
  const gallery = row.querySelector(".img-gallery");
  const imgs = gallery ? Array.from(gallery.querySelectorAll(".img-thumb")).map(t => t.dataset.imgUrl) : [];
  try {
    if (imgs.length > 0) {
      localStorage.setItem(`trip-img-${name}`, JSON.stringify(imgs));
    } else {
      localStorage.removeItem(`trip-img-${name}`);
    }
  } catch (e) {
    console.warn("[img-save] localStorage quota", e);
  }
}

function scheduleSave(){
  // 写入 pending，不自动持久化到 localStorage
  if (!editMode) return;
  const d = currentDay;
  if (!d || !DAYS[d]) return;

  const dayPanel = document.querySelector(`.day-panel[data-day="${d}"]`);
  if (!dayPanel) return;

  pendingEdits[d] = pendingEdits[d] || {};
  const tl = dayPanel.querySelector(".timeline");
  if (tl) {
    pendingEdits[d].timelineHTML = tl.innerHTML;
    DAYS[d].timeline = tl.innerHTML;
  }
  // 底部三个 textarea：每行作为一条记录
  const tas = document.querySelectorAll("#bottom-info textarea[data-list]");
  pendingEdits.tips = pendingEdits.tips || {};
  tas.forEach((ta, i) => {
    pendingEdits.tips[d] = pendingEdits.tips[d] || [];
    pendingEdits.tips[d][i] = ta.value.split("\n").map(s => s.trim()).filter(Boolean);
  });
  // ✅ 按钮加 dirty 提示
  const btn = document.getElementById("edit-toggle");
  if (btn) btn.classList.add("dirty");
}

// 点 ✅ 时把 pending 写入 localStorage
function commitEdits(){
  const ov = loadOverrides();
  Object.keys(pendingEdits).forEach(key => {
    if (key === "tips") {
      ov.tips = pendingEdits.tips;
    } else {
      ov[key] = Object.assign({}, ov[key] || {}, pendingEdits[key]);
    }
  });
  saveOverrides(ov);
  pendingEdits = {};
  const btn = document.getElementById("edit-toggle");
  if (btn) btn.classList.remove("dirty");
}

// 输入事件 → debounce 保存 + 同步定位 link + 维护 empty-field
document.body.addEventListener("input", (e) => {
  if (!editMode) return;
  const t = e.target;
  if (t.classList && t.classList.contains("name-text")) {
    const row = t.closest(".list-row");
    const a = row && row.querySelector(".list-locate");
    if (row && a) a.href = gmapUrl(t.textContent.trim());
  }
  if (t.classList && (t.classList.contains("list-action") || t.classList.contains("list-note"))) {
    refreshEmptyField(t);
  }
  scheduleSave();
});
