// 拖拽处理（spot / li 通用）
let dragSrcEl = null;

function attachDragHandlers(el){
  el.addEventListener("dragstart", (e) => {
    const fromHandle = e.target.classList.contains("drag-handle") || e.target.closest(".drag-handle");
    const inEditable = e.target.closest("[contenteditable=true]") || e.target.tagName === "INPUT" || e.target.tagName === "SELECT";
    if (inEditable) {
      e.preventDefault();
      return;
    }
    // li（底部面板）必须有 drag-handle 才允许拖
    if (!fromHandle && el.classList.contains("panel") || el.tagName === "LI") {
      if (!fromHandle) { e.preventDefault(); return; }
    }
    dragSrcEl = el;
    el.classList.add("dragging");
    e.dataTransfer.effectAllowed = "move";
    e.dataTransfer.setData("text/plain", el.outerHTML);
  });
  el.addEventListener("dragend", () => {
    el.classList.remove("dragging");
    document.querySelectorAll(".drag-over").forEach(x => x.classList.remove("drag-over"));
  });
  el.addEventListener("dragover", (e) => {
    // 跨区域禁止：拒绝接受另一区域的拖入
    if (dragSrcEl) {
      const srcInBottom = dragSrcEl.closest("#bottom-info");
      const tgtInBottom = el.closest("#bottom-info");
      if (srcInBottom !== tgtInBottom) return;
    }
    e.preventDefault();
    e.dataTransfer.dropEffect = "move";
    el.classList.add("drag-over");
  });
  el.addEventListener("dragleave", () => el.classList.remove("drag-over"));
  el.addEventListener("drop", (e) => {
    e.preventDefault();
    el.classList.remove("drag-over");
    if (!dragSrcEl || dragSrcEl === el) return;
    // 跨区域二次拦截
    const srcInBottom = dragSrcEl.closest("#bottom-info");
    const tgtInBottom = el.closest("#bottom-info");
    if (srcInBottom !== tgtInBottom) return;
    const parent = el.parentNode;
    parent.insertBefore(dragSrcEl, el);
    scheduleSave();
  });
}

/* =========================================================
   图片画廊模块（v4）
   - 自动从 Wikipedia API 拉图（标题失焦时）
   - 复制粘贴上传 / 替换 / 删除
   - 查看态默认折叠 + 全屏模态
   - 地图 popup 显示首图
   ========================================================= */
const WIKI_API_EN = "https://en.wikipedia.org/api/rest_v1/page/summary/";
const WIKI_API_ZH = "https://zh.wikipedia.org/api/rest_v1/page/summary/";

// 拉 Wikipedia 图片 URL 列表（最多 count 张）
// 优先 en.wikipedia（覆盖意/法/英地标），失败回退 zh.wikipedia；
// 24h 本地缓存避免重复请求；找不到则返回空数组（0 张也算合法结果）
// 中文 → 英文对照表（用于 Wikipedia / Unsplash 关键词）
const EN_ALIAS = {
  "万神殿": ["Pantheon, Rome", "Pantheon Rome"],
  "特雷维喷泉": ["Trevi Fountain, Rome", "Trevi Fountain Rome"],
  "西班牙广场": ["Spanish Steps, Rome", "Piazza di Spagna Rome"],
  "古罗马广场": ["Roman Forum, Rome", "Roman Forum Rome", "Foro Romano"],
  "斗兽场": ["Colosseum, Rome", "Colosseum Rome", "Colosseo"],
  "圣天使堡": ["Castel Sant'Angelo, Rome", "Castel Sant'Angelo"],
  "圣彼得大教堂": ["St Peter's Basilica, Vatican City", "Saint Peter's Basilica", "Basilica di San Pietro"],
  "梵蒂冈博物馆": ["Vatican Museums", "Musei Vaticani"],
  "西斯廷教堂": ["Sistine Chapel", "Cappella Sistina"],
  "纳沃纳广场": ["Piazza Navona, Rome", "Piazza Navona"],
  "圣依纳爵堂": ["Sant'Ignazio Church, Rome", "Chiesa di Sant'Ignazio di Loyola"],
  "圣母百花大教堂": ["Florence Cathedral", "Cattedrale di Santa Maria del Fiore", "Duomo Florence"],
  "圣洛伦佐大殿": ["Basilica di San Lorenzo, Florence", "San Lorenzo Florence"],
  "乌菲兹美术馆": ["Uffizi Gallery", "Galleria degli Uffizi"],
  "学院美术馆": ["Galleria dell'Accademia, Florence", "Galleria dell Accademia"],
  "老桥": ["Ponte Vecchio, Florence", "Ponte Vecchio"],
  "共和广场": ["Piazza della Repubblica, Florence", "Piazza Repubblica Florence"],
  "领主广场": ["Piazza della Signoria, Florence", "Piazza della Signoria"],
  "米开朗琪罗广场": ["Piazzale Michelangelo, Florence", "Piazzale Michelangelo"],
  "中央市场": ["Mercato Centrale, Florence", "Mercato Centrale Firenze"],
  "圣十字圣殿": ["Basilica of Santa Croce, Florence", "Santa Croce Florence"],
  "奥尔特拉诺": ["Oltrarno, Florence", "Oltrarno"],
  "圣三一桥": ["Ponte Santa Trinita, Florence", "Ponte Santa Trinita"],
};
// 前缀匹配 fallback：当 cleanName 精确匹配不到 EN_ALIAS 时，找首个能"被 cleanName 以该 key 开头"或"key 被 cleanName 包含"的别名
function resolveEnAlias(cleanName){
  if (EN_ALIAS[cleanName]) return EN_ALIAS[cleanName];
  // 策略1：cleanName 以某个 key 开头（如 "斗兽场 Colosseo" → "斗兽场"）
  for (const k of Object.keys(EN_ALIAS)) {
    if (k && cleanName.startsWith(k)) return EN_ALIAS[k];
  }
  // 策略2：某个 key 包含 cleanName 的核心部分（如 "圣天使堡" vs "古罗马广场"）
  for (const k of Object.keys(EN_ALIAS)) {
    if (k.length > 1 && cleanName.includes(k)) return EN_ALIAS[k];
  }
  return [cleanName];
}

async function fetchWikiImages(placeName, count = 3){
  const cacheKey = `wikiimg6-cache-v4:${placeName}`; // v4: Commons generator=search 正确取图 URL
  const CACHE_MS = 7 * 24 * 60 * 60 * 1000; // 7 天
  try {
    const cached = localStorage.getItem(cacheKey);
    if (cached) {
      const { ts, imgs } = JSON.parse(cached);
      if (Date.now() - ts < CACHE_MS && Array.isArray(imgs)) return imgs;
    }
  } catch {}
  // 1) 提取核心地点名 + 前缀匹配 fallback
  const cleanName = placeName
    .replace(/（[^）]+）/g, "")
    .replace(/\([^)]+\)/g, "")
    .split(/[→·—–\/]/)[0]
    .replace(/(拍夜景|夜景|日落|日出|日间|早晨|傍晚|拍照|打卡|登|入口|内部|登顶|外景|夜景拍照)/g, "")
    .trim();
  if (!cleanName) return [];
  const images = [];

  // 2) Wikipedia Commons 多图搜索：generator=search + ns=6(文件) + prop=imageinfo 拿真实 URL
  const titlesToTry = resolveEnAlias(cleanName);
  for (const t of titlesToTry) {
    if (images.length >= count) break;
    try {
      // generator=search 在 gsrnamespace=6 时返回 File: 页面；用 prop=imageinfo+iiprop=url 拿到真实文件 URL
      const commonsUrl = `https://commons.wikimedia.org/w/api.php?action=query&format=json&generator=search&gsrsearch=${encodeURIComponent(t)}&gsrnamespace=6&gsrlimit=${count}&prop=imageinfo&iiprop=url&origin=*`;
      const cr = await fetch(commonsUrl);
      const cd = await cr.json();
      const pages = cd?.query?.pages || {};
      for (const p of Object.values(pages)) {
        if (images.length >= count) break;
        const ii = p.imageinfo;
        if (!ii || !ii[0] || !ii[0].url) continue;
        let url = ii[0].url;
        // 用 Special:FilePath 缩到 640px（避免大图撑爆布局）
        const fileName = p.title ? p.title.replace(/^File:/, "").replace(/ /g, "_") : "";
        if (fileName) {
          url = `https://commons.wikimedia.org/wiki/Special:FilePath/${encodeURIComponent(fileName)}?width=640`;
        }
        if (!images.includes(url)) images.push(url);
      }
    } catch {}
  }

  // 3) 兜底：dummyimage 永远 200 OK（用景点英文名 + 颜色块）
  if (images.length < count) {
    const enKey = (EN_ALIAS[cleanName] && EN_ALIAS[cleanName][0]) || cleanName;
    const colors = ["e63475", "3a8a2c", "2563eb", "d4a017", "7c3aed"];
    for (let i = images.length; i < count; i++) {
      const color = colors[i % colors.length];
      const text = encodeURIComponent(enKey.split(/[,\s]+/)[0].slice(0, 18));
      images.push(`https://dummyimage.com/600x400/${color}/fff.png&text=${text}`);
    }
  }

  const sliced = images.slice(0, count);
  try { localStorage.setItem(cacheKey, JSON.stringify({ ts: Date.now(), imgs: sliced })); } catch {}
  return sliced;
}

// 判断 name 是否"待定"——若包含「待定」「TBD / TBA / ?」任一词，或等于「新条目」，则不取图
// 同时识别饭点+区域描述这种「未确定地点」（如「晚饭 · 梵蒂冈附近」）
function isPendingName(name){
  if (!name) return true;
  const trimmed = name.trim();
  if (!trimmed || trimmed === "新条目") return true;
  // 饭点 + 区域描述（如「晚饭」「午饭 · 学院附近」）
  if (/^(早|午|晚|宵)饭(\s*[·\-].*)?$/.test(trimmed)) return true;
  // 「附近餐厅」/「XX 区餐厅」/「XX 街区」 这种抽象描述
  if (/附近餐厅|区餐厅|街区餐厅|附近$|区餐厅$/.test(trimmed)) return true;
  return /待定|TBD|TBA|\?/.test(trimmed);
}

// 给画廊打 empty 标记（用于非编辑态 0 张时整行隐藏）
function applyEmptyFlag(gallery){
  if (!gallery) return;
  const count = gallery.querySelectorAll(".img-thumb").length;
  gallery.classList.toggle("empty", count === 0);
}

// 批量自动取图：按天遍历所有 list-row，对每个名称拉图
// ✅ 只对"新增"的 list 自动拉图（有 data-needFetch 标记），已存在的 list 即使为空也不拉
async function autoFetchRowImages(d){
  const rows = document.querySelectorAll(`.day-panel[data-day="${d}"] .list-row`);
  const tasks = [];
  rows.forEach(row => {
    const type = row.dataset.type;
    if (type === "transport") return; // 交通 list 不配图
    const name = row.querySelector(".name-text")?.textContent?.trim();
    if (isPendingName(name)) return;
    let gallery = row.querySelector(".img-gallery");
    if (!gallery) return;
    const saved = localStorage.getItem(`trip-img-${name}`);
    console.log(`[autoFetch] "${name}" → userCleared:`, gallery.dataset.userCleared, `, needFetch:`, row.dataset.needFetch, `, saved:`, saved);
    // ✅ 用户主动清空过 → 跳过，不再重拉
    if (gallery.dataset.userCleared === "1") {
      console.log(`[autoFetch] "${name}" → 跳过（userCleared="1"）`);
      return;
    }
    // ✅ 只对新增的 list 拉图（有 data-needFetch 标记）
    if (!row.dataset.needFetch) {
      console.log(`[autoFetch] "${name}" → 跳过（无 needFetch 标记）`);
      return;
    }
    // ✅ 只统计真实图片（排除占位符、克隆体）
    const realCount = gallery.querySelectorAll(".img-thumb:not(.img-placeholder):not(.img-clone)").length;
    if (realCount > 0) {
      console.log(`[autoFetch] "${name}" → 跳过（已有 ${realCount} 张图）`);
      return;
    }
    console.log(`[autoFetch] "${name}" → 开始拉图`);
    if (gallery.dataset.coverBound !== "1") bindCoverCollapse(gallery, row);
    tasks.push((async () => {
      const imgs = await fetchWikiImages(name, 3);
      imgs.forEach(src => addImgToGallery(gallery, src));
      applyImgGalleryCollapse(gallery);
      applyEmptyFlag(gallery);
      saveRowImages(row);
      // ✅ 拉完图后清除标记，下次不会再拉
      delete row.dataset.needFetch;
      console.log(`[autoFetch] "${name}" → 拉图完成，${imgs.length} 张`);
    })());
  });
  await Promise.allSettled(tasks);
  // 图片到位后：刷新地图 marker popup（让首图绑定上）
  refreshMarkerPopups(d);
  // 强制刷新非编辑态结构（list-row 4 列 grid + toggle）
  refreshNonEditLayout(d);
}

// 重新构建所有 marker 的 popup HTML（取行程单 list-row 首图）
function refreshMarkerPopups(d){
  if (!currentLayer || !currentLayer.markers || !map) return;
  const dayPanel = document.querySelector(`.day-panel[data-day="${d}"]`);
  if (!dayPanel) return;
  // 优先用 currentLayer.nodes（动态构建），fallback DAYS[d].nodes（静态）
  const nodes = currentLayer.nodes || (DAYS[d] && DAYS[d].nodes) || [];
  nodes.forEach((n, idx) => {
    const marker = currentLayer.markers[idx];
    if (!marker) return;
    const pills = (n.pills || []).map(p => `<span class="pill">${p}</span>`).join("");
    let rowImg = "";
    if (n.name) {
      const allRows = Array.from(dayPanel.querySelectorAll(".list-row"));
      let matchedRow = allRows.find(r => {
        const t = r.querySelector(".name-text")?.textContent?.trim() || "";
        return t && t === n.name;
      });
      if (!matchedRow) {
        matchedRow = allRows.find(r => {
          const t = r.querySelector(".name-text")?.textContent?.trim() || "";
          if (!t) return false;
          const a = t.split(/[→·\s]/)[0];
          const b = n.name.split(/[→·\s]/)[0];
          return a && b && a === b;
        });
      }
      if (matchedRow) {
        const firstThumb = matchedRow.querySelectorAll(".img-thumb")[0];
        if (firstThumb && firstThumb.dataset.imgUrl) {
          rowImg = `<img src="${firstThumb.dataset.imgUrl}" style="width:100%;max-width:200px;height:auto;border-radius:6px;margin-top:6px;display:block;"/>`;
        }
      }
    }
    marker.bindPopup(`<b>${n.name}</b><small>${n.hint || ""}</small>${rowImg}${pills ? "<div style='margin-top:4px'>"+pills+"</div>" : ""}`);
  });
}

// 图片画廊 HTML 工厂
function imgGalleryHTML(images = []){
  const thumbs = images.map((src, i) => `
    <div class="img-thumb" tabindex="-1" data-img-url="${src.replace(/"/g, "&quot;")}" data-img-idx="${i}">
      <img src="${src}" loading="lazy" referrerpolicy="no-referrer" alt=""/>
      <button class="img-del" title="删除此图" type="button" onclick="handleImgDelClick(event, this)">✕</button>
    </div>`).join("");
  // 占位文案：只在编辑态渲染「+ 添加图片」框和「🔄 重拉图片」按钮；
  // 非编辑态连占位都不渲染（避免出现「点 ✏️ 编辑后粘贴」提示）
  const addBoxHTML = editMode
    ? `<div class="img-add" tabindex="0" title="点击后复制图片粘贴上传">+ 添加图片</div><button class="img-refetch" type="button" title="重新从 Wikipedia 拉取图片">🔄 重拉</button>`
    : "";
  return `<div class="img-gallery" data-collapsed="1">${thumbs}${addBoxHTML}</div>`;
}

// 把空图片画廊附加到 list-row（如果还没有）
function ensureImgGallery(row){
  let gallery = row.querySelector(".img-gallery");
  if (gallery) return gallery;
  const main = row.querySelector(".list-main");
  if (!main) return null;
  const wrap = document.createElement("div");
  wrap.innerHTML = imgGalleryHTML([]);
  gallery = wrap.firstElementChild;
  // 插入位置：在 list-name 后
  const nameEl = main.querySelector(".list-name");
  if (nameEl) nameEl.insertAdjacentElement("afterend", gallery);
  attachImgGalleryHandlers(gallery, row);
  // 补绑 add-box click
  const addBox = gallery.querySelector(".img-add");
  if (addBox) bindAddBoxClick(addBox, gallery, row);
  return gallery;
}

// 强制刷新非编辑态结构：list-row 4 列 grid + 创建折叠/展开按钮
function refreshNonEditLayout(d){
  if (editMode) return;
  const panel = document.querySelector(`.day-panel[data-day="${d}"]`);
  if (!panel) return;
  panel.querySelectorAll(".list-row").forEach(row => {
    const isTransport = row.dataset.type === "transport";
    // 强制 grid 布局：交通 3 列（无图 + 无 toggle），其他 4 列
    row.style.display = "grid";
    row.style.gridTemplateColumns = isTransport ? "32px 1fr 32px" : "32px 1fr 88px 32px";
    row.style.gridTemplateRows = "auto auto";
    row.style.columnGap = "6px";
    row.style.alignItems = "center";
    const icon = row.querySelector(":scope > .list-icon");
    const main = row.querySelector(":scope > .list-main");
    const gallery = row.querySelector(":scope > .img-gallery");
    if (icon) { icon.style.gridColumn = "1"; icon.style.gridRow = "1"; icon.style.alignSelf = "start"; }
    if (main) { main.style.gridColumn = "2"; main.style.gridRow = "1"; main.style.minWidth = "0"; }
    if (gallery && !isTransport) {
      const collapsed = gallery.dataset.collapsed === "1";
      if (collapsed) {
        gallery.style.gridColumn = "3"; gallery.style.gridRow = "1";
        gallery.style.width = "88px"; gallery.style.height = "88px";
        gallery.style.flexWrap = "nowrap"; gallery.style.marginTop = "0";
      } else {
        gallery.style.gridColumn = "2/4"; gallery.style.gridRow = "2";
        gallery.style.marginTop = "6px";
      }
    }
    // 交通 / 0 图：删除残留 toggle
    const hasImg = !isTransport && gallery && gallery.querySelectorAll(".img-thumb").length > 0;
    if (!hasImg) {
      const oldToggle = row.querySelector(":scope > .img-toggle");
      if (oldToggle) oldToggle.remove();
      return;
    }
    ensureImgToggle(row);
  });
}

function ensureImgToggle(row){
  if (row.dataset.type === "transport") return;
  const gallery = row.querySelector(".img-gallery");
  if (!gallery) return;
  const total = gallery.querySelectorAll(".img-thumb").length;
  if (total === 0) {
    const oldToggle = row.querySelector(":scope > .img-toggle");
    if (oldToggle) oldToggle.remove();
    return;
  }
  let toggle = row.querySelector(":scope > .img-toggle");
  if (!toggle) {
    toggle = document.createElement("button");
    toggle.className = "img-toggle";
    toggle.type = "button";
    row.appendChild(toggle);
  }
  const collapsed = gallery.dataset.collapsed === "1";
  toggle.style.display = "flex";
  toggle.style.gridColumn = "4";
  toggle.style.gridRow = collapsed ? "1" : "2";
  toggle.style.justifySelf = "center";
  toggle.style.alignSelf = "start";
  toggle.classList.toggle("expanded", !collapsed);
  toggle.innerHTML = collapsed ? '<span class="img-toggle-arrow">▼</span>' : '<span class="img-toggle-arrow">▲</span>';
  toggle.onclick = (e) => {
    e.stopPropagation();
    gallery.dataset.collapsed = collapsed ? "0" : "1";
    applyImgGalleryCollapse(gallery);
    refreshNonEditLayout(currentDay);
  };
}

// 装上图片画廊的所有交互
function attachImgGalleryHandlers(gallery, row){
  // 标记这个 gallery 已绑定
  gallery.dataset.galleryClickBound = "1";

  // 点击选中/查看/添加（删除按钮由 attachImgDragHandlers 单独处理）
  gallery.addEventListener("click", (e) => {
    if (e.target.closest(".img-del")) return; // 删除按钮由拖拽 handler 处理
    const thumb = e.target.closest(".img-thumb");
    if (!thumb) return;
    if (editMode) {
      // 编辑态：单击图片 → 弹全屏大图
      e.stopPropagation();
      openImgModal(row, parseInt(thumb.dataset.imgIdx || "0"));
      return;
    }
    // 非编辑态：点击图片 → 弹全屏大图
    e.stopPropagation();
    openImgModal(row, parseInt(thumb.dataset.imgIdx || "0"));
  });

  // 点击"添加图片"框 → 等待粘贴
  const addBox = gallery.querySelector(".img-add");
  if (addBox) {
    addBox.addEventListener("click", (e) => {
      e.stopPropagation();
      // 切换 active 选中态（再次点击同 box 取消）
      if (addBox.classList.contains("active")) {
        addBox.classList.remove("active");
        addBox.textContent = "+ 添加图片";
        return;
      }
      addBox.classList.add("active", "flash");
      addBox.textContent = "📋 请粘贴图片";
      gallery.tabIndex = 0;
      gallery.focus({ preventScroll: true });
      setTimeout(() => addBox.classList.remove("flash"), 3000);
    });
  }

  // ✅ 点击"🔄 重拉图片"按钮 → 清除缓存并重新从 Wikipedia 拉图（仅当前 list）
  const refetchBtn = gallery.querySelector(".img-refetch");
  if (refetchBtn) {
    refetchBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      const name = row.querySelector(".name-text")?.textContent?.trim();
      if (!name || isPendingName(name)) return;
      // 显示 loading 状态
      refetchBtn.classList.add("flash");
      refetchBtn.textContent = "⏳ 拉取中…";
      // 清除该景点的 Wikipedia 图片缓存
      const cacheKey = `wikiimg6-cache-v4:${name}`;
      localStorage.removeItem(cacheKey);
      // 清空当前画廊的真实图片（保留占位符和克隆体不删）
      gallery.querySelectorAll(".img-thumb:not(.img-placeholder):not(.img-clone)").forEach(t => t.remove());
      // 重新拉图
      fetchWikiImages(name, 3).then(imgs => {
        imgs.forEach(src => addImgToGallery(gallery, src));
        applyImgGalleryCollapse(gallery);
        applyEmptyFlag(gallery);
        saveRowImages(row);
        refreshMarkerPopups(currentDay);
        refetchBtn.classList.remove("flash");
        refetchBtn.textContent = "🔄 重拉";
      }).catch(() => {
        refetchBtn.classList.remove("flash");
        refetchBtn.textContent = "❌ 失败";
        setTimeout(() => { refetchBtn.textContent = "🔄 重拉"; }, 2000);
      });
    });
  }

  // 编辑态：row 任意位置粘贴 → 自动添加到画廊
  row.addEventListener("paste", (e) => {
    if (!editMode) return;
    const g = ensureImgGallery(row);
    handleImgPaste(e, g, row);
  });

  // 非编辑态下，折叠态首图点击切换展开/收起（图4 ▼）
  bindCoverCollapse(gallery, row);

  // 编辑态：图片拖拽排序
  attachImgDragHandlers(gallery, row);
  // 编辑态：行级 drop zone（支持文件拖入 .img-add）
  attachRowDropZone(row);
}

// 同步设置 .img-thumb 的 draggable 状态：编辑态 true，否则 false
function refreshImgDraggable(gallery){
  gallery.querySelectorAll(".img-thumb").forEach(thumb => {
    thumb.draggable = editMode;
  });
}

// 编辑态：图片拖拽重排（简单交换：拖到目标上直接交换位置）
function attachImgDragHandlers(gallery, row){
  refreshImgDraggable(gallery);
  let dragThumb = null;
  let clone = null;
  let startX = 0, startY = 0;
  const THRESHOLD = 5;

  // ✅ 用事件委托处理删除按钮（捕获阶段 + 立即执行，不被其他 handler 干扰）
  gallery.addEventListener("click", (e) => {
    const delBtn = e.target.closest(".img-del");
    if (!delBtn) return;
    e.stopPropagation();
    e.preventDefault();
    const thumb = delBtn.closest(".img-thumb");
    if (!thumb) return;
    thumb.remove();
    const remaining = gallery.querySelectorAll(".img-thumb:not(.img-placeholder):not(.img-clone)").length;
    if (remaining === 0) gallery.dataset.collapsed = "0";
    applyImgGalleryCollapse(gallery);
    applyEmptyFlag(gallery);
    saveRowImages(row);
    refreshMarkerPopups(currentDay);
  }, { capture: true, once: false });

  // mousedown: 开始拖拽
  gallery.addEventListener("mousedown", (e) => {
    console.log("[img-thumb mousedown handler]", editMode, e.target);
    if (!editMode) return;
    const t = e.target.closest(".img-thumb");
    if (!t) return;
    if (e.target.closest(".img-del")) return;
    if (e.target.closest(".img-add")) return;
    dragThumb = t;
    startX = e.clientX;
    startY = e.clientY;
    e.preventDefault();
    e.stopPropagation();
  });

  // mousemove: 创建克隆体 + 高亮目标
  document.addEventListener("mousemove", (e) => {
    if (!dragThumb || !editMode) return;
    const dx = e.clientX - startX;
    const dy = e.clientY - startY;
    if (Math.abs(dx) < THRESHOLD && Math.abs(dy) < THRESHOLD) return;

    // 首次超过阈值：创建克隆体
    if (!clone) {
      const rect = dragThumb.getBoundingClientRect();
      clone = dragThumb.cloneNode(true);
      clone.className = "img-thumb img-clone";
      clone.style.position = "fixed";
      clone.style.left = (e.clientX - rect.width / 2) + "px";
      clone.style.top = (e.clientY - rect.height / 2) + "px";
      clone.style.width = rect.width + "px";
      clone.style.height = rect.height + "px";
      clone.style.zIndex = "1000";
      clone.style.pointerEvents = "none";
      document.body.appendChild(clone);

      dragThumb.classList.add("is-dragging");
      gallery.classList.add("drag-active");
    }

    // 移动克隆体
    if (clone) {
      const rect = dragThumb.getBoundingClientRect();
      clone.style.left = (e.clientX - rect.width / 2) + "px";
      clone.style.top = (e.clientY - rect.height / 2) + "px";
    }

    // 找到鼠标下方的目标
    const target = document.elementFromPoint(e.clientX, e.clientY);
    const targetThumb = target?.closest(".img-thumb:not(.is-dragging):not(.img-clone)");

    // 清除所有指示器
    gallery.querySelectorAll(".img-thumb").forEach(x => x.classList.remove("swap-target"));
    gallery.querySelector(".img-add")?.classList.remove("drag-over");

    // 如果目标是另一个 thumb → 高亮
    if (targetThumb && targetThumb !== dragThumb) {
      targetThumb.classList.add("swap-target");
    }
  });

  // mouseup: 完成拖拽 → 交换位置
  document.addEventListener("mouseup", (e) => {
    if (!dragThumb || !editMode) return;
    const parent = gallery;

    // 找到目标
    const target = document.elementFromPoint(e.clientX, e.clientY);
    const targetThumb = target?.closest(".img-thumb:not(.is-dragging):not(.img-clone)");

    if (targetThumb && targetThumb !== dragThumb) {
      // 交换 DOM 位置
      const allThumbs = [...parent.querySelectorAll(".img-thumb:not(.img-clone)")];
      const fromIdx = allThumbs.indexOf(dragThumb);
      const toIdx = allThumbs.indexOf(targetThumb);

      // 简单交换：用 insertBefore 实现
      if (fromIdx < toIdx) {
        targetThumb.after(dragThumb);
      } else {
        targetThumb.before(dragThumb);
      }
    }

    // 清理
    if (clone) { clone.remove(); clone = null; }
    dragThumb.classList.remove("is-dragging");
    parent.querySelectorAll(".img-thumb").forEach(x => x.classList.remove("swap-target"));
    parent.querySelector(".img-add")?.classList.remove("drag-over");
    parent.classList.remove("drag-active");

    // 重置 idx
    parent.querySelectorAll(".img-thumb:not(.img-clone)").forEach((thumb, i) => thumb.dataset.imgIdx = i);
    saveRowImages(row);

    dragThumb = null;
  });
}

// 粘贴 → 转 dataURL → 加到画廊
async function handleImgPaste(e, gallery, row){
  if (!editMode) return;
  const items = e.clipboardData?.items;
  if (!items) return;
  for (const item of items) {
    if (item.type && item.type.startsWith("image/")) {
      e.preventDefault();
      const blob = item.getAsFile();
      // 显示 spinner
      const addBox = gallery.querySelector(".img-add");
      if (addBox) { addBox.classList.add("flash"); addBox.textContent = "⏳ 上传中…"; }
      const dataUrl = await blobToDataURL(blob);
      addImgToGallery(gallery, dataUrl);
      applyImgGalleryCollapse(gallery);
      saveRowImages(row);
      // 取消 +框 active 态
      if (addBox) { addBox.classList.remove("active", "flash"); addBox.textContent = "+ 添加图片"; }
      // 同步刷新 marker popup
      refreshMarkerPopups(currentDay);
      return;
    }
  }
}

// 监听 row drop（图片拖入 .img-add 框）
function attachRowDropZone(row){
  if (row.dataset.dropBound === "1") return;
  row.dataset.dropBound = "1";
  const gallery = row.querySelector(".img-gallery");
  if (!gallery) return;
  const addBox = gallery.querySelector(".img-add");
  const dropTarget = addBox || gallery;

  dropTarget.addEventListener("dragover", (e) => {
    if (!editMode) return;
    if (!e.dataTransfer.types.includes("Files")) return;
    e.preventDefault();
    e.dataTransfer.dropEffect = "copy";
    if (addBox) addBox.classList.add("dropping");
  });
  dropTarget.addEventListener("dragleave", () => {
    if (addBox) addBox.classList.remove("dropping");
  });
  dropTarget.addEventListener("drop", async (e) => {
    if (!editMode) return;
    e.preventDefault();
    if (addBox) addBox.classList.remove("dropping");
    const files = Array.from(e.dataTransfer?.files || []).filter(f => f.type.startsWith("image/"));
    if (files.length === 0) return;
    e.stopPropagation();
    if (addBox) { addBox.classList.add("flash"); addBox.textContent = `⏳ 上传 ${files.length} 张…`; }
    for (const file of files) {
      const dataUrl = await blobToDataURL(file);
      addImgToGallery(gallery, dataUrl);
    }
    applyImgGalleryCollapse(gallery);
    saveRowImages(row);
    if (addBox) { addBox.classList.remove("active", "flash"); addBox.textContent = "+ 添加图片"; }
    refreshMarkerPopups(currentDay);
  });
}

function blobToDataURL(blob){
  return new Promise((res) => {
    const r = new FileReader();
    r.onload = () => res(r.result);
    r.readAsDataURL(blob);
  });
}

// 往画廊添加图片（URL 或 dataURL）
function addImgToGallery(gallery, src){
  const idx = gallery.querySelectorAll(".img-thumb:not(.img-placeholder):not(.img-clone)").length;
  const wrap = document.createElement("div");
  wrap.innerHTML = `
    <div class="img-thumb" tabindex="-1" data-img-url="${src.replace(/"/g, "&quot;")}" data-img-idx="${idx}" onmousedown="console.log('[img-thumb mousedown]', this.dataset.imgIdx)">
      <img src="${src}" referrerpolicy="no-referrer" alt=""/>
      <button class="img-del" title="删除此图" type="button" onclick="handleImgDelClick(event, this)"></button>
    </div>`;
  const addBox = gallery.querySelector(".img-add");
  gallery.insertBefore(wrap.firstElementChild, addBox);
  if (idx >= 1) gallery.dataset.collapsed = "1";
  applyEmptyFlag(gallery);
  // 同步设置 draggable
  refreshImgDraggable(gallery);
}

// 全屏看图模态
function openImgModal(row, startIdx){
  console.log("[openImgModal CALLED]", row, startIdx);
  const thumbs = Array.from(row.querySelectorAll(".img-thumb"));
  if (thumbs.length === 0) return;
  const modal = document.createElement("div");
  modal.className = "img-modal show";
  let i = Math.max(0, parseInt(startIdx || 0));
  const img = document.createElement("img");
  const counter = document.createElement("div");
  counter.className = "img-counter";
  const prev = document.createElement("button");
  prev.className = "img-nav"; prev.textContent = "‹";
  const next = document.createElement("button");
  next.className = "img-nav"; next.textContent = "›";
  const close = document.createElement("button");
  close.className = "img-close"; close.textContent = "✕";
  const update = () => {
    img.src = thumbs[i].dataset.imgUrl;
    counter.textContent = `${i+1} / ${thumbs.length}`;
  };
  prev.onclick = (e) => { e.stopPropagation(); i = (i-1+thumbs.length)%thumbs.length; update(); };
  next.onclick = (e) => { e.stopPropagation(); i = (i+1)%thumbs.length; update(); };
  close.onclick = () => modal.remove();
  modal.append(close, prev, img, next, counter);
  modal.addEventListener("click", (e) => { if (e.target === modal) modal.remove(); });
  document.body.appendChild(modal);
  update();
}

// 应用折叠状态
function applyImgGalleryCollapse(gallery){
  // 编辑态：永远展开（平铺所有图）
  const collapsed = editMode ? false : gallery.dataset.collapsed === "1";
  gallery.classList.toggle("collapsed", collapsed);
  // 非编辑态：删除残留的 .img-add
  if (!editMode) {
    gallery.querySelectorAll(".img-add").forEach(b => b.remove());
  } else if (!gallery.querySelector(".img-add")) {
    const box = document.createElement("div");
    box.className = "img-add";
    box.tabIndex = 0;
    box.title = "点击后复制图片粘贴上传";
    box.textContent = "+ 添加图片";
    gallery.appendChild(box);
  }
  // 折叠/展开圆形按钮（▲/▼）：非编辑态下创建/更新
  const row = gallery.closest(".list-row");
  let toggle = row?.querySelector(":scope > .img-toggle");
  if (!editMode) {
    if (!toggle) {
      toggle = document.createElement("button");
      toggle.className = "img-toggle";
      toggle.type = "button";
      if (row) row.appendChild(toggle);
    }
    const total = gallery.querySelectorAll(".img-thumb").length;
    if (total > 0) {
      toggle.style.display = "flex";
      toggle.innerHTML = collapsed ? '<span class="img-toggle-arrow">▼</span>' : '<span class="img-toggle-arrow">▲</span>';
      toggle.classList.toggle("expanded", !collapsed);
      toggle.onclick = (e) => {
        e.stopPropagation();
        gallery.dataset.collapsed = collapsed ? "0" : "1";
        applyImgGalleryCollapse(gallery);
      };
    } else {
      toggle.style.display = "none";
    }
  } else if (toggle) {
    toggle.remove();
  }
}

// 折叠态首图右下角 ▼ 按钮：非编辑态下点击首图任意位置切换折叠
function bindCoverCollapse(gallery, row){
  if (gallery.dataset.coverBound === "1") return;
  gallery.dataset.coverBound = "1";
  // 折叠态下点击首图 → 展开；已展开时不再拦截，让 attachImgGalleryHandlers 处理打开模态框
  gallery.addEventListener("click", (e) => {
    if (editMode) return;
    const thumb = e.target.closest(".img-thumb");
    if (!thumb) return;
    if (!gallery.classList.contains("collapsed")) return; // 已展开 → 不拦截，交给 openImgModal
    const total = gallery.querySelectorAll(".img-thumb").length;
    if (total <= 1) return;     // 单图无意义
    e.stopPropagation();
    gallery.dataset.collapsed = "0";
    applyImgGalleryCollapse(gallery);
  });
}

// 行程单装载：从 localStorage 读图
function loadRowImages(row){
  const name = row.querySelector(".name-text")?.textContent?.trim();
  if (isPendingName(name)) return;
  // 1) 优先 localStorage（用户本地缓存，含手动上传的图片）
  let saved = null;
  try { saved = localStorage.getItem(`trip-img-${name}`); } catch {}
  // 2) 兜底 images.json（跨设备同步的默认配图）
  if (!saved && window._imgManifest && window._imgManifest[name]) {
    saved = JSON.stringify(window._imgManifest[name]);
    console.log(`[loadRowImages] "${name}" → 从 images.json 兜底`);
  }
  console.log(`[loadRowImages] "${name}" → saved:`, saved?.substring?.(0, 80) ?? 'null');

  // ✅ 关键：在清空 gallery 之前，先保存 userCleared 状态
  const existingGallery = row.querySelector(".img-gallery");
  const wasUserCleared = existingGallery?.dataset.userCleared === "1";
  console.log(`[loadRowImages] "${name}" → wasUserCleared:`, wasUserCleared);

  // 先清空 gallery（防止 DOM 残留导致叠加）
  const gallery = ensureImgGallery(row);
  gallery.querySelectorAll(".img-thumb:not(.img-placeholder):not(.img-clone)").forEach(t => t.remove());

  if (!saved) {
    // ✅ 没有缓存（新景点或用户从未操作过）→ 不设 userCleared，让 autoFetch/refetch 正常拉图
    // 但如果 DOM 上已有 wasUserCleared 标记（从上次会话保留），则保留
    if (wasUserCleared) {
      gallery.dataset.userCleared = "1";
      console.log(`[loadRowImages] "${name}" → 保留 wasUserCleared 标记`);
    } else {
      // ✅ 标记 needFetch，让 autoFetchRowImages 为此行拉图
      row.dataset.needFetch = "1";
      console.log(`[loadRowImages] "${name}" → 无缓存，标记 needFetch 等待 autoFetch`);
    }
    applyEmptyFlag(gallery);
    return;
  }
  let imgs = [];
  try { imgs = JSON.parse(saved); } catch {}
  console.log(`[loadRowImages] "${name}" → parsed imgs:`, Array.isArray(imgs) ? `Array(${imgs.length})` : 'NOT ARRAY');
  if (!Array.isArray(imgs)) return;
  // ✅ 用户主动清空过（空数组）→ 不再自动拉图
  if (imgs.length === 0 || wasUserCleared) {
    gallery.dataset.userCleared = "1";
    console.log(`[loadRowImages] "${name}" → 设 userCleared="1"（空数组或 wasUserCleared）`);
    applyEmptyFlag(gallery);
    return;
  }
  // ✅ 读到有效图片 → 清除 userCleared 标记
  delete gallery.dataset.userCleared;
  console.log(`[loadRowImages] "${name}" → 加载 ${imgs.length} 张图片`);
  imgs.forEach(src => addImgToGallery(gallery, src));
  applyImgGalleryCollapse(gallery);
  applyEmptyFlag(gallery);
}

// 导出当前所有配图到 images.json（用于跨设备同步）
function exportImageManifest(){
  const manifest = {};
  document.querySelectorAll(".day-panel .list-row").forEach(row => {
    const name = row.querySelector(".name-text")?.textContent?.trim();
    if (!name || isPendingName(name)) return;
    const saved = localStorage.getItem(`trip-img-${name}`);
    if (!saved) return;
    try {
      const imgs = JSON.parse(saved);
      if (Array.isArray(imgs) && imgs.length > 0) {
        manifest[name] = imgs;
      }
    } catch {}
  });
  const blob = new Blob([JSON.stringify(manifest, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "images.json";
  a.click();
  URL.revokeObjectURL(url);
  alert(`已导出 ${Object.keys(manifest).length} 个景点的配图到 images.json。\n请将此文件放到 HTML 同目录下，并提交到 GitHub。`);
}

// 保存图片到 localStorage（按景点名称作 key）
function saveRowImages(row){
  const name = row.querySelector(".name-text")?.textContent?.trim();
  if (!name) return;
  const gallery = row.querySelector(".img-gallery");
  // ✅ 只取真实 .img-thumb（排除占位符、克隆体）
  const imgs = gallery
    ? Array.from(gallery.querySelectorAll(".img-thumb:not(.img-placeholder):not(.img-clone)"))
        .map(t => t.dataset.imgUrl)
    : [];
  console.log(`[saveRowImages] "${name}" → saving ${imgs.length} images:`, imgs.slice(0, 2).concat(imgs.length > 2 ? ['...'] : []));
  try {
    // ✅ 有图片 → 存数组；用户清空 → 存空数组 []（不是 null，也不是 removeItem）
    localStorage.setItem(`trip-img-${name}`, JSON.stringify(imgs));
    if (gallery) {
      if (imgs.length > 0) {
        delete gallery.dataset.userCleared;
        console.log(`[saveRowImages] "${name}" → userCleared 清除`);
      } else {
        gallery.dataset.userCleared = "1";
        console.log(`[saveRowImages] "${name}" → userCleared="1"（空数组）`);
      }
    }
  } catch (e) {
    console.warn("[img-save] localStorage quota", e);
  }
}

// 保存图片到 localStorage（按景点名称作 key）
function saveRowImages(row){
  const name = row.querySelector(".name-text")?.textContent?.trim();
  if (!name) return;
  const gallery = row.querySelector(".img-gallery");
  // ✅ 只取真实 .img-thumb（排除占位符、克隆体）
  const imgs = gallery
    ? Array.from(gallery.querySelectorAll(".img-thumb:not(.img-placeholder):not(.img-clone)"))
        .map(t => t.dataset.imgUrl)
    : [];
  try {
    if (imgs.length > 0) {
      localStorage.setItem(`trip-img-${name}`, JSON.stringify(imgs));
      if (gallery) delete gallery.dataset.userCleared;
    } else {
      // ✅ 用户主动清空 → 写入 null 标记
      localStorage.setItem(`trip-img-${name}`, JSON.stringify(null));
      if (gallery) gallery.dataset.userCleared = "1";
    }
  } catch (e) {
    console.warn("[img-save] localStorage quota", e);
  }
}

function scheduleSave(){
  // 写入 pending，不自动持久化到 localStorage
  if (!editMode) return;
  const d = currentDay;
  if (!d || !DAYS[d]) return;

  const dayPanel = document.querySelector(`.day-panel[data-day="${d}"]`);
  if (!dayPanel) return;

  pendingEdits[d] = pendingEdits[d] || {};
  const tl = dayPanel.querySelector(".timeline");
  if (tl) {
    // ✅ 保存前清除编辑态临时元素和 icon 的 dataset 标记（用 clone 避免修改实时 DOM）
    const clone = tl.cloneNode(true);
    clone.querySelectorAll(".list-icon[data-icon-handler-bound]").forEach(icon => {
      icon.removeAttribute("data-icon-handler-bound");
    });
    clone.querySelectorAll(".img-add, .img-refetch").forEach(el => el.remove());
    pendingEdits[d].timelineHTML = clone.innerHTML;
    DAYS[d].timeline = tl.innerHTML;
  }
  // 底部三个 textarea：每行作为一条记录
  const tas = document.querySelectorAll("#bottom-info textarea[data-list]");
  pendingEdits.tips = pendingEdits.tips || {};
  tas.forEach((ta, i) => {
    pendingEdits.tips[d] = pendingEdits.tips[d] || [];
    pendingEdits.tips[d][i] = ta.value.split("\n").map(s => s.trim()).filter(Boolean);
  });
  // ✅ 按钮加 dirty 提示
  const btn = document.getElementById("edit-toggle");
  if (btn) btn.classList.add("dirty");
}

// 点 ✅ 时把 pending 写入 localStorage
function commitEdits(){
  const ov = loadOverrides();
  Object.keys(pendingEdits).forEach(key => {
    if (key === "tips") {
      ov.tips = pendingEdits.tips;
    } else {
      ov[key] = Object.assign({}, ov[key] || {}, pendingEdits[key]);
    }
  });
  saveOverrides(ov);
  pendingEdits = {};
  const btn = document.getElementById("edit-toggle");
  if (btn) btn.classList.remove("dirty");
}

// 输入事件 → debounce 保存 + 同步定位 link + 维护 empty-field
document.body.addEventListener("input", (e) => {
  if (!editMode) return;
  const t = e.target;
  if (t.classList && t.classList.contains("name-text")) {
    const row = t.closest(".list-row");
    const a = row && row.querySelector(".list-locate");
    if (row && a) a.href = gmapUrl(t.textContent.trim());
  }
  if (t.classList && (t.classList.contains("list-action") || t.classList.contains("list-note"))) {
    refreshEmptyField(t);
  }
  scheduleSave();
});
