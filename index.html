<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>意大利四城 12 天深度游 · 罗马 · 佛罗伦萨 · 多洛米蒂 · 米兰</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""/>
<style>
  :root{
    --pink:#ff6b9d;
    --pink-soft:#ffd6e7;
    --pink-deep:#e63475;
    --green:#7ec850;
    --green-soft:#e7f5d6;
    --green-deep:#3a8a2c;
    --beige:#f8efe1;
    --cream:#fff8ec;
    --ink:#2b2b2b;
    --ink-soft:#5b5b5b;
    --river:#cfe7ff;
    --river-deep:#7cc0ec;
    --park:#dff0c8;
    --park-deep:#a8c98a;
    --road:#f1ebda;
    --road-deep:#d8c79a;
    --block:#f5e9c7;
    --block-deep:#cdb16a;
    --warn:#e74c3c;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:#fdfaf3;font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink);}
  .page{max-width:1200px;margin:0 auto;background:#fffaf0;border:1px solid #f0e2c0;border-radius:18px;padding:24px 28px 30px;box-shadow:0 6px 24px rgba(160,120,60,.08);}

  /* ===== 顶部标题区 ===== */
  header{display:flex;align-items:center;justify-content:space-between;padding:6px 4px 18px;border-bottom:2px dashed #f1d9b6;margin-bottom:14px;}
  h1{font-size:42px;font-weight:900;letter-spacing:2px;margin:0;color:#2b2b2b;line-height:1.1;}
  h1 .day{color:var(--pink-deep);font-style:italic;font-weight:900;}
  h1 .small{font-size:20px;color:#a37a3c;font-weight:500;margin-left:6px;letter-spacing:1px;}
  .flag-ita{display:inline-block;width:30px;height:18px;border-radius:3px;vertical-align:middle;background:linear-gradient(90deg,#008c45 33%,#f4f5f0 33%,#f4f5f0 66%,#cd212a 66%);margin-left:6px;}
  .subtitle{display:inline-block;background:var(--pink-soft);color:var(--pink-deep);font-weight:700;padding:6px 16px;border-radius:20px;margin-top:8px;font-size:15px;letter-spacing:1px;}
  .city-icons{font-size:32px;}
  .city-label{font-weight:900;color:var(--pink-deep);font-size:20px;letter-spacing:2px;text-align:center;}
  .city-card{display:flex;flex-direction:column;align-items:center;gap:4px;}
  .city-tag{font-size:12px;color:#a37a3c;font-style:italic;}

  /* ===== 工具栏（编辑模式） ===== */
  .toolbar{display:flex;gap:8px;align-items:center;}
  .tool-btn{
    appearance:none;cursor:pointer;font-family:inherit;font-weight:900;
    font-size:13px;padding:8px 14px;border-radius:10px;
    background:var(--pink-soft);color:var(--pink-deep);
    border:2px solid var(--pink-deep);transition:all .15s;white-space:nowrap;
  }
  .tool-btn:hover{background:var(--pink-deep);color:#fff;}
  .tool-btn.ghost{background:transparent;color:#a37a3c;border-color:#f3d9a4;}
  .tool-btn.ghost:hover{background:#f3d9a4;color:var(--pink-deep);}
  body.edit-mode .tool-btn#edit-toggle{background:var(--pink-deep);color:#fff;}
  body.edit-mode .tool-btn#edit-toggle::before{content:"✅ ";}
  body.edit-mode .tool-btn#edit-toggle{font-size:0;}
  body.edit-mode .tool-btn#edit-toggle::before{font-size:13px;}

  /* ===== 顶部 Tab 栏 ===== */
  .tabs{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 16px;padding:6px;background:#fff5e3;border:2px solid #f3d9a4;border-radius:14px;}
  .tab{
    flex:1 1 auto;min-width:130px;
    appearance:none;cursor:pointer;
    background:#fffaf0;border:2px solid #f3d9a4;border-radius:10px;
    padding:10px 14px;font-family:inherit;font-weight:900;color:var(--ink-soft);
    display:flex;flex-direction:column;align-items:flex-start;gap:2px;
    transition:all .18s ease;
  }
  .tab:hover{border-color:var(--pink-deep);color:var(--pink-deep);transform:translateY(-1px);}
  .tab .tab-num{font-size:11px;letter-spacing:1px;color:#a37a3c;font-weight:700;}
  .tab .tab-title{font-size:14px;color:inherit;}
  .tab .tab-sub{font-size:11px;font-weight:500;color:#a37a3c;}
  .tab.active{background:linear-gradient(180deg,#ffd6e7,#ffb8d4);border-color:var(--pink-deep);color:var(--pink-deep);box-shadow:0 4px 10px rgba(230,52,117,.18);}
  .tab.active .tab-num,.tab.active .tab-sub{color:var(--pink-deep);}
  .tab.empty{cursor:default;opacity:.6;}
  .tab.active.empty{background:#fff5e3;border-color:#f3d9a4;color:var(--ink-soft);box-shadow:none;}

  /* ===== Day 内容 ===== */
  .day-panel{display:none;}
  .day-panel.active{display:grid;grid-template-columns:1fr 2fr;gap:18px;background:#fffaf0;border:2px solid #f3d9a4;border-radius:16px;padding:14px;animation:fade .25s ease;align-items:start;}
  @keyframes fade{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}
  .day-panel .left-col{position:relative;display:flex;flex-direction:column;}
  .day-panel .right-col{background:var(--cream);border:2px solid #f3d9a4;border-radius:12px;padding:14px 16px;min-width:0;overflow:hidden;}
  .day-panel h2{margin:0 0 6px;font-size:24px;font-weight:900;color:var(--pink-deep);letter-spacing:1px;}
  .day-panel h2 .badge{background:var(--pink-deep);color:#fff;border-radius:8px;padding:1px 12px;margin-right:8px;font-size:18px;}
  .day-panel .date{font-size:13px;color:#a37a3c;font-weight:700;margin-bottom:8px;}
  .day-panel .city-tag-inline{display:inline-block;background:#fff5f8;border:1px solid #f5b4ce;color:#a37a3c;border-radius:10px;padding:2px 10px;font-size:11px;margin-left:6px;}

  /* ===== Leaflet 地图（滚动跟随：sticky 在 day-panel 内） ===== */
  .day-panel .left-col{position:relative;display:flex;flex-direction:column;align-self:start;z-index:20;}
  /* 关键：让 left-col 整体在 day-panel 滚动时跟随视口 */
  .day-panel .left-col{position:sticky;top:14px;}
  .mapwrap{position:relative;background:#fbf5e3;border:2px solid #f3d9a4;border-radius:12px;padding:6px;display:flex;flex-direction:column;height:680px;overflow:hidden;z-index:20;}
  .map{width:100%;height:100%;border-radius:8px;overflow:hidden;box-shadow:0 2px 6px rgba(160,120,60,.12);z-index:20;position:relative;}
  .hotel-marker{position:absolute;top:14px;left:14px;z-index:500;background:var(--pink-soft);color:var(--pink-deep);border:2px solid var(--pink-deep);font-weight:900;font-size:12px;padding:5px 10px;border-radius:8px;box-shadow:0 2px 4px rgba(224,52,117,.25);}
  /* 自定义 Leaflet 标记 */
  .leaflet-marker-num{
    width:32px;height:32px;border-radius:50% 50% 50% 0;
    background:var(--pink-deep);color:#fff;font-weight:900;font-size:14px;
    display:flex;align-items:center;justify-content:center;
    transform:rotate(-45deg);
    box-shadow:0 3px 6px rgba(0,0,0,.25);
    border:2px solid #fff;
  }
  .leaflet-marker-num>span{transform:rotate(45deg);line-height:1;}
  .leaflet-marker-num.hotel{background:#fff0d6;color:#7a4a00;border-color:var(--pink-deep);border-width:2.5px;}
  .leaflet-marker-num.dinner{background:var(--green-deep);color:#fff;}
  .leaflet-marker-num.sunset{background:#ff944d;color:#fff;}
  .leaflet-marker-num.bridge{background:#3a82c9;color:#fff;}
  .leaflet-marker-num.view{background:#d4a017;color:#fff;}

  .leaflet-popup-content{margin:10px 14px;font-family:inherit;min-width:160px;}
  .leaflet-popup-content b{color:var(--pink-deep);}
  .leaflet-popup-content small{color:#888;display:block;margin-top:2px;}

  /* ===== Day 1 跨境/航班抽象图 ===== */
  .transit-board{background:#fbf5e3;border:2px solid #f3d9a4;border-radius:12px;padding:10px;display:flex;align-items:center;justify-content:center;height:340px;}
  .transit-board svg{width:100%;max-width:500px;height:auto;}

  /* ===== 编辑模式高亮 ===== */
  body.edit-mode .day-panel.active h2,
  body.edit-mode .day-panel.active .date,
  body.edit-mode .panel ul li{cursor:text;outline:1px dashed #f5b4ce;outline-offset:2px;border-radius:4px;transition:background .15s;}
  body.edit-mode .day-panel.active h2:hover,
  body.edit-mode .day-panel.active .date:hover,
  body.edit-mode .panel ul li:hover{background:#fff5f8;}
  body.edit-mode .panel{cursor:text;}
  body.edit-mode .info .enjoy{pointer-events:none;opacity:.6;}

  .del-row{margin-left:6px;border:none;background:#f08080;color:#fff;border-radius:50%;width:20px;height:20px;font-size:11px;cursor:pointer;line-height:1;font-weight:900;flex-shrink:0;}
  .del-row:hover{background:#c0392b;}
  body:not(.edit-mode) .del-row{display:none;}

  /* ===== 拖拽 ===== */
  body.edit-mode .list-row[draggable]{cursor:default;}
  body.edit-mode .list-drag-handle:active{cursor:grabbing;}
  .list-row.dragging{opacity:.4;background:#fff5f8;}
  .list-row.drag-over{box-shadow:inset 0 0 0 2px var(--pink-deep);}
  body.edit-mode .panel ul li[draggable]{cursor:grab;}
  .panel ul li.dragging{opacity:.4;}
  .panel ul li.drag-over{box-shadow:inset 0 0 0 2px var(--pink-deep);}

  /* ===== 底部 li 删除按钮 ===== */
  .del-li{
    display:none;margin-left:6px;
    border:none;background:#f08080;color:#fff;
    border-radius:50%;width:18px;height:18px;
    font-size:10px;cursor:pointer;line-height:1;font-weight:900;
    vertical-align:middle;
  }
  .del-li:hover{background:#c0392b;}
  body.edit-mode .del-li{display:inline-block;}

  /* ===== 底部 li 新增按钮 ===== */
  .add-li{
    display:none;margin-top:6px;margin-left:8px;
    width:22px;height:22px;border-radius:50%;
    background:#3b82f6;color:#fff;border:none;
    font-size:13px;font-weight:900;cursor:pointer;
    align-items:center;justify-content:center;line-height:1;
    box-shadow:0 2px 4px rgba(59,130,246,.3);
  }
  .add-li:hover{background:#2563eb;}
  body.edit-mode .add-li{display:inline-flex;}

  /* ===== List 项通用 ===== */
  .list-row{
    display:flex;flex-direction:column;gap:6px;align-items:stretch;
    margin:6px 0;padding:8px;border-radius:10px;
    background:#fffaf0;border:1px solid #f3d9a4;
    position:relative;transition:background .15s;
  }
  .list-row:hover{background:#fff5f8;}
  .list-row.active{background:#ffe6f0;box-shadow:inset 0 0 0 1px #f5b4ce;}

  /* 头部 icon（点击可切换） */
  .list-icon{
    flex:0 0 32px;width:32px;height:32px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-weight:900;font-size:14px;color:#fff;
    background:var(--pink-deep);cursor:pointer;
    user-select:none;flex-shrink:0;position:relative;
  }
  .list-icon:hover{transform:scale(1.08);}
  .list-row[data-type="meal"]      .list-icon{background:var(--green-deep);}
  .list-row[data-type="transport"] .list-icon{background:#2563eb;}

  /* 餐饮 list：仅 .list-time 文字颜色为绿色 */
  .list-row[data-type="meal"] .list-time{color:var(--green-deep);}
  .list-row[data-type="meal"] .list-time:empty::before{color:#bbb;}

  /* 主体 */
  .list-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px;}
  .list-name{display:flex;align-items:center;gap:6px;}
  .list-name b{font-size:14px;color:#2b2b2b;font-weight:900;overflow-wrap:break-word;word-break:break-word;}
  .list-locate{
    display:inline-flex;align-items:center;justify-content:center;
    width:20px;height:20px;border-radius:50%;background:#fff;color:#2563eb;
    border:1px solid #93c5fd;font-size:11px;text-decoration:none;
  }
  .list-locate:hover{background:#2563eb;color:#fff;}
  .list-action{font-size:12.5px;color:#444;padding:1px 2px;overflow-wrap:break-word;word-break:break-word;}
  .list-note{font-size:11.5px;color:#888;font-style:italic;padding:1px 2px;overflow-wrap:break-word;word-break:break-word;}

  /* 交通 list 时长 - 占位背景 */
  .list-transport-duration{
    border:none;background:transparent;color:#2563eb;
    font-weight:700;font-size:12px;padding:2px 4px;border-radius:4px;
    font-family:inherit;display:inline-block;min-height:0;min-width:0;
  }
  .list-transport-duration:empty{display:none;}
  body.edit-mode .list-transport-duration:empty{
    display:inline-block;min-height:18px;min-width:80px;
    outline:1px dashed #93c5fd;
  }
  body.edit-mode .list-transport-duration:empty::before{
    content:attr(data-placeholder);color:#bbb;font-style:italic;font-weight:400;
  }

  /* 停留时间（活动 / 饭点 list）- 仅作占位背景 */
  .list-time{
    border:none;background:transparent;color:var(--pink-deep);
    font-weight:700;font-size:12px;padding:1px 4px;border-radius:4px;
    font-family:inherit;display:inline-block;min-height:0;min-width:0;
  }
  /* 空时：编辑态用 ::before 展示占位文本（不与输入内容冲突） */
  .list-time:empty{display:none;}
  body.edit-mode .list-time:empty{
    display:inline-block;min-height:18px;min-width:80px;
    outline:1px dashed #f5b4ce;
  }
  body.edit-mode .list-time:empty::before{
    content:attr(data-placeholder);color:#bbb;font-style:italic;font-weight:400;
  }

  /* 空字段占位符：仅在编辑状态下显示（list-time / list-transport-duration / list-action / list-note）*/
  body.edit-mode .list-action.empty-field::before,
  body.edit-mode .list-note.empty-field::before,
  body.edit-mode .list-time.empty-field::before,
  body.edit-mode .list-transport-duration.empty-field::before{
    content:attr(data-placeholder);color:#bbb;font-style:italic;
  }
  body.edit-mode .list-action,
  body.edit-mode .list-note,
  body.edit-mode .list-time,
  body.edit-mode .list-transport-duration{border:1px dashed #f5b4ce;border-radius:4px;padding:2px 6px;min-height:18px;}
  body.edit-mode .list-action:focus,
  body.edit-mode .list-note:focus,
  body.edit-mode .list-time:focus,
  body.edit-mode .list-transport-duration:focus{outline:none;background:#fff5f8;}
  body:not(.edit-mode) .list-action.empty-field,
  body:not(.edit-mode) .list-note.empty-field{display:none;}
  /* 活动内容/备注始终显示，不跟随折叠状态 */

  /* list-row 删除按钮 */
  .del-row{
    margin-left:6px;border:none;background:#f08080;color:#fff;
    border-radius:50%;width:20px;height:20px;font-size:11px;cursor:pointer;
    line-height:1;font-weight:900;flex-shrink:0;
  }
  .del-row:hover{background:#c0392b;}
  body:not(.edit-mode) .del-row{display:none;}

  /* list-row 新增按钮（默认隐藏，编辑模式显示） */
  .add-list{
    display:none;margin-top:4px;margin-left:42px;
    width:24px;height:24px;border-radius:50%;
    background:#3b82f6;color:#fff;border:none;
    font-size:14px;font-weight:900;cursor:pointer;
    align-items:center;justify-content:center;line-height:1;
    box-shadow:0 2px 6px rgba(59,130,246,.35);
  }
  .add-list:hover{background:#2563eb;transform:scale(1.1);}
  body.edit-mode .add-list{display:inline-flex;}

  /* ===== Popover 浮窗（icon 点击后弹出，fixed 定位避免被遮挡） ===== */
  .icon-popover{
    position:fixed;z-index:99999;
    background:#fff;border:2px solid var(--pink-deep);
    border-radius:10px;padding:6px;box-shadow:0 6px 20px rgba(0,0,0,.18);
    display:none;flex-wrap:wrap;gap:4px;max-width:260px;
  }
  .icon-popover.show{display:flex;}
  .icon-popover .pop-item{
    width:32px;height:32px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    background:var(--cream);cursor:pointer;font-size:16px;
    border:1px solid #f3d9a4;
  }
  .icon-popover .pop-item:hover{background:var(--pink-soft);}

  /* ===== 拖拽手柄（list-row 末尾对齐右边，编辑模式显示） ===== */
  .list-drag-handle{
    display:none;flex:0 0 auto;align-self:center;
    width:24px;height:24px;border-radius:6px;
    background:#fff5f8;border:1px dashed #f5b4ce;
    color:#e63475;font-size:14px;font-weight:900;
    cursor:grab;user-select:none;
    align-items:center;justify-content:center;
    margin-left:6px;flex-shrink:0;
  }
  body.edit-mode .list-drag-handle{display:flex;}
  .list-drag-handle:active{cursor:grabbing;}
  .list-drag-handle:hover{background:#ffe6f0;}

  /* ===== Image gallery ===== */
  .img-gallery{
    display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;
    min-height:0;
    transition:all .2s;
  }
  .img-gallery.collapsed{flex-direction:row;}
  .img-gallery.collapsed .img-thumb:nth-child(n+2){display:none;}
  /* 非编辑态 + 0 张图时整行隐藏（连"+ 添加图片"框也隐藏） */
  body:not(.edit-mode) .img-gallery.empty{display:none;}

  /* 交通 list：隐藏整个 .img-gallery（不配图，避免与下方景点重复） */
  .list-row[data-type="transport"] .img-gallery{display:none !important;}

  /* ===== 非编辑态：4 列 grid（icon | main | img | toggle） ===== */
  body:not(.edit-mode) .list-row{
    display:grid;
    grid-template-columns: 32px 1fr 88px 32px;
    grid-template-rows: auto auto;
    column-gap:6px;
    align-items:center;
  }
  /* ===== 编辑态：4 列 grid + 图在 row 2 横排 ===== */
  body.edit-mode .list-row{
    display:grid;
    grid-template-columns: 32px 1fr 32px 32px;
    grid-template-rows: auto auto;
    column-gap:8px;
    align-items:start;
  }
  body.edit-mode .list-row > .list-icon{grid-column:1;grid-row:1;}
  body.edit-mode .list-row > .list-main{grid-column:2;grid-row:1;min-width:0;}
  body.edit-mode .list-row > .del-row{grid-column:3;grid-row:1;justify-self:center;align-self:start;}
  body.edit-mode .list-row > .list-drag-handle{grid-column:4;grid-row:1;justify-self:center;align-self:start;}
  body.edit-mode .list-row > .img-gallery{grid-column:1/5;grid-row:2;margin-top:4px;margin-left:32px;}
  body:not(.edit-mode) .list-row > .list-icon{
    grid-column:1;grid-row:1;align-self:start;
  }
  body:not(.edit-mode) .list-row > .list-main{grid-column:2;grid-row:1;min-width:0;}
  body:not(.edit-mode) .list-row > .img-gallery.collapsed{
    grid-column:3;grid-row:1;
    margin-top:0;
    width:88px;height:88px;
    flex-wrap:nowrap;
    position:relative;
  }
  body:not(.edit-mode) .list-row > .img-gallery.collapsed .img-thumb{
    width:88px !important;height:88px !important;
  }
  /* 展开态（图 1）：图横排在 list 左下，从左到右平铺，可换行，不溢出父容器 */
  body:not(.edit-mode) .list-row > .img-gallery:not(.collapsed){
    grid-column:1/4;grid-row:2;
    margin-top:6px;
    margin-left:32px;
    max-width:calc(100% - 32px);
    flex-wrap:wrap !important;
    width:auto !important;
    height:auto !important;
  }
  /* 折叠/展开按钮：固定在 column 4，row 1（折叠）或 row 2（展开） */
  body:not(.edit-mode) .list-row > .img-toggle{
    grid-column:4;grid-row:1;justify-self:center;align-self:start;
  }
  body:not(.edit-mode) .list-row > .img-toggle.expanded{
    grid-row:2;align-self:start;
  }
  /* 折叠/展开按钮的显隐：始终由 applyImgGalleryCollapse 控制 */
  body:not(.edit-mode) .img-toggle{display:none;}
  body.edit-mode .img-toggle{display:none !important;}

  .img-thumb{
    position:relative;width:88px;height:64px;
    border-radius:6px;overflow:hidden;
    border:1px solid #f3d9a4;background:#fbf5e3;
    cursor:zoom-in;flex-shrink:0;outline:none;z-index:1;
  }
  /* 非编辑态展开图：确保可点击且不被遮挡 */
  body:not(.edit-mode) .img-gallery:not(.collapsed) .img-thumb{
    z-index:2 !important;
    pointer-events:auto !important;
  }
  /* 展开态：图更大更清晰 */
  body:not(.edit-mode) .img-gallery:not(.collapsed) .img-thumb{
    width:120px;height:88px;
  }
  body.edit-mode .img-thumb{cursor:grab;}
  body.edit-mode .img-thumb:active{cursor:grabbing;}
  body.edit-mode .img-thumb.selected{
    outline:2px solid var(--pink-deep);
    box-shadow:0 0 0 2px var(--pink-deep);
  }
  body.edit-mode .img-thumb.dragging{opacity:.25;}
  /* 克隆体：悬浮跟随鼠标 */
  body.edit-mode .img-clone{
    cursor:grabbing;
    transform:scale(1.1);
    box-shadow:0 12px 32px rgba(0,0,0,.3), 0 0 0 2px var(--pink-deep);
    border-radius:8px;
    transition:none;
  }
  /* 交换目标：蓝色虚线边框 + 微放大 */
  body.edit-mode .img-thumb.swap-target{outline:3px dashed #2563eb;box-shadow:0 0 0 3px rgba(37,99,235,.25);transform:scale(1.05);}
  body.edit-mode .img-thumb.drag-over{outline:3px dashed #2563eb;box-shadow:0 0 0 3px rgba(37,99,235,.25);transform:scale(1.02);}
  /* gallery 级别拖拽反馈 */
  body.edit-mode .img-gallery.drag-active{background:transparent;}
  body.edit-mode .img-gallery.drag-active .img-add{display:none;}
  body.edit-mode .img-gallery.drag-over-gallery{outline:2px dashed rgba(37,99,235,.4);background:rgba(37,99,235,.06);}
  body.edit-mode .img-add.drag-over{display:flex;background:#dcfce7;border-color:#3a8a2c;color:#3a8a2c;}
  /* ✅ 非编辑态：完全隐藏 +添加图片 框 */
  body:not(.edit-mode) .img-add{display:none !important;}
  .img-thumb img{width:100%;height:100%;object-fit:cover;display:block;user-select:none;-webkit-user-drag:none;}
  /* 非编辑态展开图：确保图片可点击 */
  body:not(.edit-mode) .img-gallery:not(.collapsed) .img-thumb,
  body:not(.edit-mode) .img-gallery:not(.collapsed) .img-thumb img{
    pointer-events:auto !important;
    cursor:pointer !important;
  }

  .img-del{
    position:absolute;top:2px;right:2px;
    width:18px;height:18px;border-radius:50%;
    background:rgba(240,128,128,.95);color:#fff;
    border:none;font-size:11px;line-height:1;
    cursor:pointer;display:none;font-weight:900;
    align-items:center;justify-content:center;
    padding:0;box-shadow:0 1px 3px rgba(0,0,0,.3);
  }
  body.edit-mode .img-del{display:flex;}
  .img-del:hover{background:#c0392b;}

  .img-add{
    width:88px;height:64px;
    border-radius:6px;border:2px dashed #93c5fd;
    background:#eff6ff;color:#2563eb;
    display:flex;align-items:center;justify-content:center;
    font-size:11px;font-weight:900;cursor:pointer;
    flex-shrink:0;text-align:center;padding:4px;
  }
  .img-add:hover{background:#dbeafe;}
  .img-add.flash{background:#dcfce7;border-color:#3a8a2c;color:#3a8a2c;}
  .img-add.active{background:#fff;border:2px solid #ef4444;color:#dc2626;box-shadow:0 0 0 3px rgba(239,68,68,.18);font-weight:900;}
  .img-add.dropping{background:#dcfce7;border:2px solid #3a8a2c;color:#3a8a2c;}

  /* 编辑态「🔄 重拉图片」按钮：紧跟 .img-add，只在编辑态显示 */
  .img-refetch{
    width:88px;height:28px;
    border-radius:6px;border:1px solid #93c5fd;
    background:#eff6ff;color:#2563eb;
    font-size:11px;font-weight:700;cursor:pointer;
    flex-shrink:0;text-align:center;padding:0;
    margin-left:6px;display:none;
  }
  body.edit-mode .img-refetch{display:inline-flex;align-items:center;justify-content:center;}
  .img-refetch:hover{background:#dbeafe;}
  .img-refetch:active{background:#bfdbfe;}
  .img-refetch.flash{background:#dcfce7;border-color:#3a8a2c;color:#3a8a2c;}

  .img-toggle{
    width:32px;height:32px;border-radius:50%;
    background:var(--pink-deep);color:#fff;
    font-size:14px;font-weight:900;
    cursor:pointer;border:none;padding:0;
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 2px 4px rgba(0,0,0,.18);
    line-height:1;flex-shrink:0;z-index:3;
    transition:transform .15s;
  }
  .img-toggle:hover{transform:scale(1.1);}
  .img-toggle-arrow{display:inline-block;}

  /* ===== 模态：全屏看图 ===== */
  .img-modal{
    position:fixed;inset:0;z-index:99999;
    background:rgba(0,0,0,.85);
    display:none;align-items:center;justify-content:center;
    flex-direction:row;gap:18px;
  }
  .img-modal.show{display:flex;}
  .img-modal img{
    max-width:80vw;max-height:88vh;object-fit:contain;
    border-radius:6px;box-shadow:0 8px 32px rgba(0,0,0,.5);
  }
  .img-modal .img-close{
    position:absolute;top:18px;right:18px;
    width:40px;height:40px;border-radius:50%;
    background:rgba(255,255,255,.95);color:#333;
    border:none;font-size:22px;cursor:pointer;font-weight:900;
    display:flex;align-items:center;justify-content:center;
    line-height:1;
  }
  .img-modal .img-nav{
    background:rgba(255,255,255,.9);color:#333;border:none;
    width:48px;height:48px;border-radius:50%;font-size:30px;
    cursor:pointer;font-weight:900;
    display:flex;align-items:center;justify-content:center;
    line-height:1;
  }
  .img-modal .img-nav:hover{background:#fff;}
  .img-modal .img-counter{
    position:absolute;bottom:18px;left:50%;transform:translateX(-50%);
    color:#fff;font-size:13px;background:rgba(0,0,0,.5);
    padding:4px 14px;border-radius:14px;
  }
  .bottom-textarea{
    width:100%;
    height:auto;
    border:2px dashed #f3d9a4;
    border-radius:8px;
    background:#fffaf0;
    padding:10px 12px;
    font-family:inherit;
    font-size:13px;
    line-height:1.7;
    color:#444;
    resize:none;
    outline:none;
    box-sizing:border-box;
    overflow:hidden;
  }
  .bottom-textarea:read-only{
    cursor:default;
    background:#fffaf0;
    border-color:#f3d9a4;
  }
  body.edit-mode .bottom-textarea{
    border-color:#f5b4ce;
    background:#fff5f8;
    cursor:text;
  }
  body.edit-mode .bottom-textarea:focus{
    border-color:var(--pink-deep);
    background:#fff;
  }
  /* 每行 emoji + 文本，前面 emoji 自动保留 */
  /* 占位符 */
  .bottom-textarea:read-only:placeholder-shown{color:#bbb;font-style:italic;}

  /* ===== 右侧行程详情 ===== */
  .timeline{position:relative;padding-left:18px;overflow:visible;}
  .timeline::before{content:"";position:absolute;left:5px;top:6px;bottom:6px;width:2px;background:linear-gradient(180deg,#f5b4ce,#db2777);}

  /* ===== 底部实用信息 ===== */
  .info{display:grid;grid-template-columns:1fr 1fr 1.4fr;gap:14px;margin-top:18px;}
  .panel{background:var(--cream);border:2px solid #f3d9a4;border-radius:14px;padding:14px 16px;}
  .panel h3{margin:0 0 8px;font-size:16px;font-weight:900;color:var(--pink-deep);display:flex;align-items:center;gap:6px;}
  .panel h3::before{content:"";display:inline-block;width:6px;height:18px;background:var(--pink-deep);border-radius:3px;}
  .panel ul{margin:0;padding-left:18px;font-size:13px;line-height:1.85;color:#444;}
  .panel ul li::marker{color:var(--pink-deep);}
  .panel .tipicon{display:inline-block;width:18px;text-align:center;margin-right:4px;}

  .enjoy{display:flex;align-items:center;justify-content:flex-end;gap:10px;margin-top:12px;color:var(--pink-deep);font-family:"Brush Script MT",cursive;font-size:30px;font-weight:700;}
  .enjoy .heart{color:var(--pink-deep);font-size:22px;}

  .attrib{font-size:11px;color:#a07a3c;text-align:right;margin-top:6px;}

/* ===== 信息卡片（表格类内容，如芝士/红酒指南、店铺推荐） ===== */
.info-card{background:#fff;border:1px solid #e8d5a3;border-radius:10px;padding:12px 14px;margin:10px 0;font-size:12px;line-height:1.6;color:#5c3a00;overflow-x:auto;}
.info-card h4{font-size:13px;font-weight:900;color:var(--pink-deep);margin:0 0 8px;display:flex;align-items:center;gap:6px;cursor:pointer;user-select:none;}
.info-card h4:hover{opacity:.75;}
.info-card h4::before{content:"";display:inline-block;width:4px;height:14px;background:var(--pink-deep);border-radius:2px;}
.info-card h4::after{content:"▾";margin-left:auto;font-size:11px;transition:transform .2s;}
.info-card.collapsed h4::after{content:"▸";}
.info-card.collapsed h4{margin-bottom:0;}
.info-card.collapsed>:not(h4){display:none;}
.info-card table{width:100%;border-collapse:collapse;font-size:11px;margin:4px 0;table-layout:auto;}
.info-card th{background:#fff5e6;color:#7a4a00;font-weight:800;padding:5px 7px;text-align:left;border-bottom:2px solid #f3d9a4;white-space:nowrap;}
.info-card td{padding:4px 7px;border-bottom:1px solid #faf0dc;vertical-align:top;overflow-wrap:break-word;word-break:break-word;}
.info-card td:last-child{color:#666;font-size:10px;}
.info-card .meal-table td:last-child{color:inherit;font-size:inherit;}
.info-card .meal-table{table-layout:fixed;}
.info-card .meal-table th,
.info-card .meal-table td{padding:5px 10px;}
.info-card .meal-table .col-narrow{width:7%;min-width:38px;white-space:nowrap;}
.info-card .meal-table .col-dish{width:42%;min-width:180px;}
.info-card .meal-table .col-note{width:32%;min-width:140px;}
.info-card .meal-table tr>:nth-child(2){width:19%;min-width:110px;}
.info-card .tag{display:inline-block;background:var(--pink-soft);color:var(--pink-deep);font-size:10px;padding:1px 6px;border-radius:4px;margin:1px 2px;white-space:nowrap;}
.info-card .tag.green{background:#e6f4ea;color:#2d6a4f;}
.info-card .tag.blue{background:#e6f0ff;color:#1e40af;}
.info-card .star{color:#e6a817;font-weight:900;}
.info-card ul{margin:4px 0;padding-left:16px;}
.info-card ul li{margin:2px 0;}
.info-card .highlight{background:#fff8e1;border-left:3px solid #f0c040;padding:4px 8px;margin:6px 0;border-radius:0 6px 6px 0;font-weight:700;}
.info-card .warn{background:#fff0f0;border-left:3px solid #e63475;padding:4px 8px;margin:6px 0;border-radius:0 6px 6px 0;color:#b91c1c;font-weight:700;}
.info-card .gmaps-btn{display:inline-flex;align-items:center;gap:3px;margin-top:3px;color:#2563eb;text-decoration:none;font-size:11px;font-weight:600;white-space:nowrap;transition:opacity .15s;}
.info-card .gmaps-btn:hover{opacity:.7;}
.info-card td img{display:block;max-width:120px;height:auto;border-radius:6px;}
  /* ===== 可折叠卡片 ===== */
  .collapse-toggle{display:inline-block;margin-top:6px;cursor:pointer;font-size:11px;color:#2563eb;font-weight:700;user-select:none;transition:opacity .15s;}
  .collapse-toggle:hover{opacity:.7;}
  .info-card[data-collapsed="1"] .collapse-body{display:none;}
  .info-card[data-collapsed="0"] .collapse-body{display:block;}

  @media (max-width:900px){
    /* ===== 手机端：去掉外层边框和 padding，充分利用屏幕宽度 ===== */
    .page{padding:8px 6px 12px;border-radius:8px;border:none;box-shadow:none;}
    .day-panel.active{grid-template-columns:1fr;gap:8px;padding:6px 0;border:none;border-radius:0;background:transparent;}
    .day-panel .right-col{padding:6px 6px;border:none;border-radius:0;background:transparent;}
    .day-panel h2{font-size:20px;margin:0 0 4px;}
    .day-panel .date{font-size:12px;margin-bottom:4px;}
    /* 手机端 tab 栏：缩小间距，去掉边框 */
    .tabs{gap:3px;margin:0 0 8px;padding:3px;border:none;border-radius:0;background:transparent;}
    .tab{padding:6px 8px;border-radius:6px;min-width:auto;flex:0 0 auto;border-width:1px;}
    .tab .tab-num{font-size:10px;}
    .tab .tab-title{font-size:12px;}
    .tab .tab-sub{font-size:10px;}
    .tab.active{box-shadow:none;}
    /* 手机端 info-card：减少内边距 */
    .info-card{padding:6px 6px;margin:4px 0;border-radius:6px;font-size:11px;}
    .info-card h4{font-size:12px;margin:0 0 4px;}
    .info-card table{font-size:10px;}
    .info-card th{padding:3px 4px;white-space:normal;}
    .info-card td{padding:2px 4px;}
    /* 手机端 list-row：减少内边距 */
    .list-row{padding:4px 4px;margin:2px 0;border-radius:6px;font-size:12px;}
    body:not(.edit-mode) .list-row{gap:4px;}
    .list-icon{width:24px;height:24px;font-size:11px;}
    .list-name{font-size:12px;}
    .list-time{font-size:11px;}
    .list-note{font-size:10px;}
    .list-action{font-size:10px;}
    .info-card td img{max-width:60px;}
    /* ✅ 手机端地图高度随页面宽度动态缩放 */
    .mapwrap{min-height:auto;height:calc(100vw * 0.52);max-height:none;z-index:20;padding:3px;border:none;border-radius:0;background:transparent;}
    .map{height:calc(100vw * 0.50);min-height:180px;max-height:none;z-index:20;border-radius:6px;}
    /* 手机端缩小 Leaflet 控件 */
    .leaflet-marker-num{width:26px;height:26px;font-size:12px;border-width:1.5px;box-shadow:0 2px 4px rgba(0,0,0,.2);}
    .leaflet-popup-content{margin:6px 10px;min-width:120px;font-size:11px;}
    .leaflet-control-zoom a{width:28px;height:28px;line-height:28px;font-size:14px;}
    .leaflet-touch .leaflet-control-zoom a{width:30px;height:30px;line-height:30px;}
    header{flex-direction:column;align-items:flex-start;gap:10px;}
    h1{font-size:30px;}
    /* ✅ 手机端 list-row 浮窗降低 z-index，让地图在最上层 */
    .list-row{z-index:1;}
    /* ✅ 底部三个 panel 改为纵向堆叠，避免横向挤压 */
    .info{grid-template-columns:1fr !important;}
    /* 按钮 */
    .tool-btn{font-size:11px;padding:5px 10px;}
    .gmaps-btn{font-size:10px;}
    .transit-board{height:auto;padding:6px;}
    .transit-board svg{max-width:100%;}
  }
  /* ===== 手机横屏：恢复桌面左右双栏布局 ===== */
  @media (max-width:900px) and (orientation: landscape){
    .day-panel.active{grid-template-columns:1fr 2fr;gap:12px;padding:8px;border:2px solid #f3d9a4;border-radius:12px;background:#fffaf0;}
    .day-panel .right-col{padding:10px 12px;border:2px solid #f3d9a4;border-radius:10px;background:var(--cream);}
    .day-panel h2{font-size:20px;margin:0 0 4px;}
    .day-panel .date{font-size:12px;margin-bottom:4px;}
    .mapwrap{min-height:auto;height:calc(100vh - 60px);max-height:none;z-index:20;padding:3px;border:2px solid #f3d9a4;border-radius:10px;background:#fbf5e3;}
    .map{height:100%;min-height:auto;max-height:none;z-index:20;border-radius:6px;}
    .tabs{gap:2px;margin:0 0 6px;padding:2px;border:none;border-radius:0;background:transparent;}
    .tab{padding:4px 6px;border-radius:5px;min-width:auto;flex:0 0 auto;border-width:1px;}
    .tab .tab-num{font-size:9px;}
    .tab .tab-title{font-size:11px;}
    .tab .tab-sub{font-size:9px;}
    .info-card{padding:4px 6px;margin:3px 0;border-radius:5px;font-size:11px;}
    .info-card h4{font-size:12px;margin:0 0 4px;}
    .info-card table{font-size:10px;}
    .list-row{padding:3px 4px;margin:2px 0;border-radius:5px;font-size:11px;}
    body:not(.edit-mode) .list-row{gap:3px;}
    .list-icon{width:22px;height:22px;font-size:10px;}
    .list-name{font-size:11px;}
    .list-time{font-size:10px;}
    .list-note{font-size:9px;}
    .leaflet-marker-num{width:24px;height:24px;font-size:10px;border-width:1.5px;}
    .leaflet-control-zoom a{width:24px;height:24px;line-height:24px;font-size:12px;}
    .leaflet-touch .leaflet-control-zoom a{width:26px;height:26px;line-height:26px;}
    .info{grid-template-columns:1fr 1fr !important;}
    .page{padding:4px 4px 8px;border-radius:6px;border:none;box-shadow:none;}
    header{flex-direction:row;align-items:center;gap:8px;}
    h1{font-size:18px;}
    .tool-btn{font-size:10px;padding:4px 8px;}
  }
</style>
</head>
<body>
<div class="page">

  <!-- ===== 顶部标题 ===== -->
  <header>
    <div>
      <h1>🇮🇹 意大利四城<span class="small">12 天深度游</span><span class="flag-ita" title="Italy"></span></h1>
      <div class="subtitle">罗马 3 天 + 佛罗伦萨 3 天 + 多洛米蒂 3 天 + 米兰 3 天 · 2026.10.1–10.12</div>
    </div>
    <div class="city-card">
      <div class="city-icons">🏛️⛪🏔️🏙️</div>
      <div class="city-label">ROMA · FIRENZE · DOLOMITI · MILANO</div>
      <div class="city-tag">♥ Italy 2026</div>
    </div>
    <div class="toolbar">
      <button id="edit-toggle" class="tool-btn" type="button">✏️ 编辑</button>
      <button id="refetch-btn" class="tool-btn ghost" type="button" title="清除联网拉的图片缓存并重新加载（手动粘贴的图保留）" style="display:none;">🔄 重拉图片</button>
          </div>
  </header>

  <!-- ===== 顶部 Tab 栏 ===== -->
  <nav class="tabs" id="tabs">
    <button class="tab" data-day="1"><span class="tab-num">DAY 1 · 10.1</span><span class="tab-title">🛫 出发 / 抵达</span><span class="tab-sub">深圳 → 香港 → 罗马</span></button>
    <button class="tab" data-day="2"><span class="tab-num">DAY 2 · 10.2</span><span class="tab-title">⛪ 梵蒂冈深度</span><span class="tab-sub">圣彼得 · 博物馆 · 西斯廷</span></button>
    <button class="tab" data-day="3"><span class="tab-num">DAY 3 · 10.3</span><span class="tab-title">🏛️ 罗马古迹串游</span><span class="tab-sub">万神殿 → 斗兽场 → 许愿池</span></button>
    <button class="tab" data-day="4"><span class="tab-num">DAY 4 · 10.4</span><span class="tab-title">🎨 佛罗伦萨初印象</span><span class="tab-sub">圣洛伦佐 → 碧提宫 → Boboli 日落</span></button>
    <button class="tab" data-day="5"><span class="tab-num">DAY 5 · 10.5</span><span class="tab-title">⛪ 百花 + Oltrarno + 日落</span><span class="tab-sub">大教堂 → 圣三一桥 → 米开朗琪罗广场</span></button>
    <button class="tab" data-day="6"><span class="tab-num">DAY 6 · 10.6</span><span class="tab-title">🗿 学院美术馆 + 乌菲兹</span><span class="tab-sub">大卫 → 乌菲兹 → 老桥日落</span></button>
    <button class="tab" data-day="7"><span class="tab-num">DAY 7 · 10.7</span><span class="tab-title">🚄 转场多洛米蒂</span><span class="tab-sub">佛罗伦萨 → Bolzano → Ortisei</span></button>
    <button class="tab" data-day="8"><span class="tab-num">DAY 8 · 10.8</span><span class="tab-title">🚠 刀锋山 + 休斯高原</span><span class="tab-sub">Resciesa → Alpe di Siusi → Col Raiser</span></button>
    <button class="tab" data-day="9"><span class="tab-num">DAY 9 · 10.9</span><span class="tab-title">📝 待规划</span><span class="tab-sub">点击编辑添加行程</span></button>
    <button class="tab" data-day="10"><span class="tab-num">DAY 10 · 10.10</span><span class="tab-title">🚄 多洛米蒂 → 米兰</span><span class="tab-sub">Ortisei → Bolzano → Verona → Milano</span></button>
    <button class="tab" data-day="11"><span class="tab-num">DAY 11 · 10.11</span><span class="tab-title">🏙️ 米兰市区一日游</span><span class="tab-sub">Centrale → 大教堂 → 长廊 → Brera → Eataly</span></button>
    <button class="tab" data-day="12"><span class="tab-num">DAY 12 · 10.12</span><span class="tab-title">🛬 返程</span><span class="tab-sub">米兰 → 阿布扎比 → 香港</span></button>
  </nav>

  <!-- ===== 各 Day 内容面板 ===== -->
  <div id="day-root"></div>

  <!-- ===== 底部实用信息 ===== -->
  <section class="info" id="bottom-info">
    <div class="panel" data-panel="info">
      <h3>实用信息</h3>
      <textarea class="bottom-textarea" data-list="info" readonly placeholder="点击 ✏️ 编辑后修改"></textarea>
    </div>
    <div class="panel" data-panel="tips">
      <h3>小贴士</h3>

// ✅ 全局删除按钮 handler（内联 onclick 调用，不依赖事件绑定顺序）
function handleImgDelClick(e, btn){
  console.log(`[img-del] clicked, editMode:`, editMode);
  if (!editMode) return; // 只在编辑态响应
  e.stopPropagation();
  e.preventDefault();
  const thumb = btn.closest(".img-thumb");
  const gallery = btn.closest(".img-gallery");
  const row = btn.closest(".list-row");

  console.log(`[img-del] removing from "${name}", remaining before:`, gallery?.querySelectorAll(".img-thumb:not(.img-placeholder):not(.img-clone)").length);
  if (!thumb) return;
  thumb.remove();

    const remaining = gallery.querySelectorAll(".img-thumb:not(.img-placeholder):not(.img-clone)").length;
    if (remaining === 0) gallery.dataset.collapsed = "0";
    applyImgGalleryCollapse(gallery);

  }
  if (row) saveRowImages(row);
  if (typeof refreshMarkerPopups === "function" && typeof currentDay !== "undefined") refreshMarkerPopups(currentDay);
}

// 地点名 → Google Maps URL
function gmapUrl(name){
  return "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(name);
}

// ✅ 用 OpenStreetMap Nominatim 地理编码景点名，更新 row 的 data-lat/data-lng
async function geocodeAndUpdateMarkers(d){
  const cfg = DAYS[d];
  if (!cfg) return;
  const dayPanel = document.querySelector(`.day-panel[data-day="${d}"]`);
  if (!dayPanel) return;
  const rows = Array.from(dayPanel.querySelectorAll(".list-row"));
  // ✅ 收集所有 Day 的静态节点（仅用于精确匹配兜底）
  const allNodes = Object.values(DAYS).filter(v => v && v.nodes).flatMap(v => v.nodes);

  const tasks = rows.map(async (row) => {
    const type = row.dataset.type;
    if (type === "transport") return; // 交通不标记
    const nameEl = row.querySelector(".name-text");
    const name = nameEl?.textContent?.trim();
    if (!name || isPendingName(name)) return; // 跳过模糊名称

    const norm = (s) => s.replace(/&amp;/g, "&");
    const normalizedName = norm(name);
    // 步骤1：在当前 Day 的 nodes 中查找（模糊匹配）
    let existingNode = cfg.nodes.find(n => n.name && (norm(n.name) === normalizedName || normalizedName.includes(norm(n.name)) || norm(n.name).includes(normalizedName)));
    // 步骤2：当前 Day 找不到时，跨所有 Day 精确匹配兜底
    if (!existingNode) {
      existingNode = allNodes.find(n => n.name && norm(n.name) === normalizedName);
    }
    // 步骤3：跨 Day 精确匹配也找不到，子串包含兜底
    if (!existingNode) {
      existingNode = allNodes.find(n => n.name && (normalizedName.includes(norm(n.name)) || norm(n.name).includes(normalizedName)));
    }
    if (existingNode) {
      row.dataset.lat = existingNode.lat;
      row.dataset.lng = existingNode.lng;
      return;
    }

    // ✅ 调用 Nominatim API 地理编码（优先用英文名提高命中率）
    try {
      const enName = resolveEnAlias(name.replace(/\([^)]+\)/g, "").replace(/（[^）]+）/g, "").trim())[0] || name;
      const query = `${enName}, ${d <= 3 ? 'Rome, Italy' : 'Florence, Italy'}`;
      const resp = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&limit=1`, {
        headers: { 'Accept-Language': 'en' }
      });
      const data = await resp.json();
      if (data && data.length > 0) {
        const lat = parseFloat(data[0].lat);
        const lng = parseFloat(data[0].lon);
        row.dataset.lat = lat;
        row.dataset.lng = lng;
        console.log(`[geocode] "${name}" → [${lat}, ${lng}]`);
      } else {
        console.log(`[geocode] "${name}" → NOT FOUND, skipping marker`);
      }
    } catch (e) {
      console.warn(`[geocode] "${name}" → ERROR:`, e.message);
    }
  });

  await Promise.allSettled(tasks);
}

// 通过 row 名称找对应 node index（严格匹配 + 前缀兜底）
function findNodeIndexByName(name){
  if (!name) return -1;
  const cfg = DAYS[currentDay];
  if (!cfg || !cfg.nodes) return -1;
  const norm = (s) => s.replace(/&amp;/g, "&");
  const normalizedName = norm(name);
  // 严格匹配（规范化 & 编码差异）
  let idx = cfg.nodes.findIndex(n => n.name && norm(n.name) === normalizedName);
  if (idx >= 0) return idx;
  // 前缀匹配（截取第一段）
  const a = normalizedName.split(/[→·\s]/)[0];
  idx = cfg.nodes.findIndex(n => {
    if (!n.name) return false;
    const b = norm(n.name).split(/[→·\s]/)[0];
    return a && b && a === b;
  });
  return idx;
}

// 点击行程单 icon → 地图定位 + 弹 popup
function locateRowOnMap(row){
  if (!map || !currentLayer || !currentLayer.markers) return;
  const name = row.querySelector(".name-text")?.textContent?.trim() || "";
  if (!name) return;
  const idx = findNodeIndexByName(name);
  if (idx < 0) return;
  const node = currentLayer.nodes[idx];
  const marker = currentLayer.markers[idx];
  if (!node || !marker) return;
  map.flyTo([node.lat, node.lng], Math.max(map.getZoom(), 16), { duration: .6 });
  marker.openPopup();
}

function showIconPopover(iconEl, row){
  // ✅ 编辑态：只弹分类浮窗，不触发地图
  console.log("[showIconPopover] called", { type: row?.dataset?.type, name: row?.querySelector(".name-text")?.textContent });

  const type = row.dataset.type || "activity";

  const pop = document.createElement("div");

  // 切换类型按钮
  const typeRow = document.createElement("div");
  typeRow.style.cssText = "width:100%;display:flex;gap:4px;margin-bottom:4px;padding-bottom:4px;border-bottom:1px solid #f3d9a4;";
  ["meal", "transport", "activity"].forEach(t => {
    const btn = document.createElement("div");
    btn.className = "pop-item";
    btn.title = TYPE_DEFS[t].label;
    btn.textContent = TYPE_DEFS[t].icon;
    btn.style.cssText = "width:auto;padding:0 8px;font-size:11px;";
    if (t === type) btn.style.background = "var(--pink-soft)";
    btn.onclick = (e) => {
      e.stopPropagation();
      pop.remove();
      changeRowType(row, t);
    };
    typeRow.appendChild(btn);
  });
  pop.appendChild(typeRow);

  // 当前类型图标选项
  def.icons.forEach(em => {
    const item = document.createElement("div");
    item.className = "pop-item";
    const e = em.split(" ")[0];
    item.textContent = e;
    item.title = em;
    item.onclick = (ev) => {
      ev.stopPropagation();
      pop.remove();
      iconEl.textContent = e;
      iconEl.dataset.icon = e;
      scheduleSave();
    };
    pop.appendChild(item);
  });

  // ✅ fixed 定位：紧贴 icon 下方，考虑滚动偏移
  document.body.appendChild(pop);
  const rect = iconEl.getBoundingClientRect();
  const scrollTop = window.pageYOffset || document.documentElement.scrollTop;
  const scrollLeft = window.pageXOffset || document.documentElement.scrollLeft;
  pop.style.position = "fixed";
  pop.style.top = (rect.bottom + 4) + "px";
  pop.style.left = Math.max(4, rect.left - 8) + "px";
  pop.style.zIndex = "99999";

  setTimeout(() => {
    const closeFn = (ev) => {
      if (!pop.contains(ev.target) && ev.target !== iconEl) {
        pop.remove();
        document.removeEventListener("click", closeFn);
      }
    };
    document.addEventListener("click", closeFn);
  }, 0);
}

// 纯文本粘贴：拦截富文本粘贴，只保留纯文本，与 list 自带文字格式保持一致
function bindPlainTextPaste(el){
  if (el.dataset.plainPasteBound === "1") return;
  el.dataset.plainPasteBound = "1";
  el.addEventListener("paste", (e) => {
    // 只处理"纯文字"粘贴；含文件（图片/其他）或无法确认是纯文本时，一律放行交给 row 处理
    const cd = e.clipboardData;
    if (!cd) return;
    const types = Array.from(cd.types || []);
    // 剪贴板含文件（图片/其他）→ 不拦截
    if (types.includes("Files")) {
      console.log("[field-paste] 含 Files，放行给 row 处理");
      return;
    }
    // 只有明确是 text/plain 才拦截（否则放行，避免误吞图片）
    if (!types.includes("text/plain")) {
      console.log("[field-paste] 无 text/plain，放行（types:", types.join(","), "）");
      return;
    }
    // 纯文字粘贴：拦截默认富文本，插入纯文本
    e.preventDefault();
    let text = cd.getData("text/plain");
    console.log("[field-paste] 纯文本粘贴，text 长度:", text?.length);
    // 插入纯文本（execCommand insertText 保留内容可编辑的换行语义）
    document.execCommand("insertText", false, text || "");
  });
}

// 给一个 row 装上编辑相关（contenteditable + delete + icon click + drag）
function attachRowHandlers(row){
  // ✅ 非编辑态：拦截 dragstart 阻止原生拖拽 ghost，但不影响 click 事件（图片查看模态框）
  if (!editMode) {
    row.removeAttribute("draggable");
    const preventDrag = (e) => e.preventDefault();
    row.removeEventListener("dragstart", preventDrag);
    row.addEventListener("dragstart", preventDrag, { passive: false });
  } else {
    row.setAttribute("draggable", "true");
  }
  if (editMode) {
    row.querySelectorAll(".name-text, .list-time, .list-transport-duration, .list-action, .list-note")
      .forEach(el => {
        el.contentEditable = "true"; el.spellcheck = false;
        bindPlainTextPaste(el);
      });
  }
  const icon = row.querySelector(".list-icon");
  const dayPanel = row.closest(".day-panel");
  const dayNum = dayPanel?.dataset.day;
  if (icon && !icon.dataset.iconHandlerBound) {
    icon.dataset.iconHandlerBound = "1";
    console.log("[attachRowHandlers] binding icon for day", dayNum, "row name:", row.querySelector(".name-text")?.textContent?.trim());
    icon.addEventListener("click", (e) => {
      console.log("[icon click] day:", dayNum, "editMode:", editMode, "name:", row.querySelector(".name-text")?.textContent?.trim());
      e.stopPropagation();
      // ✅ 统一 handler：根据当前 editMode 自动走对应分支
      if (editMode) {
        // 编辑态：弹出类型切换浮窗（不触发地图）
        showIconPopover(icon, row);
        return;
      }
      // 非编辑态：地图 flyTo + popup
      const name = row.querySelector(".name-text")?.textContent?.trim();
      if (!name || isPendingName(name)) return;
      if (!currentLayer || !currentLayer.markers) return;
      // ✅ 直接复用 focusSpotByName 的匹配逻辑，保证一致性
      focusSpotByName(name);
    });
  }
  let delBtn = row.querySelector(".del-row");
  if (!delBtn) {
    delBtn = document.createElement("button");
    delBtn.className = "del-row";
    delBtn.textContent = "✕";
    delBtn.title = "删除此条";
    row.appendChild(delBtn);
  }
  // 每次都重新绑事件（防止 detach 残留旧 listener 失效）
  delBtn.onclick = (e) => {
    e.stopPropagation();
    e.preventDefault();
    row.remove();
    scheduleSave();
  };
  if (editMode) attachDragHandlers(row);

  // 编辑态：row 任意位置粘贴图片 → 自动添加到画廊（每个 row 都绑，不受 gallery 是否已存在影响）
  if (!row.dataset.pasteBound) {
    row.dataset.pasteBound = "1";
    row.addEventListener("paste", (e) => {
      console.log("[row-paste] 收到粘贴事件，editMode:", editMode, "items:", e.clipboardData?.items?.length, "types:", e.clipboardData?.types);
      if (!editMode) return;
      const g = ensureImgGallery(row);
      console.log("[row-paste] gallery:", g ? "有" : "无(null)");
      handleImgPaste(e, g, row);
    });
    // 编辑态：row 级 drop zone（支持文件拖入）
    attachRowDropZone(row);
  }

  // 图片画廊：补挂 img-del / 选中 / 添加 / 全屏查看事件
  const gallery = row.querySelector(".img-gallery");
  if (gallery && gallery.dataset.handlersBound !== "1") {
    attachImgGalleryHandlers(gallery, row);
    gallery.dataset.handlersBound = "1";
  }

  // 标题变更：不再自动拉图，用户需手动点击「🔄 重拉图片」
  // (removed auto wiki fetch on input/blur)
}

function dayTimeline(d){

    `<!-- 万神殿看点 -->
    <div class="info-card"><h4>🏛️ 万神殿 Pantheon · 看点 & 拍照指南</h4>
    <div class="highlight">💡 万神殿是古罗马保存最完好的建筑（公元 126 年建成），2000 年来一直在使用——最初是罗马神庙，现在是天主教堂。</div>
    <table class="meal-table"><tr><th class="col-narrow">时长</th><th>看点</th><th>说明</th><th>参考图</th></tr>
    <tr><td>10 min</td><td><b>穹顶 + 天窗（Oculus）</b></td><td>直径 43.3 米，世界上最大的无钢筋混凝土穹顶（直到 1913 年才被超越）。中央天窗直径 9 米，是殿内唯一的自然光源。天窗正下方地面上有排水孔——下雨时雨水会直接落进来</td><td><img src="https://commons.wikimedia.org/wiki/Special:FilePath/Interior_oculus_of_the_Rome_Pantheon.jpg" style="width:120px;height:auto;border-radius:6px;" loading="lazy" onerror="this.style.display='none'"/></td></tr>
    <tr><td>5 min</td><td><b>拉斐尔墓</b></td><td>入口左侧第三个壁龛，大理石石棺上刻着 "Ille hic est Raphael"（这里躺着拉斐尔）。上面是他学生洛伦泽托雕刻的圣母像</td><td><img src="https://commons.wikimedia.org/wiki/Special:FilePath/Raphael%27s_tomb_Pantheon_Rome.jpg" style="width:120px;height:auto;border-radius:6px;" loading="lazy" onerror="this.style.display='none'"/></td></tr>
    <tr><td>5 min</td><td><b>维托里奥·埃马努埃莱二世墓</b></td><td>意大利统一后第一位国王的墓，在拉斐尔墓对面</td><td></td></tr>
    <tr><td>10 min</td><td><b>广场 Piazza della Rotonda</b></td><td>万神殿正前方的广场，中央有埃及方尖碑 + 喷泉。站在广场对角线拍万神殿正立面 + 方尖碑</td><td><img src="https://commons.wikimedia.org/wiki/Special:FilePath/Pantheon_exterior_2.jpg" style="width:120px;height:auto;border-radius:6px;" loading="lazy" onerror="this.style.display='none'"/></td></tr>
    <tr><td>10 min</td><td><b>内部环顾</b></td><td>七座壁龛（原为罗马诸神，现为天主教圣人），彩色大理石地板（公元 2 世纪原物）</td><td><img src="https://commons.wikimedia.org/wiki/Special:FilePath/The_Pantheon_dome%2C_Rome_%28Ank_Kumar%29_01.jpg" style="width:120px;height:auto;border-radius:6px;" loading="lazy" onerror="this.style.display='none'"/></td></tr></table>
    <div style="margin-top:6px;font-weight:800;color:var(--pink-deep);">📷 拍照技巧</div>
    <table><tr><th>技巧</th><th>说明</th></tr>
    <tr><td>穹顶</td><td>站在正中央仰拍，天窗的光圈 + 穹顶凹陷的方格（coffer）层次感</td></tr>
    <tr><td>正门</td><td>从广场南侧回拍，门廊的 16 根花岗岩柱（每根 60 吨，从埃及运来）</td></tr>
    <tr><td>内部光线</td><td>10 月下午 13:30，天窗的光柱投射在内壁，光斑会随着时间移动——站在光柱里拍照</td></tr></table></div>`,

    `<!-- 圣依纳爵堂 -->
    <div class="info-card"><h4>⛪ 圣依纳爵堂 · 看点</h4>
    <table class="meal-table"><tr><th>看点</th><th>位置</th><th>说明</th><th>参考图</th></tr>
    <tr><td><b>⭐ 天顶透视画《圣依纳爵升天》</b></td><td>教堂中殿天花板</td><td>平顶天花板上画出了一个假的穹顶和天空，圣依纳爵在云层中升入天堂，四大洲的化身在四角注视。站在中央大理石圆盘（地面标记）上仰头看，透视效果最完美</td><td><img src="https://commons.wikimedia.org/wiki/Special:FilePath/Triumph_of_St._Ignatius_of_Loyola%2C_ceiling_fresco_by_Andrea_Pozzo.jpg" style="width:120px;height:auto;border-radius:6px;" loading="lazy" onerror="this.style.display='none'"/></td></tr>
    <tr><td><b>⭐ 假穹顶（Fake Dome）</b></td><td>十字交叉处上方</td><td>原本应该建穹顶的位置，Pozzo 画了一个以假乱真的穹顶——实际是平的画布，但从正下方看完全是立体的穹顶</td><td><img src="https://commons.wikimedia.org/wiki/Special:FilePath/San_ignazio_pozzo_rome_999i90002.jpg" style="width:120px;height:auto;border-radius:6px;" loading="lazy" onerror="this.style.display='none'"/></td></tr>
    <tr><td><b>镜子</b></td><td>中殿中央</td><td>地面放置了一面大镜子，不用仰头就能看到天顶画的反射，很多人排队看镜子</td><td></td></tr>
    <tr><td><b>圣依纳爵墓</b></td><td>左侧耳堂</td><td>耶稣会创始人的墓，Lapis Lazuli 青金石镶嵌</td><td><img src="https://commons.wikimedia.org/wiki/Special:FilePath/Frescos_of_Ignatius_of_Loyola_HDR.jpg" style="width:120px;height:auto;border-radius:6px;" loading="lazy" onerror="this.style.display='none'"/></td></tr>
    <tr><td><b>Piazza di Sant'Ignazio</b></td><td>教堂外广场</td><td>18 世纪洛可可风格的弧形建筑围成的小广场，像剧院舞台布景，从广场角落拍全景</td><td><img src="https://commons.wikimedia.org/wiki/Special:FilePath/Iglesia_de_San_Ignacio_de_Loyola%2C_Roma%2C_Italia%2C_2022-09-15%2C_DD_27-29_HDR.jpg" style="width:120px;height:auto;border-radius:6px;" loading="lazy" onerror="this.style.display='none'"/></td></tr></table>
    <div style="margin-top:6px;font-weight:800;color:var(--pink-deep);">👀 怎么看</div>
    <table><tr><th class="col-narrow">步骤</th><th>操作</th></tr>
    <tr><td>1</td><td>进门先走到中央，找到地面上的大理石圆盘标记，站在上面仰头看天顶——这是 Pozzo 设计的"最佳观赏点"</td></tr>
    <tr><td>2</td><td>走到十字交叉处看假穹顶——从侧面看你会发现它是平的，但回到中央看又是立体的</td></tr>
    <tr><td>3</td><td>投 1 欧可用专用反光镜，用镜子看天顶画的反射（不用仰头）</td></tr>
    <tr><td>4</td><td>出教堂后拍广场的弧形建筑——这是罗马最精致的洛可可小广场</td></tr></table></div>`,

    `<!-- 特雷维喷泉 -->
    <div class="info-card"><h4>⛲ 特雷维喷泉 · 拍照指南</h4>
    <div class="highlight">💡 投币仪式：背对喷泉，右手持硬币从左肩抛入——1 枚 = 重返罗马，2 枚 = 找到爱情，3 枚 = 结婚</div>
    <div class="warn">🎫 门票：从广场上免费观赏；每天（包括本月第一个星期日）9:00 至 22:00 进入内景区（"卡蒂诺"）需支付 €2。购票方式：①现场自助售票机（仅刷卡/手机，最快）②官网 https://www.fontanaditrevi.roma.it/ ③市立博物馆/游客信息中心/合作销售点（可现金/银行卡）。门票无固定时段，不收取额外售票费。</div>
    <table><tr><th>机位</th><th>说明</th><th>参考图</th></tr>
    <tr><td><b>右侧台阶高处</b></td><td>不要挤到喷泉正前方——走到喷泉右侧的台阶上，从高处往下拍，人少视角好</td><td><img src="https://commons.wikimedia.org/wiki/Special:FilePath/Trevi_Fountain%2C_Rome%2C_Italy_2_-_May_2007.jpg" style="width:120px;height:auto;border-radius:6px;" loading="lazy" onerror="this.style.display='none'"/></td></tr>
    <tr><td><b>左侧教堂台阶</b></td><td>Chiesa dei Santi Vincenzo e Anastasio 教堂门口的台阶上——第二个高处机位，能看到喷泉 + 人群的层次感</td><td><img src="https://commons.wikimedia.org/wiki/Special:FilePath/Rome%2C_Italy%2C_The_Trevi_Fountain_%28Fontana_di_Trevi%29.jpg" style="width:120px;height:auto;border-radius:6px;" loading="lazy" onerror="this.style.display='none'"/></td></tr>
    <tr><td><b>Via del Lavatore</b></td><td>喷泉旁的小巷，有几家 gelato 店和纪念品店</td><td><img src="https://commons.wikimedia.org/wiki/Special:FilePath/Rome%2C_Italy%2C_Neptune_%28Ocean%29_of_Fontana_di_Trevi_2.jpg" style="width:120px;height:auto;border-radius:6px;" loading="lazy" onerror="this.style.display='none'"/></td></tr></table>
    <div style="margin-top:6px;font-weight:800;color:#7a4a00;">💡 周六下午人仍然多，如果人实在太多，先喝杯咖啡等 15 分钟，旅行团一波一波的，总有空隙。</div></div>`,

    `<!-- 西班牙广场 -->
    <div class="info-card"><h4>⛲ 西班牙广场 · 看点 &amp; 拍照 &amp; 小知识</h4>
    <div class="highlight">💡 西班牙广场的名字来自 17 世纪的西班牙大使馆，但阶梯是法国人出钱建的、教堂是法国的、方尖碑是罗马的、喷泉是意大利的——一个广场容下了半个欧洲的角力。</div>
    <table class="meal-table"><colgroup><col style="width:28%"><col style="width:72%"></colgroup><tr><th>看点</th><th>说明</th></tr>
    <tr><td><b>⭐ 西班牙阶梯（Scalinata di Trinità dei Monti）</b></td><td>135 级巴洛克阶梯，分三段。走到最上面回头看——阶梯 + 广场 + 远处罗马屋顶的层次感</td></tr>
    <tr><td><b>⭐ 破船喷泉（Fontana della Barcaccia）</b></td><td>广场中央，Pietro Bernini（贝尼尼的父亲）1627 年设计。形状像一艘半沉的船——传说 1598 年台伯河洪水后真有一条船搁浅在这个位置</td></tr>
    <tr><td><b>Trinità dei Monti 教堂</b></td><td>阶梯顶端，16 世纪法国教堂。正立面两侧各有一座钟楼</td></tr>
    <tr><td><b>Sallustian 方尖碑</b></td><td>阶梯顶端教堂前方，罗马帝国时期的埃及方尖碑（仿制）</td></tr>
    <tr><td><b>🕯️ 济慈-雪莱故居（Keats-Shelley House）</b></td><td>广场右侧 26 号，济慈 1821 年在这栋楼里去世。现在是小型文学博物馆（€6，30 min 可看完，文学爱好者可选）</td></tr>
    <tr><td><b>🛍️ Via dei Condotti（孔多蒂街）</b></td><td>广场正前方延伸的奢侈品街——Gucci、Prada、Bulgari、Valentino……是罗马的「蒙特拿破仑」。不进店只看橱窗也值得走一段</td></tr></table>
    <div style="margin-top:6px;font-weight:800;color:var(--pink-deep);">📷 拍照提示</div>
    <table><tr><th>机位</th><th>说明</th></tr>
    <tr><td>阶梯 + 方尖碑同框</td><td>站在广场底部偏右的位置，低角度仰拍——方尖碑、教堂双塔、阶梯弧线全部在画面里</td></tr>
    <tr><td>从阶梯顶往下拍</td><td>下午 16:00 光线从西南方向来，阶梯被照亮，广场上的人影拉长</td></tr>
    <tr><td>破船喷泉特写</td><td>下午光打在喷泉的白色大理石上，船头和船尾的浮雕细节最丰富</td></tr></table>
    <div style="margin-top:6px;font-weight:800;color:#7a4a00;">💡 小知识</div>
    <div style="font-size:12px;margin-top:2px;">• 西班牙台阶因《罗马假日》赫本吃冰淇淋的场景而闻名，但 2019 年起罗马禁止在阶梯上吃东西——最高罚款 €250<br>• 每年 4 月西班牙广场会摆满粉色杜鹃花，10 月没有花但人也会少很多<br>• 附近还有济慈-雪莱纪念故居，济慈在这里去世</div></div>`,

    listRowHTML({ type:"activity", icon:"5", name:"古罗马广场 Foro Romano（外观）", time:"17:00 - 17:40", action:"不进 · 免费观景台俯瞰全景", note:"Campidoglio 广场后侧 · 帝国大道 · 维托里亚诺露台" }),
    `<!-- 古罗马广场外观 -->

    listRowHTML({ type:"transport", icon:"🚶", name:"午餐 → 圣母百花大教堂", time:"13:00 - 13:10", action:"步行 10min", note:"Via Panicale 往南 → Via dei Cerretani → 广场出现" }),
    listRowHTML({ type:"activity", icon:"1", name:"圣母百花大教堂（外观 + 广场）", time:"13:10 - 13:50", action:"是否登顶需讨论 · 阿雯建议免费游览 or 洗礼堂套票", note:"开放 10:15–16:00 · 大教堂免费排队 · 着装要求膝盖+肩膀遮盖" }),
    `<!-- 圣母百花大教堂 -->
    <div class="info-card"><h4>⛪ 圣母百花大教堂 · 门票 & 排队</h4>
    <div class="highlight">💡 大教堂免费入内，只有一个入口（南侧）。周六下午 14:00 排队约 20–30 分钟，没有安检，但着装要求：膝盖 + 肩膀遮盖（跟圣彼得大教堂一样严格）。</div>
    <div style="margin-top:8px;font-weight:800;color:var(--pink-deep);">🎫 门票类型</div>
    <table class="meal-table"><tr><th>区域</th><th>价格</th><th>说明</th></tr>
    <tr><td>大教堂（Cathedral）</td><td><b>免费</b></td><td>排队入内，周六下午 14:00 排队约 20–30 分钟</td></tr>
    <tr><td><b>⭐ 穹顶登顶（Brunelleschi's Dome）</b></td><td>€30（Brunelleschi Pass，含所有：穹顶登顶+钟楼+洗礼堂+博物馆+地宫）</td><td>463 阶，无电梯，需提前预约时段，周六大概率约满。建筑爱好者建议买穹顶通票</td></tr>
    <tr><td>钟楼（Giotto's Campanile）</td><td>€20（钟楼+洗礼堂+博物馆+地宫，无穹顶）</td><td>414 阶，同样需要预约</td></tr>
    <tr><td>洗礼堂（Baptistery）</td><td>€15（洗礼堂+博物馆+地宫，无登顶）</td><td>天花板金色马赛克《最后的审判》</td></tr>
    <tr><td>Museo dell'Opera del Duomo</td><td>含在套票中</td><td>教堂博物馆，Ghiberti 的《天堂之门》真品在此</td></tr></table>
    <div style="font-size:10px;color:#888;margin-top:4px;">⚠️ 所有票在网上买的时候就要选好日期，从那天开始三天有效，但每个项目只能用一次。不能提前进入。钟楼和穹顶时间在买票时就必须选好时间段。</div>
    <div style="margin-top:8px;font-weight:800;color:var(--pink-deep);">👀 大教堂看什么</div>
    <table class="meal-table"><tr><th>看点</th><th>位置</th><th>说明</th><th class="col-narrow">门票</th><th>示意图</th></tr>
    <tr><td><b>⭐ 大教堂外立面</b></td><td>正前方</td><td>白 + 绿 + 粉三色大理石几何图案，19 世纪新哥特式立面，站在广场西南角拍全景</td><td>免费</td><td><img src="https://commons.wikimedia.org/wiki/Special:FilePath/Santa_Maria_del_Fiore.jpg" style="width:120px;height:auto;border-radius:6px;" loading="lazy" onerror="this.style.display='none'"/></td></tr>
    <tr><td><b>⭐ 布鲁内莱斯基穹顶</b></td><td>教堂上方</td><td>1436 年建成，当时世界上最大的穹顶（直径 45.5m），红色陶瓦 + 白色肋拱，从广场任何一个角落都能看到</td><td>免费看外观</td><td><img src="https://commons.wikimedia.org/wiki/Special:FilePath/Dome_of_Cattedrale_di_Santa_Maria_del_Fiore_(Florence).jpg" style="width:120px;height:auto;border-radius:6px;" loading="lazy" onerror="this.style.display='none'"/></td></tr>
    <tr><td><b>乔托钟楼</b></td><td>教堂右侧</td><td>82m 高，绿白红三色大理石，可以登顶（414 阶）俯瞰佛罗伦萨</td><td>登顶 €20</td><td><img src="https://commons.wikimedia.org/wiki/Special:FilePath/CampanileGiotto-01.jpg" style="width:120px;height:auto;border-radius:6px;" loading="lazy" onerror="this.style.display='none'"/></td></tr>
    <tr><td><b>圣乔瓦尼洗礼堂</b></td><td>教堂正前方</td><td>佛罗伦萨最古老的建筑（11 世纪），洛伦佐·吉贝尔蒂的《天堂之门》（东门，镀金青铜浮雕，原作在 Museo dell'Opera）</td><td>免费看外观</td><td><img src="https://commons.wikimedia.org/wiki/Special:FilePath/Baptistery,_Florence.jpg" style="width:120px;height:auto;border-radius:6px;" loading="lazy" onerror="this.style.display='none'"/></td></tr>
    <tr><td><b>Museo dell'Opera del Duomo</b></td><td>教堂后方</td><td>大教堂博物馆，穹顶原始模型 + 天堂之门原作 + 米开朗基罗的《圣母怜子》（他为自己墓设计的）</td><td>€15</td><td></td></tr></table></div>`,
    `<!-- 画小猫的爷爷 -->
    <div class="info-card"><h4>🐱 画小猫的爷爷 · Alessandro Buccoliero</h4>
    <div class="highlight">💡 佛罗伦萨街头艺术家，专门画小猫肖像。比较耗时，随缘。</div>
    <table><tr><th>项目</th><th>说明</th></tr>
    <tr><td>艺术家</td><td>Alessandro Buccoliero，可 INS 提前沟通时间，但不能预约</td></tr>
    <tr><td>取号</td><td>不管是否在 INS 上跟爷爷预约，请于 <b>13:30</b> 到乔托钟楼旁边的区域定制画像，每天大概发 6–7 个号</td></tr>
    <tr><td>流程</td><td>拿到号以后，爷爷记录小猫信息，回家画线稿，第二天同样的时间找爷爷上色，大概 15min 一张</td></tr>
    <tr><td>价格</td><td>一只 €15/张，两只 €20/张</td></tr></table>
    <div style="margin-top:6px;font-weight:800;color:#7a4a00;">📍 在哪里找他</div>
    <table><tr><th>位置</th><th>说明</th></tr>
    <tr><td><b>主要位置</b></td><td>Piazza del Duomo 到 Via dei Calzaiuoli 之间的路段，通常在 Duomo 广场南侧或 Via dei Calzaiuoli 的起点</td></tr>
    <tr><td><b>备选位置</b></td><td>Piazza della Repubblica（共和广场）的拱廊下</td></tr></table></div>`,
    listRowHTML({ type:"activity", icon:"·", name:"共和广场 + 沿街小店", time:"13:50 - 14:50", action:"从 Duomo 广场出发，沿 Via dei Calzaiuoli 逛小店", note:"佛罗伦萨最热闹的步行街 · 两侧全是店铺" }),
    `<!-- Via dei Calzaiuoli 沿街小店 -->
    <div class="info-card"><h4>🛍️ Via dei Calzaiuoli 沿街小店</h4>
    <div class="highlight">💡 沿 Via dei Calzaiuoli 往南走，这是佛罗伦萨最热闹的步行街，两侧全是店铺（Zara、H&M、意大利品牌 + 小精品店）。</div>
    <table class="meal-table"><tr><th>店铺</th><th>类型</th><th>说明</th></tr>
    <tr><td><div><b>Officina Profumo-Farmaceutica di Santa Maria Novella</b></div><a class="gmaps-btn" href="https://www.google.com/maps/search/?api=1&query=Officina+Profumo+Farmaceutica+di+Santa+Maria+Novella+Via+della+Scala+16+Firenze" target="_blank" title="Google Maps 导航"><span class="gmaps-pin">📍</span>导航</a></td><td>药妆/香水</td><td>佛罗伦萨最古老的药房（1221 年），玫瑰水、Pot-Pourri 干花香包、Acqua di Santa Maria Novella 香水，包装像 17 世纪的药瓶</td></tr>
    <tr><td><div><b>Pineider</b></div><a class="gmaps-btn" href="https://www.google.com/maps/search/?api=1&query=Pineider+Via+dei+Calzaiuoli+Firenze" target="_blank" title="Google Maps 导航"><span class="gmaps-pin">📍</span>导航</a></td><td>文具/皮具</td><td>1774 年开业的佛罗伦萨文具品牌，手工信纸、蜡封、钢笔，意大利最好的文具之一</td></tr>
    <tr><td><div><b>Madova</b></div><a class="gmaps-btn" href="https://www.google.com/maps/search/?api=1&query=Madova+Via+dei+Guicciardini+Firenze" target="_blank" title="Google Maps 导航"><span class="gmaps-pin">📍</span>导航</a></td><td>手套</td><td>佛罗伦萨手工皮手套，羊皮内衬丝绸，颜色几十种，冬天手感好到哭</td></tr>
    <tr><td><div><b>Rivoire</b></div><a class="gmaps-btn" href="https://www.google.com/maps/search/?api=1&query=Rivoire+Piazza+della+Signoria+Firenze" target="_blank" title="Google Maps 导航"><span class="gmaps-pin">📍</span>导航</a></td><td>甜品/巧克力</td><td>1872 年开业，热巧克力 + 手工巧克力，在领主广场旁边</td></tr>
    <tr><td><div><b>Caffè Gilli</b></div><a class="gmaps-btn" href="https://www.google.com/maps/search/?api=1&query=Caffe+Gilli+Piazza+della+Repubblica+Firenze" target="_blank" title="Google Maps 导航"><span class="gmaps-pin">📍</span>导航</a></td><td>咖啡</td><td>1733 年开业，佛罗伦萨最古老的咖啡馆之一，站着喝一杯 Espresso €1.5，或坐在共和广场拱廊下喝 Aperol Spritz €12</td></tr></table>
    <div class="warn" style="margin-top:6px;">💡 皮具购物建议：Day 4 在 San Lorenzo 露天市场建议「不要买皮具」，因为那里的货参差不齐。今天在 Via dei Calzaiuoli 和 Oltrarno 看到的皮具质量好得多。如果想买皮包/钱包/皮夹克，留到下午 Oltrarno 的手工皮具店——那里是真的工匠自己做。</div></div>`,
    listRowHTML({ type:"activity", icon:"·", name:"领主广场 Piazza della Signoria", time:"14:50 - 15:10", action:"路过看一眼 · 露天雕塑博物馆", note:"全部免费 · 24 小时开放" }),
    `<!-- 领主广场 -->
    <div class="info-card"><h4>🏛️ 领主广场 · 露天雕塑博物馆</h4>
    <div class="highlight">💡 领主广场是佛罗伦萨的政治心脏，从 13 世纪起就是佛罗伦萨共和国的权力中心。这里是一个露天雕塑博物馆，全部免费。</div>
    <table class="meal-table"><tr><th>看点</th><th>位置</th><th>说明</th><th>示意图</th></tr>
    <tr><td><b>⭐ 旧宫 Palazzo Vecchio</b></td><td>广场正面</td><td>1299 年建，佛罗伦萨市政厅，94m 高的 Arnolfo 塔是佛罗伦萨天际线的一部分。门口有大卫像的复制品（原作在学院美术馆）</td><td><img src="https://commons.wikimedia.org/wiki/Special:FilePath/Firenze_Palazzo_della_Signoria%2C_better_known_as_the_Palazzo_Vecchio.jpg" style="width:120px;height:auto;border-radius:6px;" loading="lazy" onerror="this.style.display='none'"/></td></tr>
    <tr><td><b>⭐ 佣兵凉廊 Loggia dei Lanzi</b></td><td>旧宫右侧</td><td>14 世纪建的露天雕塑廊，切利尼的《珀尔修斯与美杜莎》（青铜原作！）+ 詹博洛尼亚的《掠夺萨宾妇女》（一整块大理石雕刻的螺旋构图）</td><td><img src="https://commons.wikimedia.org/wiki/Special:FilePath/Sculptures_in_the_Loggia_dei_Lanzi.jpg" style="width:120px;height:auto;border-radius:6px;" loading="lazy" onerror="this.style.display='none'"/></td></tr>
    <tr><td><b>海神喷泉</b></td><td>广场中央</td><td>阿曼纳蒂设计，海神 + 四匹海马，米开朗基罗曾嘲笑它"浪费了大理石"</td><td><img src="https://commons.wikimedia.org/wiki/Special:FilePath/Firenze_-_Florence_-_Piazza_della_Signoria_-_View_South_on_Neptune_Fountain,_Judith_and_Holofernes_%26_David.jpg" style="width:120px;height:auto;border-radius:6px;" loading="lazy" onerror="this.style.display='none'"/></td></tr>
    <tr><td><b>科西莫一世骑马像</b></td><td>广场北侧</td><td>詹博洛尼亚作品，美第奇家族第一代大公</td><td><img src="https://commons.wikimedia.org/wiki/Special:FilePath/Cosimo_Medici_Piazza_signoria_Florence.jpg" style="width:120px;height:auto;border-radius:6px;" loading="lazy" onerror="this.style.display='none'"/></td></tr>
    <tr><td><b>多纳泰罗《朱迪斯与霍洛芬斯》</b></td><td>旧宫门口左侧</td><td>多纳泰罗的青铜雕塑（原作在旧宫内部，外面是复制品）</td><td><img src="https://commons.wikimedia.org/wiki/Special:FilePath/Judith_and_Holofernes,_Donatello_Florenz-01.jpg" style="width:120px;height:auto;border-radius:6px;" loading="lazy" onerror="this.style.display='none'"/></td></tr></table></div>`,
    listRowHTML({ type:"transport", icon:"🚶", name:"领主广场 → 圣三一桥", time:"15:20 - 15:30", action:"步行 10min", note:"沿 Via Por Santa Maria 往南 → 过河即到" }),
    listRowHTML({ type:"activity", icon:"2", name:"圣三一桥 Ponte Santa Trinita", time:"15:30 - 15:50", action:"拍个照 · 拍老桥最经典机位", note:"佛罗伦萨最优雅的桥 · 四座四季雕塑" }),
    `<!-- 圣三一桥 -->
    <div class="info-card"><h4>🌉 圣三一桥 · 为什么值得来</h4>
    <div class="highlight">💡 圣三一桥（Ponte Santa Trinita）被认为是佛罗伦萨最优雅的桥。比老桥更精致，比任何一座桥都更上镜。</div>
    <table class="meal-table"><tr><th>看点</th><th>说明</th><th class="col-narrow">示意图</th></tr>
    <tr><td><b>⭐ 四座寓意雕塑</b></td><td>桥的四角各有一座大理石雕像，代表四季：春（Primavera）、夏（Estate）、秋（Autunno）、冬（Inverno）。1569 年 Ammannati 设计，据传 Michelangelo 参与了方案</td><td><img src="https://commons.wikimedia.org/wiki/Special:FilePath/Ponte_santa_trinita_florence.jpg" style="width:100px;height:auto;border-radius:6px;" loading="lazy" onerror="this.style.display='none'"/></td></tr>
    <tr><td><b>桥上视角</b></td><td>站在桥中央看老桥（往东）——这是拍老桥最经典的机位，桥 + 阿诺河 + Vasari 走廊全在画框里</td><td><img src="https://commons.wikimedia.org/wiki/Special:FilePath/Ponte_Vecchio_from_Ponte_Santa_Trinita_Blue_hour.jpg" style="width:100px;height:auto;border-radius:6px;" loading="lazy" onerror="this.style.display='none'"/></td></tr>
    <tr><td><b>椭圆拱形</b></td><td>三座优雅的椭圆拱，是文艺复兴桥梁工程的杰作。二战时被德军炸毁，1958 年用原石料打捞重建</td><td></td></tr></table>
    <div style="margin-top:8px;font-weight:800;color:var(--pink-deep);">📸 拍照机位</div>
    <div style="font-size:11px;margin-top:2px;">• 桥中央往东拍老桥（经典机位）<br>• 桥中央往西拍 Ponte alla Carraia + 远处山丘<br>• 四季雕塑 + 阿诺河背景</div></div>`,
    listRowHTML({ type:"transport", icon:"🚶", name:"圣三一桥 → Oltrarno 街区", time:"15:50", action:"过桥即到 · 步行 5min", note:"" }),
    listRowHTML({ type:"activity", icon:"3", name:"Oltrarno 街区", time:"15:50 - 17:10", action:"逛本地特色小店 · 如果今天逛不完 Day 6 可以继续来", note:"Via Maggio 古董街 · Via Santo Spirito 工匠作坊 · 手工皮具店" }),
    `<!-- Oltrarno 街区 -->
    <div class="info-card"><h4>🛍️ Oltrarno 街区 · 逛什么</h4>
    <div class="highlight">💡 Oltrarno 的精髓在于「不经意地发现」——推开一扇半掩的门，里面可能是一个工匠在工作台前忙了 30 年。看到感兴趣的店就进去，跟工匠聊两句（他们大多会说一些英语）。</div>
    <table class="meal-table"><tr><th>街道</th><th>类型</th><th>看点</th></tr>
    <tr><td><b>⭐ Via Maggio</b></td><td>古董一条街</td><td>佛罗伦萨最著名的古董街，从 16 世纪家具到 Art Deco 灯具都有。即使不买，逛橱窗也像逛博物馆。Romano 和 Guido Bartolozzi 等古董商已在这条街经营几代人</td></tr>

    <tr><td><b>⭐ Piazza della Passera</b></td><td>隐秘小广场</td><td>Day 4 晚餐的 4 Leoni 就在这。广场周围有几家小型工匠工作室，加上 Gelateria della Passera（Buontalenti 口味冰淇淋——传说中是 gelato 的发明者配方）</td></tr>

    `<!-- 学院美术馆入场 -->
    <div class="info-card"><h4>🎫 入场</h4>
    <div class="highlight">12:20 到门口，找到「Reserved / Prenotato」队伍（不是「Without Reservation」长队）。<b>一人一码</b>：每个人都要有自己的预约码，不能共用。</div>
    <div class="highlight">🎫 <b>取票流程（两步排队）</b>：① 先去「拿取预约号」窗口排队领号 → ② 再排队到取票窗口，<b>一起取票</b>（把所有人的预约码一次性交给工作人员，一起出票）。取到票后统一排队进馆。</div>
    <div class="highlight">12:30 准时入场，进门直接往最里面走——David 在尽头。</div>
    <div class="warn">学院美术馆 90% 的人只看 David 就走了。但他们错过了真正值得看的东西。</div></div>`,
    `<!-- 学院美术馆精华路线 -->
    <div class="info-card"><h4>🗿 精华路线（1h30）</h4>
    <table class="meal-table"><tr><th class="col-narrow">顺序</th><th class="col-narrow">时长</th><th>看点</th><th>为什么重要</th><th class="col-narrow">示意图</th></tr>
    <tr><td>1</td><td>15 min</td><td><span class="star">⭐</span> Hall of the Prisoners（囚徒厅）</td><td>这是比 David 更能让你理解 Michelangelo 的地方。四座未完成的雕塑——《觉醒的奴隶》《年轻的奴隶》《阿特拉斯》《有胡子的奴隶》——人形从大理石中挣扎出来，像是被石头困住。Michelangelo 说「雕塑就是把多余的大理石去掉」，这里你亲眼看到这个过程</td><td><img src="https://commons.wikimedia.org/wiki/Special:FilePath/Michelangelo_-_Atlas.jpg" style="width:100px;height:auto;border-radius:6px;" loading="lazy" onerror="this.style.display='none'"/></td></tr>
    <tr><td>2</td><td>15 min</td><td><span class="star">⭐⭐⭐</span> David</td><td>站在 Tribuna 中央，5.17m 高，头顶穹顶天窗的自然光。绕一圈看——正面是冷静的决断，侧面是紧绷的肌肉，背面是投石带（slingshot）藏在手里。这是 1501–1504 年，Michelangelo 26 岁时的作品</td><td><img src="https://commons.wikimedia.org/wiki/Special:FilePath/Michelangelo%27s_David_-_right_view.jpg" style="width:100px;height:auto;border-radius:6px;" loading="lazy" onerror="this.style.display='none'"/></td></tr>
    <tr><td>3</td><td>10 min</td><td>St. Matthew</td><td>Michelangelo 另一件未完成作品，1505 年。圣马太从石头中浮现，半完成状态比完成品更有张力</td><td><img src="https://commons.wikimedia.org/wiki/Special:FilePath/Michelangelo_buonarroti,_san_matteo,_1505-1506_circa,_non-finito_per_il_duomo_di_firenze.jpg" style="width:100px;height:auto;border-radius:6px;" loading="lazy" onerror="this.style.display='none'"/></td></tr>
    <tr><td>4</td><td>15 min</td><td><span class="star">⭐</span> Hall of the Colossus（巨像厅）</td><td>15–16 世纪祭坛画，包括 Botticelli、Perugino、Filippino Lippi。重点看 Botticelli 的《Madonna of the Sea》——这是他在 Uffizi 的《春》《维纳斯的诞生》之外的另一种风格</td><td><img src="https://commons.wikimedia.org/wiki/Special:FilePath/Botticelli,_madonna_del_Mare.jpg" style="width:100px;height:auto;border-radius:6px;" loading="lazy" onerror="this.style.display='none'"/></td></tr>
    <tr><td>5</td><td>15 min</td><td><span class="star">⭐</span> Musical Instruments Museum（乐器博物馆）</td><td>藏在学院美术馆深处，大多数人直接跳过，但这是全欧洲最好的历史乐器收藏之一。Stradivari 1690 年的中提琴、1650 年的大键琴、Bartolomeo Cristofori 最早期的钢琴——他是美第奇家族的乐器制造师，钢琴的发明者</td><td><img src="https://commons.wikimedia.org/wiki/Special:FilePath/Museo_degli_strumenti_musicali,_firenze,_02.JPG" style="width:100px;height:auto;border-radius:6px;" loading="lazy" onerror="this.style.display='none'"/></td></tr>
    <tr><td>6</td><td>10 min</td><td>Gipsoteca Bartolini（石膏模型馆）</td><td>19 世纪雕塑家 Lorenzo Bartolini 的石膏模型，如果你对 19 世纪雕塑感兴趣；如果累了可以跳过，省体力给乌菲兹</td><td></td></tr>
    <tr><td>7</td><td>5 min</td><td>13–14 世纪展厅</td><td>出口前的金底圣像画（Gold-ground panels），Giotto 及其追随者。这是文艺复兴前的「黎明」——在隔壁 Uffizi 你将看到这个黎明如何变成正午</td><td></td></tr></table></div>`,
    `<!-- 再看 David -->
    <div class="info-card"><h4>👀 再看 David</h4>
    <div class="highlight">如果你在学院美术馆只做一件事，花 15 分钟站在 David 面前，绕三圈。</div>
    <table><tr><th class="col-narrow">圈</th><th>看什么</th><th class="col-narrow">示意图</th></tr>
    <tr><td>第一圈（正面）</td><td>看他凝视远方的表情——不是已经胜利的骄傲，而是战斗前的冷静判断。这跟 Donatello 的 David（头戴帽、踩着 Goliath 的头、已经赢了）完全不同</td><td><img src="https://commons.wikimedia.org/wiki/Special:FilePath/%27David%27_by_Michelangelo_FI_Acca_JBS_003.jpg" style="width:100px;height:auto;border-radius:6px;" loading="lazy" onerror="this.style.display='none'"/></td></tr>
    <tr><td>第二圈（侧面）</td><td>看他右手暴起的血管、紧绷的颈部和前臂肌肉——Michelangelo 对人体的解剖学理解超越了所有同时代人</td><td><img src="https://commons.wikimedia.org/wiki/Special:FilePath/Michelangelo%27s_David_-_right_view.jpg" style="width:100px;height:auto;border-radius:6px;" loading="lazy" onerror="this.style.display='none'"/></td></tr>
    <tr><td>第三圈（背面）</td><td>注意他左手握着的投石带——David 的武器不是剑，而是智慧和技巧。佛罗伦萨人把 David 看作自己的象征：小城市用智慧战胜大国（米兰、教皇国）</td><td><img src="https://commons.wikimedia.org/wiki/Special:FilePath/%27David%27_by_Michelangelo_FI_Acca_JBS_019.jpg" style="width:100px;height:auto;border-radius:6px;" loading="lazy" onerror="this.style.display='none'"/></td></tr></table></div>`,
